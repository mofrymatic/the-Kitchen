<body>
  <main id="shell" aria-label="Cave Racer arcade game">
    <canvas id="scene" width="480" height="270"></canvas>

    <section id="audioPanel" hidden aria-label="AUXOR audio settings">
      <div class="aux-card" role="dialog" aria-modal="true" aria-labelledby="auxTitle">
        <header class="aux-head"><div><h2 id="auxTitle">AUXOR · CAVE RACER</h2><p>151 BPM · MIDI-DERIVED ADAPTIVE FLIGHT ENGINE</p></div><button class="aux-close" id="audioClose" type="button" aria-label="Close audio settings">×</button></header>
        <div class="aux-grid">
          <label class="aux-row"><span class="aux-copy"><strong>Source Variation</strong><small>Three treatments derived from the uploaded MIDI: two source-contour cells plus an interpolated extrapolation that fills selected gaps without replacing the original contour.</small></span><span class="aux-control"><select id="musicVariation"><option value="afterburn">AFTERBURN · SOURCE CONTOUR</option><option value="redline">REDLINE · REFRAIN CELL</option><option value="vector">VECTOR · INTERPOLATED</option></select></span></label>
          <label class="aux-row"><span class="aux-copy"><strong>Music Style</strong><small>The current ZITTRIS-style arrangement matrix: one MIDI-derived contour, multiple orchestration grammars.</small></span><span class="aux-control"><select id="musicStyle"><option value="med_wave">MED WAVE</option><option value="witch_house">WITCH HOUSE</option><option value="g_funk">G-FUNK</option><option value="klezmer">KLEZMER</option><option value="jungle">JUNGLE</option><option value="uk_rnb">UK R&amp;B</option><option value="acidcore">ACIDCORE</option><option value="deep_house">DEEP HOUSE</option><option value="trap">TRAP</option><option value="uk_drill">UK DRILL</option><option value="psytrance">PSYTRANCE</option><option value="triphop">TRIP-HOP</option><option value="dubstep">DUBSTEP</option><option value="liquid_dnb">LIQUID D&amp;B</option><option value="viking_metal">VIKING METAL</option><option value="industrial_techno">INDUSTRIAL TECHNO</option></select></span></label>
          <label class="aux-row"><span class="aux-copy"><strong>Adaptive Flight Mix</strong><small>Boost, near-miss pressure, wave progression, and collisions alter density and energy without changing the selected source variation.</small></span><span class="aux-control"><span class="aux-switch"><input id="adaptiveMusic" type="checkbox"><span></span></span></span></label>
          <label class="aux-row"><span class="aux-copy"><strong>Background Music</strong><small>Web Audio arrangement with the Tetris-era 42% Intaglio Galactica relief layer, frymatic-style legato low end, and a guarded high-frequency ceiling.</small></span><span class="aux-control"><span class="aux-switch"><input id="bgmEnabled" type="checkbox"><span></span></span></span></label>
          <label class="aux-row"><span class="aux-copy"><strong>Sound Effects</strong><small>Rounded cape swoop, boost ignition, collision, wave, pause, and obliteration cues. No brittle click/clap transient layer.</small></span><span class="aux-control"><span class="aux-switch"><input id="sfxEnabled" type="checkbox"><span></span></span></span></label>
          <label class="aux-row"><span class="aux-copy"><strong>Music Level</strong><small>Independent music bus gain.</small></span><span class="aux-control"><input id="musicVolume" type="range" min="0" max="100" step="1"></span></label>
          <label class="aux-row"><span class="aux-copy"><strong>SFX Level</strong><small>Independent effects bus gain.</small></span><span class="aux-control"><input id="sfxVolume" type="range" min="0" max="100" step="1"></span></label>
        </div>

      <span><b>X / SPACE</b> HYPERFLOW</span>

<script>
(() => {
  'use strict';

  const shell = document.getElementById('shell');
  const canvas = document.getElementById('scene');
  const hudCanvas = document.getElementById('hud');
  const ctx = canvas.getContext('2d', {alpha:false, desynchronized:true}) || canvas.getContext('2d', {alpha:false});
  const hud = hudCanvas.getContext('2d', {alpha:true, desynchronized:true}) || hudCanvas.getContext('2d', {alpha:true});

  const W=960,H=540,TAU=Math.PI*2;
  const IS_FIREFOX=/firefox/i.test(navigator.userAgent||'');
  if(IS_FIREFOX) document.body.classList.add('firefox');

  let renderScale=IS_FIREFOX?0.42:0.5;
  let quality=IS_FIREFOX?0.72:1;
  let frameEMA=16.7, qualityTimer=0, hudDpr=1;
  const BASE_SPEED=760,MAX_CRUISE=1120,BOOST_MULT=1.95;
  const BOOST_DRAIN=34,BOOST_RECHARGE=18,HOP_IMPULSE=-315,HOP_COOLDOWN=.12;
  const PLAYER_R=12,WAVE_DISTANCE=11800,SEG=12;
  const GRID_SPACING=24,GRID_COLS=Math.ceil(W/GRID_SPACING)+3,GRID_ROWS=Math.ceil(H/GRID_SPACING)+2,GRID_SPAN=GRID_COLS*GRID_SPACING;
  const MAX_SPAWNS={sparks:220,trail:110,rings:28};

  const PALETTES=[
    {wallA:'#ff1f78',wallB:'#ff5024',edge:'#ffd15c',grid:'#20eaff',hud:'#ff294b'},
    {wallA:'#dd20ff',wallB:'#ff205e',edge:'#ff91ee',grid:'#41a9ff',hud:'#ff345e'},
    {wallA:'#ff3e32',wallB:'#ff9a16',edge:'#fff06b',grid:'#32ffd2',hud:'#ff293f'},
    {wallA:'#7150ff',wallB:'#ff1cb1',edge:'#93fbff',grid:'#28cfff',hud:'#ff2c66'}
  ];

  const keys=Object.create(null),touches=new Map();
  const grid=[],sparks=[],rings=[];
  const trail=Array.from({length:MAX_SPAWNS.trail},()=>({worldX:0,y:H/2,vy:0,boost:0,valid:false}));
  let trailHead=0,trailCount=0,lastTrailWorldX=-1e9;
  let stars=[],lastTime=performance.now(),shake=0,hitFlash=0,boostFlash=0,pauseLatch=false;

  const state={
    phase:'start',paused:false,time:0,distance:0,score:0,highScore:loadHighScore(),wave:1,lives:3,
    speed:BASE_SPEED,targetSpeed:BASE_SPEED,playerX:W*.235,playerY:H*.5,playerVY:0,
    pitch:0,pitchVel:0,inputLift:0,boost:100,boosting:false,boostLock:0,invulnerable:0,
    nearMiss:0,combo:1,comboTimer:0,hopCooldown:0
  };

  function loadHighScore(){try{return Number(localStorage.getItem('caveRacerV3HighScore')||0)}catch(_){return 0}}
  function saveHighScore(v){try{localStorage.setItem('caveRacerV3HighScore',String(v))}catch(_){}}
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  const lerp=(a,b,t)=>a+(b-a)*t;
  function rgba(hex,a){const n=parseInt(hex.slice(1),16);return 'rgba(' + ((n>>16)&255) + ',' + ((n>>8)&255) + ',' + (n&255) + ',' + a + ')'}
  function palette(){return PALETTES[(state.wave-1)%PALETTES.length]}
  function round(v){return Math.round(v)}


  // ── AUXOR adaptive audio runtime ──────────────────────────────────────
  // The melodic contours below are quantized from the user-supplied MIDI at
  // 16th-note resolution. They are embedded so Cave Racer remains standalone.
  const AUXOR_MANIFEST=Object.freeze({
    game:'cave_racer',sound_family:'fts_arcade',runtime:'web_audio',tempo_bpm:151,
    composition:'user_supplied_midi_adaptation',source_midi:'Kenny Loggins - Danger Zone.mid.mid',
    polyphony_limit:10,working_depth:'32_bit_float',delivery_depth:'16_bit',sample_rate_hz:48000,
    variations:['afterburn','redline','vector'],
    styles:['med_wave','witch_house','g_funk','klezmer','jungle','uk_rnb','acidcore','deep_house','trap','uk_drill','psytrance','triphop','dubstep','liquid_dnb','viking_metal','industrial_techno'],
    aesthetic_overlay:{name:'intaglio_galactica',amount:.42},
    states:['idle','cruise','boost','near_miss','wave','game_over'],
    safeguards:{treble_hit_amount:.10,high_shelf_hz:3800,lowpass_hz:5200}
  });

    for(let x=-SEG*2;x<=W+SEG*2;x+=SEG){const c=caveAt(x);samples.push({x:x,top:c.top,bottom:c.bottom})}

  }

  function initGrid(){
    grid.length=0;

  function resetTrail(){trailHead=0;trailCount=0;lastTrailWorldX=-1e9;recordTrail(true)}
  function recordTrail(force){

    const t=trail[trailHead];t.worldX=worldX;t.y=state.playerY;t.vy=state.playerVY;t.boost=state.boosting?1:0;t.valid=true;

  }
  function trailPoint(indexFromOldest){

  }
  function trailSample(worldX){
    if(trailCount<2)return null;
    const first=trailPoint(0),last=trailPoint(trailCount-1);
    if(worldX<first.worldX||worldX>last.worldX)return null;
    let lo=0,hi=trailCount-1;

  function applyWake(dt){
    const wakeLength=state.boosting?610:420;
    const baseRadius=state.boosting?84:66,maxRadius=state.boosting?205:148;
    const baseForce=(state.boosting?330:175)*dt*(0.8+quality*0.4);
    const playerWorldX=state.distance+state.playerX;
    for(let i=0;i<grid.length;i++){
      const p=grid[i];
      const nodeWorldX=state.distance+p.ax;
      const dxTrail=playerWorldX-nodeWorldX;
      if(dxTrail>4&&dxTrail<wakeLength){
        const s=trailSample(nodeWorldX);
        if(s){
          const cone=lerp(baseRadius,maxRadius,Math.pow(dxTrail/wakeLength,.68));
          const dy=p.ay-s.y,ad=Math.abs(dy);
          if(ad<cone){
            const tail=Math.pow(1-dxTrail/wakeLength,.48),radial=Math.pow(1-ad/cone,1.08);
            const shell=Math.exp(-Math.pow((ad-cone*.55)/Math.max(10,cone*.22),2));
            const core=Math.exp(-Math.pow(ad/Math.max(10,cone*.24),2));
            const wave=Math.sin(dxTrail*.055-state.time*.011+s.vy*.006+p.r*.38);
            const f=baseForce*tail*(radial*.74+shell*.92+core*.34)*(1+s.boost*.42);
            const sign=dy===0?(p.r&1?1:-1):Math.sign(dy);

            p.energy=Math.min(2.0,p.energy+f*.06);

      const localX=p.ax-state.playerX;
      const localY=p.ay-state.playerY;
      const ax=Math.abs(localX), ay=Math.abs(localY);
      const nx=state.boosting?185:145, ny=state.boosting?130:108;

          p.energy=Math.min(2.1,p.energy+force*.16);
        }
      }
    }
  }

  function updateGrid(dt){
    const scroll=state.phase==='play'&&!state.paused?state.speed*dt:0;
    const spring=20,damp=Math.pow(.83,dt*60);
    for(let i=0;i<grid.length;i++){
      const p=grid[i];
      p.ax-=scroll;
      if(p.ax<-GRID_SPACING*1.5){p.ax+=GRID_SPAN;p.x+=GRID_SPAN;resetNode(p)}
      p.vx+=(p.ax-p.x)*spring*dt;
      p.vy+=(p.ay-p.y)*spring*dt;
      p.vx*=damp;p.vy*=damp;p.x+=p.vx*dt;p.y+=p.vy*dt;p.energy*=Math.pow(.90,dt*60);

      const a=node(c,r),b=node(c,r+1);ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y)
    }

    // schlieren partner line that makes it legible against either cave wall.
    ctx.globalCompositeOperation='screen';
    ctx.strokeStyle='rgba(255,255,255,'+(0.22*intensity)+')';ctx.lineWidth=1.15;ctx.shadowColor=p.grid;ctx.shadowBlur=(quality>.65&&!IS_FIREFOX)?9:0;
    ctx.beginPath();ctx.ellipse(13,0,24+speedNorm*9,48+speedNorm*16,0,-1.03,1.03);ctx.stroke();
    ctx.shadowBlur=0;ctx.globalCompositeOperation='source-over';ctx.strokeStyle='rgba(0,0,0,.19)';ctx.lineWidth=3.4;ctx.beginPath();ctx.ellipse(16,0,26+speedNorm*9,51+speedNorm*16,0,-1.0,1.0);ctx.stroke();

    // Nested Mach sheets. Each sheet is a paired upper/lower curved ray whose
    // apparent registration drifts backward, echoing the stacked bands in the
    // reference image while remaining readable at Cave Racer's pixel scale.
    for(let i=0;i<layers;i++){
      const drift=(flow+i*42/layers)%42;
      const apexX=-8-i*24-drift*.36;
      const len=245+i*38+speedNorm*95;
      const spread=Math.tan(coneAngle)*(len*.92)+(i*10);
      const alpha=(.12+i*.016)*intensity*(1-i/(layers+2));
      const drawSheet=(sign)=>{
        ctx.globalCompositeOperation='source-over';ctx.strokeStyle='rgba(0,0,0,'+(alpha*.82)+')';ctx.lineWidth=5.2-i*.35;ctx.beginPath();ctx.moveTo(apexX,sign*(3+i*.7));ctx.bezierCurveTo(apexX-len*.28,sign*(spread*.18),apexX-len*.68,sign*(spread*.72),apexX-len,sign*spread);ctx.stroke();
        ctx.globalCompositeOperation='screen';ctx.strokeStyle=i%2?rgba(p.grid,alpha):'rgba(255,255,255,'+(alpha*.92)+')';ctx.lineWidth=1.05+i*.08;ctx.shadowColor=i%2?p.grid:'#fff';ctx.shadowBlur=(quality>.7&&!IS_FIREFOX)?6:0;ctx.beginPath();ctx.moveTo(apexX,sign*(1+i*.4));ctx.bezierCurveTo(apexX-len*.28,sign*(spread*.18),apexX-len*.68,sign*(spread*.72),apexX-len,sign*spread);ctx.stroke();
      };
      drawSheet(-1);drawSheet(1);
    }

    // A few near-field compression ribs give the flyer a visible pocket of
    // distorted air without turning the whole playfield into a screen shake.
    ctx.shadowBlur=0;ctx.globalCompositeOperation='screen';
    for(let i=0;i<4;i++){
      const x=-24-i*34-(flow*.25);const r=18+i*11+speedNorm*8;
      ctx.globalAlpha=(.19-i*.03)*intensity;ctx.strokeStyle=i%2?p.wallA:p.grid;ctx.lineWidth=1.1;ctx.beginPath();ctx.ellipse(x,0,r*1.75,r*.62,0,0,TAU);ctx.stroke();
    }
    ctx.restore();
  }

  function drawTiltDepth(){
    const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'rgba(0,0,0,0.26)');
    g.addColorStop(.14,'rgba(8,4,22,0.13)');
    g.addColorStop(.32,'rgba(0,0,0,0.02)');
    g.addColorStop(.68,'rgba(0,0,0,0.02)');
    g.addColorStop(.86,'rgba(8,4,22,0.13)');
    g.addColorStop(1,'rgba(0,0,0,0.28)');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    const c=ctx.createRadialGradient(W*.52,H*.5,10,W*.52,H*.5,H*.55);
    c.addColorStop(0,'rgba(255,255,255,0.03)');
    c.addColorStop(.58,'rgba(255,255,255,0.012)');
    c.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=c;ctx.fillRect(0,0,W,H);
  }

  function startGame(){
    Object.assign(state,{phase:'play',paused:false,time:0,distance:0,score:0,wave:1,lives:3,speed:BASE_SPEED,targetSpeed:BASE_SPEED,playerX:W*.235,playerY:H*.5,playerVY:0,pitch:0,pitchVel:0,inputLift:0,boost:100,boosting:false,boostLock:0,invulnerable:0,nearMiss:0,combo:1,comboTimer:0,hopCooldown:0});
    shake=0;hitFlash=0;boostFlash=0;sparks.length=0;rings.length=0;lastAudioWave=1;initGrid();resetTrail();AUXOR.resetPhrase();reconcileAuxor();
  }
  function endGame(){state.phase='over';state.boosting=false;AUXOR.sfx('game_over');reconcileAuxor();if(state.score>state.highScore){state.highScore=Math.floor(state.score);saveHighScore(state.highScore)}}
  function hitWall(c){
    if(state.invulnerable>0)return;
    state.lives--;state.invulnerable=1.18;state.playerVY*=-.42;state.playerY=clamp(state.playerY,c.top+PLAYER_R+9,c.bottom-PLAYER_R-9);state.boost=Math.max(0,state.boost-25);state.boosting=false;state.boostLock=.52;state.combo=1;state.comboTimer=0;hitFlash=1;shake=Math.max(shake,19);spawnSpark(state.playerX,state.playerY,palette().edge,24,1.2);spawnRing(state.playerX,state.playerY,palette().hud,1.1);AUXOR.sfx('hit');if(state.lives<=0)endGame();
  }

  function update(dt){
    state.time+=dt*1000;updateStars(dt);updateSparks(dt);updateRings(dt);hitFlash=Math.max(0,hitFlash-dt*3.7);boostFlash=Math.max(0,boostFlash-dt*2.8);shake*=Math.pow(.06,dt);
    if(state.phase!=='play'||state.paused){updateGrid(dt);return}

    state.invulnerable=Math.max(0,state.invulnerable-dt);state.boostLock=Math.max(0,state.boostLock-dt);state.hopCooldown=Math.max(0,state.hopCooldown-dt);
    const wantsBoost=keys.Space||keys.KeyX||touchMode('boost');
    const canBoost=wantsBoost&&state.boost>.5&&state.boostLock<=0;
    if(canBoost&&!state.boosting){boostFlash=1;shake=Math.max(shake,8);spawnSpark(state.playerX-18,state.playerY,palette().grid,14,1.1);spawnRing(state.playerX-8,state.playerY,palette().grid,1.2);AUXOR.sfx('boost')}
    state.boosting=!!canBoost;
    if(state.boosting){state.boost=Math.max(0,state.boost-BOOST_DRAIN*dt);if(state.boost<=.01){state.boosting=false;state.boostLock=.72}}else state.boost=Math.min(100,state.boost+BOOST_RECHARGE*dt);

    const cruise=Math.min(MAX_CRUISE,BASE_SPEED+state.distance*.00145);state.targetSpeed=cruise*(state.boosting?BOOST_MULT:1);state.speed=lerp(state.speed,state.targetSpeed,1-Math.pow(state.boosting?.00018:.012,dt));
    state.playerX=lerp(state.playerX,state.boosting?W*.35:W*.235,1-Math.pow(.008,dt));

    const gravity=720;
    state.playerVY+=gravity*dt;
    state.playerVY*=Math.pow(.90,dt*60);
    state.playerVY=clamp(state.playerVY,-430,610);
    state.playerY+=state.playerVY*dt;
    state.pitch=clamp(state.playerVY/780,-.18,.28);

    state.distance+=state.speed*dt;recordTrail(false);updateGrid(dt);const nextWave=1+Math.floor(state.distance/WAVE_DISTANCE);if(nextWave>lastAudioWave){lastAudioWave=nextWave;AUXOR.sfx('wave')}state.wave=nextWave;state.score+=state.speed*dt*(state.boosting?.25:.115)*state.combo;
    const c=caveAt(state.playerX),ct=state.playerY-PLAYER_R-c.top,cb=c.bottom-(state.playerY+PLAYER_R),clearance=Math.min(ct,cb);
    if(clearance<0)hitWall(c);else if(clearance<25){state.nearMiss=Math.min(1,state.nearMiss+dt*5);state.comboTimer+=dt;if(state.comboTimer>.52){state.combo=Math.min(5,state.combo+.25);state.comboTimer=0}if(Math.random()<dt*18)spawnSpark(state.playerX+2,ct<cb?c.top:c.bottom,palette().edge,1,.7)}else{state.nearMiss=Math.max(0,state.nearMiss-dt*2.5);state.comboTimer=Math.max(0,state.comboTimer-dt);if(state.comboTimer<=0)state.combo=lerp(state.combo,1,1-Math.pow(.34,dt))}
    const rate=(state.boosting?68:24)*(0.65+quality*0.35);if(Math.random()<rate*dt)spawnSpark(state.playerX-16,state.playerY+(Math.random()-.5)*11,palette().grid,state.boosting?2:1,state.boosting?1.0:.52);
    if(state.boosting&&Math.random()<dt*9)spawnRing(state.playerX-28,state.playerY,palette().grid,.38);AUXOR.updateAdaptiveState();
  }

  function cyberFrame(g,p){
    g.save();
    g.strokeStyle=rgba(p.hud,.78);
    g.shadowColor=p.hud;
    g.shadowBlur=2.5;
    g.lineWidth=1.15;

    const m=14,s=12,ix=26,iy=26;
    g.beginPath();
    g.moveTo(m+s,m);g.lineTo(W-m-s,m);g.lineTo(W-m-s,m+s);g.lineTo(W-m,m+s);
    g.lineTo(W-m,H-m-s);g.lineTo(W-m-s,H-m-s);g.lineTo(W-m-s,H-m);g.lineTo(m+s,H-m);
    g.lineTo(m+s,H-m-s);g.lineTo(m,H-m-s);g.lineTo(m,m+s);g.lineTo(m+s,m+s);g.closePath();
    g.stroke();

    g.globalAlpha=.42;
    g.strokeStyle=rgba(p.grid,.55);
    g.beginPath();
    g.moveTo(ix+s,iy);g.lineTo(W-ix-s,iy);g.lineTo(W-ix-s,iy+s);g.lineTo(W-ix,iy+s);
    g.moveTo(W-ix,H-iy-s);g.lineTo(W-ix-s,H-iy-s);g.lineTo(W-ix-s,H-iy);g.lineTo(ix+s,H-iy);
    g.moveTo(ix,iy+s);g.lineTo(ix,iy+34);
    g.moveTo(W-ix,iy+s);g.lineTo(W-ix,iy+34);
    g.moveTo(ix,H-iy-s);g.lineTo(ix,H-iy-34);
    g.moveTo(W-ix,H-iy-s);g.lineTo(W-ix,H-iy-34);
    g.stroke();

    g.globalAlpha=.24;
    g.fillStyle=rgba('#ffffff',.9);
    const blocks=[[m,m],[W-m-s,m],[m,H-m-s],[W-m-s,H-m-s],[m,iy+36],[W-m-s,iy+36],[m,H-iy-48],[W-m-s,H-iy-48]];
    for(let i=0;i<blocks.length;i++){const b=blocks[i];g.fillRect(round(b[0]),round(b[1]),s,s)}

    g.globalAlpha=.22;
    g.strokeStyle=rgba(p.wallA,.7);
    g.lineWidth=.7;
    for(let i=0;i<3;i++){
      const y=88+i*8;
      g.beginPath();g.moveTo(38,y);g.lineTo(58+i*6,y);g.stroke();
      g.beginPath();g.moveTo(W-38,y);g.lineTo(W-(58+i*6),y);g.stroke();
    }
    for(let i=0;i<3;i++){
      const y=H-88-i*8;
      g.beginPath();g.moveTo(38,y);g.lineTo(58+i*6,y);g.stroke();
      g.beginPath();g.moveTo(W-38,y);g.lineTo(W-(58+i*6),y);g.stroke();
    }

    g.globalAlpha=.26;
    crispText(g,'MM // IN // ∆',W*.5,H-23,'700 9px "Courier New",monospace',rgba(p.grid,.9),'center',null,'rgba(0,0,0,.7)');
    g.restore();
  }

  function crispText(g,text,x,y,font,fill,align,glow,stroke){
    g.font=font;g.textAlign=align||'left';g.textBaseline='top';g.fillStyle=fill||'#fff';g.shadowColor=glow||'transparent';g.shadowBlur=glow?2.5:0;
    const rx=round(x), ry=round(y);
    if(stroke){g.lineWidth=2;g.strokeStyle=stroke;g.strokeText(text,rx,ry)}
    g.fillText(text,rx,ry);
  }

  function drawHud(p){
    hud.clearRect(0,0,W,H);
    hud.save();
    crispText(hud,'FTS',26,20,'700 10px "Courier New",monospace',p.hud,'left',p.hud,'rgba(0,0,0,.85)');
    crispText(hud,'ARCADE',26,31,'700 10px "Courier New",monospace',p.grid,'left',p.grid,'rgba(0,0,0,.85)');
    crispText(hud,'SPEED',26,59,'700 12px "Courier New",monospace',p.hud,'left',p.hud,'rgba(0,0,0,.85)');
    crispText(hud,String(Math.round(state.speed*5.6)).padStart(4,'0'),26,73,'700 25px "Courier New",monospace','#fff','left',p.hud,'rgba(0,0,0,.9)');
    crispText(hud,'KM/H',27,101,'700 10px "Courier New",monospace',p.hud,'left',p.hud,'rgba(0,0,0,.85)');
    crispText(hud,'SCORE ' + String(Math.floor(state.score)).padStart(7,'0'),26,126,'700 16px "Courier New",monospace',p.grid,'left',p.grid,'rgba(0,0,0,.9)');
    hud.globalAlpha=.7;
    crispText(hud,'BEST ' + String(Math.floor(state.highScore)).padStart(7,'0'),27,148,'700 10px "Courier New",monospace','#dfeaff','left',null,'rgba(0,0,0,.85)');

    hud.globalAlpha=1;
    crispText(hud,'BRAZEN',W-26,20,'700 13px "Courier New",monospace',p.hud,'right',p.hud,'rgba(0,0,0,.85)');
    crispText(hud,'FULL THROTTLE',W-26,39,'700 10px "Courier New",monospace',p.hud,'right',p.hud,'rgba(0,0,0,.85)');
    crispText(hud,'WAVE',W-26,63,'700 11px "Courier New",monospace',p.hud,'right',p.hud,'rgba(0,0,0,.85)');
    crispText(hud,String(state.wave).padStart(2,'0'),W-26,77,'700 27px "Courier New",monospace','#fff','right',p.hud,'rgba(0,0,0,.9)');
    crispText(hud,'FLOW x' + state.combo.toFixed(1),W-26,113,'700 10px "Courier New",monospace',p.hud,'right',p.hud,'rgba(0,0,0,.85)');

    const bx=25,by=H-47,bw=250,bh=13;
    crispText(hud,'BOOST',bx,by-16,'700 10px "Courier New",monospace',p.hud,'left',p.hud,'rgba(0,0,0,.85)');
    hud.shadowBlur=0;hud.strokeStyle=rgba(p.hud,.85);hud.lineWidth=1;hud.strokeRect(round(bx)+.5,round(by)+.5,bw,bh);
    const gg=hud.createLinearGradient(bx,0,bx+bw,0);gg.addColorStop(0,p.grid);gg.addColorStop(1,p.wallA);hud.fillStyle=gg;hud.fillRect(bx+2,by+2,(bw-4)*state.boost/100,bh-4);
    const integrity=Math.max(0,Math.round(state.lives/3*100));
    crispText(hud,'INTEGRITY',W-26,by-16,'700 10px "Courier New",monospace',p.hud,'right',p.hud,'rgba(0,0,0,.85)');
    crispText(hud,String(integrity) + '%',W-26,by-1,'700 18px "Courier New",monospace','#fff','right',p.hud,'rgba(0,0,0,.9)');
    crispText(hud,state.boosting?'>>>> HYPERFLOW >>>>':'>>>> CRUISE >>>>',W/2,20,'700 13px "Courier New",monospace',state.boosting?'#fff':'#53ff64','center',state.boosting?p.grid:'#53ff64','rgba(0,0,0,.85)');
    cyberFrame(hud,p);
    hud.restore();
  }

  function drawOverlay(p){
    if(state.phase==='play'&&!state.paused)return;
    hud.save();hud.fillStyle='rgba(1,2,8,.79)';hud.fillRect(0,0,W,H);hud.textAlign='center';hud.textBaseline='middle';
    if(state.paused){
      crispText(hud,'PAUSED',W/2,H/2-12,'800 54px "Courier New",monospace',p.hud,'center',p.hud,'rgba(0,0,0,.95)');
      crispText(hud,'P / ESC TO RESUME',W/2,H/2+46,'700 14px "Courier New",monospace','#fff','center',null,'rgba(0,0,0,.9)');
      hud.restore();return;
    }
    const title=state.phase==='over'?'OBLITERATED':'CAVE RACER';
    const grad=hud.createLinearGradient(W*.3,0,W*.7,0);grad.addColorStop(0,p.grid);grad.addColorStop(.48,'#fff');grad.addColorStop(.52,p.hud);grad.addColorStop(1,p.wallA);
    crispText(hud,title,W/2,H/2-78,'900 68px "Courier New",monospace',grad,'center',p.hud,'rgba(0,0,0,.95)');
    crispText(hud,'FTS ARCADE  //  BRAZEN',W/2,H/2-23,'700 13px "Courier New",monospace',p.hud,'center',p.hud,'rgba(0,0,0,.9)');
    crispText(hud,state.phase==='over'?('SCORE ' + Math.floor(state.score) + '  ·  WAVE ' + state.wave):'FULL THROTTLE. NO LIMITS.',W/2,H/2+14,'700 16px "Courier New",monospace','#fff','center',null,'rgba(0,0,0,.9)');
    crispText(hud,'Z / ↑ HOP     X / SPACE BOOST',W/2,H/2+51,'600 13px "Courier New",monospace','rgba(203,229,245,.92)','center',null,'rgba(0,0,0,.9)');
    crispText(hud,'LEFT TAP HOPS. RIGHT TAP BOOSTS. Y-MOTION NOW PUSHES THE GRID.',W/2,H/2+78,'600 13px "Courier New",monospace','rgba(203,229,245,.84)','center',null,'rgba(0,0,0,.9)');
    const pulse=.55+Math.sin(state.time*.0045)*.35;hud.globalAlpha=pulse;
    crispText(hud,state.phase==='over'?'PRESS R OR TAP TO RUN AGAIN':'PRESS ANY CONTROL OR TAP TO BEGIN',W/2,H/2+123,'700 13px "Courier New",monospace',p.hud,'center',p.hud,'rgba(0,0,0,.95)');
    hud.restore();
  }

  function drawScene(){
    const p=palette(),c=buildCave(),sx=shake>.1?(Math.random()-.5)*shake:0,sy=shake>.1?(Math.random()-.5)*shake*.6:0;
    ctx.fillStyle='#020208';ctx.fillRect(0,0,W,H);
    ctx.save();ctx.translate(sx,sy);drawSpeedLines(p);drawGrid(p);drawRibbon(p);drawCave(c,p);drawFlowWake(p);drawBoostShockwave(p);drawRings();drawSparks();drawPlayer(p);drawTiltDepth();
    if(state.nearMiss>.02){ctx.fillStyle=rgba(p.edge,state.nearMiss*.06);ctx.fillRect(0,0,W,H)}
    ctx.restore();
    if(boostFlash>0){const g=ctx.createRadialGradient(state.playerX,state.playerY,8,state.playerX,state.playerY,330);g.addColorStop(0,rgba(p.grid,boostFlash*.22));g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
    if(hitFlash>0){ctx.fillStyle='rgba(255,35,20,' + (hitFlash*.22) + ')';ctx.fillRect(0,0,W,H)}
    drawHud(p);drawOverlay(p);
  }

  function touchMode(m){for(const v of touches.values())if(v===m)return true;return false}
  function pointerMode(clientX){const r=shell.getBoundingClientRect(),x=(clientX-r.left)/r.width;return x<.5?'hop':'boost'}
  function hop(){begin();if(state.phase==='play'&&!state.paused&&state.hopCooldown<=0){state.playerVY=HOP_IMPULSE;state.hopCooldown=HOP_COOLDOWN;AUXOR.sfx('hop');spawnRing(state.playerX-6,state.playerY,palette().grid,.25);spawnSpark(state.playerX-10,state.playerY+8,palette().grid,4,.42)}}
  function begin(){AUXOR.unlock();if(state.phase!=='play')startGame();reconcileAuxor()}
  function togglePause(){if(state.phase!=='play'||!document.getElementById('audioPanel').hidden)return;state.paused=!state.paused;lastTime=performance.now();AUXOR.sfx('pause');reconcileAuxor()}

  window.addEventListener('keydown',e=>{
    if(['ArrowUp','Space'].includes(e.code))e.preventDefault();
    if(e.code==='KeyO'){openAudioPanel();return}
    if(e.code==='KeyM'){auxorSettings.bgm=!auxorSettings.bgm;saveAuxorSettings();AUXOR.applyVolumes();reconcileAuxor();return}
    if(e.code==='KeyR'){startGame();return}
    if((e.code==='KeyP'||e.code==='Escape')&&!pauseLatch){pauseLatch=true;togglePause();return}
    if(['ArrowUp','KeyW','KeyZ'].includes(e.code)&&!keys[e.code])hop();
    keys[e.code]=true;if(['KeyX','Space'].includes(e.code))begin();
  },{passive:false});
  window.addEventListener('keyup',e=>{keys[e.code]=false;if(e.code==='KeyP'||e.code==='Escape')pauseLatch=false});

  canvas.addEventListener('pointerdown',e=>{e.preventDefault();try{canvas.setPointerCapture(e.pointerId)}catch(_){}const mode=pointerMode(e.clientX);if(mode==='hop'){hop();touches.set(e.pointerId,'hop-used')}else{touches.set(e.pointerId,'boost');begin()}});
  canvas.addEventListener('pointermove',e=>{if(touches.get(e.pointerId)==='boost'&&pointerMode(e.clientX)!=='boost')touches.delete(e.pointerId)});
  const endPointer=e=>touches.delete(e.pointerId);canvas.addEventListener('pointerup',endPointer);canvas.addEventListener('pointercancel',endPointer);canvas.addEventListener('contextmenu',e=>e.preventDefault());

  const hopButton=document.getElementById('hopButton'),boostButton=document.getElementById('boostButton');
  hopButton.addEventListener('pointerdown',e=>{e.preventDefault();hop()});
  boostButton.addEventListener('pointerdown',e=>{e.preventDefault();touches.set('boostButton','boost');begin()});
  const releaseBoost=()=>touches.delete('boostButton');boostButton.addEventListener('pointerup',releaseBoost);boostButton.addEventListener('pointercancel',releaseBoost);boostButton.addEventListener('pointerleave',releaseBoost);

  document.addEventListener('visibilitychange',()=>{lastTime=performance.now();for(const k of Object.keys(keys))keys[k]=false;touches.clear();if(document.hidden&&state.phase==='play')state.paused=true;reconcileAuxor()});
  window.addEventListener('resize',configureCanvases,{passive:true});
  if('ResizeObserver' in window){new ResizeObserver(configureCanvases).observe(shell)}



  document.getElementById('audioButton').addEventListener('click',e=>{e.preventDefault();e.stopPropagation();openAudioPanel()});
  document.getElementById('audioClose').addEventListener('click',()=>closeAudioPanel(false));
  document.getElementById('audioSave').addEventListener('click',()=>closeAudioPanel(true));
  document.getElementById('audioPanel').addEventListener('pointerdown',e=>e.stopPropagation());
  document.getElementById('musicVariation').addEventListener('change',()=>{readAudioPanel();AUXOR.resetPhrase();updateAuxorNow()});
  document.getElementById('musicStyle').addEventListener('change',()=>{readAudioPanel();AUXOR.resetPhrase();updateAuxorNow()});
  document.getElementById('musicVolume').addEventListener('input',()=>{readAudioPanel();AUXOR.applyVolumes()});
  document.getElementById('sfxVolume').addEventListener('input',()=>{readAudioPanel();AUXOR.applyVolumes()});

  function frame(now){const dt=Math.min(.033,Math.max(0,(now-lastTime)/1000));lastTime=now;tuneQuality(dt);update(dt);drawScene();requestAnimationFrame(frame)}
  if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches){renderScale=IS_FIREFOX?0.36:0.42;quality=.55}

  updateAuxorNow();populateAudioPanel();configureCanvases();initGrid();initStars();resetTrail();requestAnimationFrame(frame);
})();
</script>
