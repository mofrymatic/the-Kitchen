    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --neon-blue: #00d9ff;
            --neon-pink: #ff006e;
            --neon-yellow: #ffbe0b;
            --neon-green: #00ff88;
            --neon-purple: #a855f7;
            --neon-red: #ff0040;
            --dark-bg: #0a0a0f;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--dark-bg);
            font-family: 'Press Start 2P', monospace;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background: url('the-Floor.png') center center / cover no-repeat;
        }

        /* Arcade floor overlay for depth */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.3);
            pointer-events: none;
            z-index: 0;
        }

        /* CRT scan lines effect */
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.15) 0px,
                transparent 1px,
                transparent 2px,
                rgba(0, 0, 0, 0.15) 3px
            );
            pointer-events: none;
            z-index: 1000;
            animation: flicker 0.15s infinite;
        }

        @keyframes flicker {
            0%, 100% { opacity: 0.95; }
            50% { opacity: 0.98; }
        }

        /*
         * ── LAYOUT ───────────────────────────────────────────────────────────
         * Outer wrapper: overflow:hidden clips the feet in landscape.
         * align-items: safe center → centers when cabinet fits (portrait),
         *                            top-anchors when cabinet overflows (landscape).
         *
         * Scene: flex-row holding [left-clip][front-cabinet][right-clip].
         * All three children share the same continuous height formula:
         *   height = min(90vw × 1.334, 150dvh)
         *   ↳ portrait  (vw/vh < 0.83): 90vw × 1.334 wins → cabinet fits, feet visible
         *   ↳ landscape (vw/vh > 0.83): 150dvh wins       → cabinet overflows, feet gone
         * No hard breakpoint → no snap.
         * ────────────────────────────────────────────────────────────────────
         */
        .cabinet-wrapper {
            display: flex;
            align-items: safe center;
            justify-content: center;
            width: 100vw;
            height: 100dvh;
            padding-top: clamp(0.2rem, 0.5dvh, 0.5rem);
            overflow: hidden;
            position: relative;
            z-index: 1;
        }

        /* Flex row: left panel | front cabinet | right panel */
        .cabinet-scene {
            display: flex;
            align-items: flex-start;
            justify-content: center;
            flex-shrink: 0;
        }

        .arcade-container {
            position: relative;
            display: inline-block;
            line-height: 0;
            flex-shrink: 0;
        }

        /* Subtle CRT glow behind the game grid — Screen X:24.9-74.7%, Y:14-53% */
        .arcade-container::before {
            content: '';
            position: absolute;
            left: 24.9%;
            top: 14%;
            width: 49.8%;
            height: 39%;
            background: radial-gradient(ellipse at 50% 40%,
                rgba(0, 180, 255, 0.10) 0%,
                rgba(0, 80, 180, 0.05) 55%,
                transparent 75%);
            pointer-events: none;
            z-index: 1;
            animation: screenBreath 4s ease-in-out infinite;
        }

        @keyframes screenBreath {
            0%, 100% { opacity: 0.8; }
            50%       { opacity: 1.2; }
        }

        /*
         * ── CABINET & SIDE PANEL SIZING ──────────────────────────────────────
         * All three scene children use the same continuous height formula.
         *
         * Side panel pixel data (measured from source images):
         *   cabinet-left.png  (1086×1448): cabinet content x: 15.6%–75.7%
         *                                  white right padding: 27.3dvh
         *   cabinet-right.png (1024×1536): cabinet content x: 16.6%–84.7%
         *                                  white left  padding: 17.6dvh
         *
         * Each side-clip is a fixed-width overflow:hidden window. The image is
         * anchored to its inner edge so the cabinet face meets the front cabinet
         * seamlessly. mix-blend-mode:darken erases the white background against
         * the dark floor — no white seam, no compositing artifacts.
         *
         * Gradient mask fades outer edge for natural depth falloff.
         * Panels appear/disappear with a CSS transition (no snap).
         * ────────────────────────────────────────────────────────────────────
         */

        /* Shared height formula — the one source of truth */
        .cabinet-base,
        .side-clip {
            height: min(calc(90vw * 1.334), 150dvh);
        }

        .cabinet-base {
            display: block;
            width: auto;
            max-width: none;
        }

        /* Clip window for each side panel */
        .side-clip {
            position: relative;
            width: 42dvh;
            overflow: hidden;
            flex-shrink: 0;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.55s ease;
        }

        .cabinet-side {
            position: absolute;
            top: 0;
            height: 100%;
            width: auto;
            max-width: none;
            mix-blend-mode: darken; /* white bg becomes transparent on dark floor */
        }

        /* Left: right-anchor image → inner face (right content edge) at clip seam */
        .side-clip--left {
            -webkit-mask-image: linear-gradient(to right, transparent 0%, black 60%);
                    mask-image: linear-gradient(to right, transparent 0%, black 60%);
        }
        .cabinet-side--left { right: 0; }

        /* Right: left-anchor image → inner face (left content edge) at clip seam */
        .side-clip--right {
            -webkit-mask-image: linear-gradient(to left, transparent 0%, black 60%);
                    mask-image: linear-gradient(to left, transparent 0%, black 60%);
        }
        .cabinet-side--right { left: 0; }

        /* Reveal panels when viewport is wide enough to show them */
        @media (min-aspect-ratio: 4/3) {
            .side-clip { opacity: 0.9; }
        }

        /* Portrait: center full cabinet, hide side panels */
        @media (orientation: portrait) {
            .cabinet-wrapper { padding: clamp(0.5rem, 2vw, 1.5rem); }
            .side-clip        { display: none; }
        }

        /* Short landscape phones: drop top padding entirely */
        @media (orientation: landscape) and (max-height: 450px) {
            .cabinet-wrapper { padding-top: 0; }
        }

        .game-tile {
            position: absolute;
            cursor: pointer;
            z-index: 2;          /* above screen-glow pseudo-element */
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .game-tile img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: brightness(0.85) saturate(0.9);
            transition: filter 0.4s ease-out, transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* On hover: the game tile itself powers up */
        .game-tile:hover {
            z-index: 12;
        }

        .game-tile:hover img {
            filter: 
                brightness(1.4) 
                saturate(1.3) 
                drop-shadow(0 0 15px currentColor) 
                drop-shadow(0 0 30px currentColor)
                drop-shadow(0 0 45px currentColor);
            transform: scale(1.05);
            animation: tileGlow 1.5s ease-in-out infinite alternate;
        }

        @keyframes tileGlow {
            0% {
                filter: 
                    brightness(1.4) 
                    saturate(1.3) 
                    drop-shadow(0 0 15px currentColor) 
                    drop-shadow(0 0 30px currentColor)
                    drop-shadow(0 0 45px currentColor);
            }
            100% {
                filter: 
                    brightness(1.6) 
                    saturate(1.4) 
                    drop-shadow(0 0 20px currentColor) 
                    drop-shadow(0 0 40px currentColor)
                    drop-shadow(0 0 60px currentColor);
            }
        }

        /*
         * ── GAME GRID POSITIONS ──────────────────────────────────────────────
         * Screen region measured from the-Cabinet.png (1086×1448 px):
         *   X: 24.9% → 74.7%  |  Y: 14.0% → 53.0%
         *   Center: X ≈ 49.8%, Y ≈ 33.5%
         *
         * 3×2 grid: tile W=13%, H=14.5%, gap-x=1.5%, gap-y=2%
         *   Grid W = 42%  Grid H = 31%
         *   Grid left = 28.9%  (centers grid at X=49.9% ✓)
         *   Grid top  = 18.0%  (centers grid at Y=33.5% ✓)
         * ────────────────────────────────────────────────────────────────────
         */

        /* Top row  (y = 18%) */
        .neon-invaders { color: var(--neon-pink);   left: 28.9%; top: 18%;   width: 13%; height: 14.5%; }
        .astroids      { color: var(--neon-green);  left: 43.4%; top: 18%;   width: 13%; height: 14.5%; }
        .cave-racer    { color: var(--neon-blue);   left: 57.9%; top: 18%;   width: 13%; height: 14.5%; }

        /* Bottom row (y = 34.5%) */
        .red-eye       { color: var(--neon-red);    left: 28.9%; top: 34.5%; width: 13%; height: 14.5%; }
        .rc-racer      { color: var(--neon-yellow); left: 43.4%; top: 34.5%; width: 13%; height: 14.5%; }
        .tetris        { color: var(--neon-purple); left: 57.9%; top: 34.5%; width: 13%; height: 14.5%; }

        /* Tooltip on hover */
        .game-tile::after {
            content: attr(data-game);
            position: absolute;
            bottom: -40px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.9);
            color: currentColor;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: clamp(6px, 1.5vh, 10px);
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s, bottom 0.3s;
            text-shadow: 0 0 10px currentColor;
            border: 1px solid currentColor;
        }

        .game-tile:hover::after {
            opacity: 1;
            bottom: -50px;
        }

        /* Tooltip size on very small devices */
        @media (max-height: 450px) {
            .game-tile::after {
                font-size: clamp(5px, 1.2vh, 8px);
                padding: 4px 8px;
            }
        }

        /* ── EDGE VOLUME SLIDER ─────────────────────────────────────────────── */
        #edge-volume {
            position: fixed;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            z-index: 500;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            /* Docked: only icon tab visible */
            width: 44px;
            padding: 14px 10px;
            background: rgba(10, 0, 20, 0.85);
            border: 1px solid rgba(255, 0, 110, 0.3);
            border-right: none;
            border-radius: 10px 0 0 10px;
            backdrop-filter: blur(8px);
            transition: width 0.35s cubic-bezier(0.34, 1.3, 0.64, 1),
                        border-color 0.3s ease,
                        box-shadow 0.3s ease;
            overflow: hidden;
            cursor: pointer;
        }

        #edge-volume:hover,
        #edge-volume.open {
            width: 72px;
            border-color: rgba(255, 0, 110, 0.7);
            box-shadow: -4px 0 24px rgba(255, 0, 110, 0.25),
                        inset 0 0 20px rgba(255, 0, 110, 0.05);
        }

        #vol-icon {
            font-size: 14px;
            color: var(--neon-pink);
            text-shadow: 0 0 8px var(--neon-pink);
            user-select: none;
            flex-shrink: 0;
            transition: text-shadow 0.3s ease;
            line-height: 1;
        }

        #edge-volume:hover #vol-icon {
            text-shadow: 0 0 14px var(--neon-pink), 0 0 28px var(--neon-pink);
        }

        #vol-pct {
            font-family: 'Press Start 2P', monospace;
            font-size: 7px;
            color: var(--neon-blue);
            text-shadow: 0 0 6px var(--neon-blue);
            white-space: nowrap;
            letter-spacing: 0.5px;
            flex-shrink: 0;
            opacity: 0;
            transition: opacity 0.25s ease;
        }

        #edge-volume:hover #vol-pct,
        #edge-volume.open #vol-pct {
            opacity: 1;
        }

        /* Vertical slider track wrapper */
        #vol-track {
            position: relative;
            width: 20px;
            height: 140px;
            flex-shrink: 0;
            opacity: 0;
            transition: opacity 0.25s ease 0.05s;
        }

        #edge-volume:hover #vol-track,
        #edge-volume.open #vol-track {
            opacity: 1;
        }

        /* Custom track */
        #vol-track::before {
            content: '';
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 2px;
            transform: translateX(-50%);
            background: rgba(255, 0, 110, 0.2);
            border-radius: 2px;
        }

        /* Filled portion — driven by CSS var */
        #vol-track::after {
            content: '';
            position: absolute;
            left: 50%;
            bottom: 0;
            width: 2px;
            height: var(--vol-fill, 20%);
            transform: translateX(-50%);
            background: linear-gradient(to top, var(--neon-pink), var(--neon-blue));
            border-radius: 2px;
            box-shadow: 0 0 6px var(--neon-pink);
            transition: height 0.05s linear;
        }

        #vol-range {
            position: absolute;
            left: 50%;
            top: 0;
            transform: translateX(-50%) rotate(-90deg);
            transform-origin: center center;
            width: 140px;
            height: 20px;
            margin-left: -60px;
            margin-top: 60px;
            appearance: none;
            -webkit-appearance: none;
            background: transparent;
            cursor: pointer;
            outline: none;
        }

        #vol-range::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--neon-blue);
            border: 2px solid var(--neon-pink);
            box-shadow: 0 0 8px var(--neon-blue), 0 0 16px var(--neon-pink);
            transition: box-shadow 0.2s ease, transform 0.2s ease;
        }

        #vol-range::-webkit-slider-thumb:hover {
            transform: scale(1.3);
            box-shadow: 0 0 12px var(--neon-blue), 0 0 24px var(--neon-pink);
        }

        #vol-range::-moz-range-thumb {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--neon-blue);
            border: 2px solid var(--neon-pink);
            box-shadow: 0 0 8px var(--neon-blue);
            cursor: pointer;
        }

        /* Tick marks */
        #vol-ticks {
            position: absolute;
            right: -6px;
            top: 0;
            bottom: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            pointer-events: none;
        }

        .vol-tick {
            width: 4px;
            height: 1px;
            background: rgba(255, 0, 110, 0.4);
        }

        .vol-tick.major {
            width: 6px;
            background: rgba(0, 217, 255, 0.6);
        }
    </style>
</head>
<body>

      <div class="cabinet-scene">

        <!-- Left side panel -->

    <!-- ── EDGE VOLUME SLIDER ─────────────────────────────────────────────── -->
    <div id="edge-volume" title="Volume">
        <div id="vol-icon">◁)))</div>
        <div id="vol-pct">20%</div>
        <div id="vol-track">
            <div id="vol-ticks">
                <span class="vol-tick major"></span>
                <span class="vol-tick"></span>
                <span class="vol-tick"></span>
                <span class="vol-tick"></span>
                <span class="vol-tick major"></span>
                <span class="vol-tick"></span>
                <span class="vol-tick"></span>
                <span class="vol-tick"></span>
                <span class="vol-tick major"></span>
            </div>
            <input type="range" id="vol-range" min="0" max="100" value="20" step="1">
        </div>
    </div>

    <script>
        // ── AUDIO ENGINE WITH MASTER GAIN ──────────────────────────────────
        const gameTiles = document.querySelectorAll('.game-tile');
        
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();

        // Master gain — all sounds route through here
        const masterGain = audioCtx.createGain();
        masterGain.connect(audioCtx.destination);

        // Init volume from localStorage (default 20%)
        const savedVol = parseFloat(localStorage.getItem('fts-volume') ?? '20');
        masterGain.gain.value = savedVol / 100;
        
        function playHoverSound() {
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(masterGain);          // → master gain
            
            oscillator.frequency.value = 800;
            oscillator.type = 'square';
            
            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            
            oscillator.start(audioCtx.currentTime);
            oscillator.stop(audioCtx.currentTime + 0.1);
        }
        
        function playClickSound() {
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(masterGain);          // → master gain
            
            oscillator.frequency.value = 1200;
            oscillator.type = 'square';
            
            gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
            
            oscillator.start(audioCtx.currentTime);
            oscillator.stop(audioCtx.currentTime + 0.15);
        }
        
        gameTiles.forEach(tile => {
            tile.addEventListener('mouseenter', () => {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                playHoverSound();
            });
            tile.addEventListener('click', () => playClickSound());
        });

        // ── EDGE VOLUME SLIDER ─────────────────────────────────────────────
        const edgeVol   = document.getElementById('edge-volume');
        const volRange  = document.getElementById('vol-range');
        const volPct    = document.getElementById('vol-pct');
        const volTrack  = document.getElementById('vol-track');

        // Sync slider to saved value
        volRange.value = savedVol;
        volPct.textContent = Math.round(savedVol) + '%';
        volTrack.style.setProperty('--vol-fill', savedVol + '%');

        // Update icon based on level
        function updateVolIcon(pct) {
            const icon = document.getElementById('vol-icon');
            if (pct === 0)       icon.textContent = '◁';
            else if (pct < 40)   icon.textContent = '◁)';
            else if (pct < 75)   icon.textContent = '◁))';
            else                 icon.textContent = '◁)))';
        }
        updateVolIcon(savedVol);

        volRange.addEventListener('input', (e) => {
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const val = parseFloat(e.target.value);
            masterGain.gain.setTargetAtTime(val / 100, audioCtx.currentTime, 0.015);
            volPct.textContent = Math.round(val) + '%';
            volTrack.style.setProperty('--vol-fill', val + '%');
            updateVolIcon(val);
            localStorage.setItem('fts-volume', val);
        });

        // Keep open while interacting with slider
        volRange.addEventListener('mousedown', () => edgeVol.classList.add('open'));
        document.addEventListener('mouseup',   () => edgeVol.classList.remove('open'));

        // Konami code easter egg
        const konamiCode = ['ArrowUp', 'ArrowUp', 'ArrowDown', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'ArrowLeft', 'ArrowRight', 'b', 'a'];
        let konamiIndex = 0;

        document.addEventListener('keydown', (e) => {
            if (e.key === konamiCode[konamiIndex]) {
                konamiIndex++;
                if (konamiIndex === konamiCode.length) {
                    document.body.style.animation = 'rainbow 2s linear infinite';
                    const style = document.createElement('style');
                    style.textContent = `
                        @keyframes rainbow {
                            0% { filter: hue-rotate(0deg); }
                            100% { filter: hue-rotate(360deg); }
                        }
                    `;
                    document.head.appendChild(style);
                    konamiIndex = 0;
                }
            } else {
                konamiIndex = 0;
            }
        });
    </script>
</body>
</html>
