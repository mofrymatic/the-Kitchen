<style>
/* ============================================================
   RED EYE WAITLIST MODULE — v1 (hack build)
   Whitelabel-ready: every client-specific value lives in the
   WAITLIST config object in the <script> block below. Swap that
   object, not this markup, to spin up a new client's waitlist.
   ============================================================ */
:root{
  --bg:#08090b;
  --panel:#0e1014;
  --line:#1e2128;
  --ink:#e9eaee;
  --ink-dim:#8d92a0;
  --red:#e0252b;
  --red-dim:#7a1519;
  --gold:#c9a24a;
  --ok:#3fae6a;
  --err:#e0252b;
  --radius:2px;
  --font-display: 'Space Grotesk', 'Arial Narrow', Helvetica, sans-serif;
  --font-body: 'Inter', system-ui, -apple-system, sans-serif;
}
@font-face{
  font-family:'Space Grotesk';
  src:local('Space Grotesk');
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(ellipse 900px 500px at 15% -10%, rgba(224,37,43,.10), transparent 60%),
    radial-gradient(ellipse 700px 500px at 100% 0%, rgba(201,162,74,.06), transparent 55%),
    var(--bg);
  color:var(--ink);
  font-family:var(--font-body);
  line-height:1.5;
  min-height:100vh;
}
a{color:var(--gold)}

.wrap{max-width:640px;margin:0 auto;padding:0 20px 64px}

/* ---- header ---- */
header.top{
  display:flex;align-items:center;gap:14px;
  padding:28px 0 18px;
  border-bottom:1px solid var(--line);
  margin-bottom:32px;
}
.eye-mark{
  font-size:30px;line-height:1;
  filter:drop-shadow(0 0 10px rgba(224,37,43,.55));
}
.brand{display:flex;flex-direction:column;gap:2px}
.brand .name{
  font-family:var(--font-display);
  font-weight:700;font-size:22px;letter-spacing:.02em;
  color:var(--ink);
}
.brand .sub{
  font-size:12px;color:var(--ink-dim);
  letter-spacing:.14em;
}

/* ---- hero ---- */
.hero h1{
  font-family:var(--font-display);
  font-weight:700;
  font-size:clamp(28px,5vw,38px);
  line-height:1.15;
  margin:0 0 10px;
  max-width:19ch;
}
.hero p{
  color:var(--ink-dim);
  max-width:52ch;
  margin:0 0 28px;
  font-size:15.5px;
}

/* ---- form shell ---- */
form{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:28px 24px 24px;
}
fieldset{border:0;padding:0;margin:0 0 22px}
legend{
  font-size:11px;letter-spacing:.1em;color:var(--gold);
  padding:0 0 10px;font-weight:600;
}
.field{margin-bottom:18px}
.field:last-child{margin-bottom:0}
label{
  display:block;font-size:13.5px;color:var(--ink);
  margin-bottom:6px;font-weight:500;
}
label .req{color:var(--red);margin-left:2px}
label .opt{color:var(--ink-dim);font-weight:400;margin-left:4px;font-size:12px}
input[type=text],input[type=email],input[type=url],textarea{
  width:100%;
  background:#0a0b0e;
  border:1px solid var(--line);
  border-radius:var(--radius);
  color:var(--ink);
  padding:11px 12px;
  font-size:14.5px;
  font-family:inherit;
  transition:border-color .15s;
}
input::placeholder,textarea::placeholder{color:#565b69}
input:focus,textarea:focus{
  outline:none;border-color:var(--red);
  box-shadow:0 0 0 3px rgba(224,37,43,.14);
}
textarea{resize:vertical;min-height:78px}
.field small.hint{display:block;margin-top:5px;color:var(--ink-dim);font-size:11.5px}
.field small.count{display:block;margin-top:5px;color:var(--ink-dim);font-size:11px;text-align:right}

.check-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;
}
@media (max-width:420px){.check-grid{grid-template-columns:1fr}}
.check-item{
  display:flex;align-items:center;gap:9px;
  padding:10px 11px;
  background:#0a0b0e;border:1px solid var(--line);border-radius:var(--radius);
  cursor:pointer;font-size:13.5px;
}
.check-item input{width:15px;height:15px;accent-color:var(--red);flex:none}
.check-item:has(input:checked){border-color:var(--red-dim);background:rgba(224,37,43,.06)}

.consent{
  display:flex;align-items:flex-start;gap:10px;
  padding-top:4px;
}
.consent input{width:16px;height:16px;margin-top:2px;accent-color:var(--gold);flex:none}
.consent label{margin:0;font-size:13px;color:var(--ink-dim);font-weight:400}

/* honeypot — visually hidden, still tab/screen-reader reachable-safe: off-canvas not display:none */
.hp{position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden}

.err-msg{
  display:none;color:var(--err);font-size:12px;margin-top:6px;
}
.field.invalid input,.field.invalid textarea{border-color:var(--err)}
.field.invalid .err-msg{display:block}

button[type=submit]{
  width:100%;
  margin-top:6px;
  background:var(--gold);
  color:#1a1305;
  border:0;border-radius:var(--radius);
  font-family:var(--font-display);
  font-weight:700;font-size:15px;letter-spacing:.02em;
  padding:14px 18px;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:9px;
  transition:filter .15s, transform .05s;
}
button[type=submit]:hover{filter:brightness(1.08)}
button[type=submit]:active{transform:translateY(1px)}
button[type=submit]:disabled{opacity:.6;cursor:default}

.foot-note{
  margin-top:14px;font-size:11.5px;color:var(--ink-dim);text-align:center;
}

/* ---- status states ---- */
#form-status{
  display:none;
  padding:34px 24px;
  text-align:center;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:var(--radius);
}
#form-status .icon{font-size:34px;margin-bottom:10px}
#form-status h2{font-family:var(--font-display);margin:0 0 8px;font-size:20px}
#form-status p{color:var(--ink-dim);margin:0;font-size:14px}
#form-status.error{border-color:var(--red-dim)}
#form-status.error .icon{filter:none}

[aria-live]{position:relative}

footer.brand-foot{
  text-align:center;color:var(--ink-dim);font-size:11.5px;
  margin-top:30px;letter-spacing:.04em;
}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <span class="eye-mark" aria-hidden="true">👁️</span>
    <div class="brand">
      <span class="name" id="brand-name">RED EYE</span>
      <span class="sub" id="brand-sub">FTS ARCADE FLOOR</span>
    </div>
  </header>

  <div class="hero">
    <h1 id="copy-title">Add your game to FTS Arcade</h1>
    <p id="copy-lede">Join the waitlist to be considered for an arcade cabinet in the Red Eye ecosystem.</p>
  </div>

  <form id="waitlist-form" novalidate>
    <!-- fields render here from WAITLIST.fields via JS -->
  </form>

  <div id="form-status" role="status" aria-live="polite">
    <div class="icon" id="status-icon">🕹️</div>
    <h2 id="status-title">You're on the list.</h2>
    <p id="status-body">Players build the arcade. We'll follow up if it's a fit.</p>
  </div>

  <footer class="brand-foot" id="brand-foot">RED EYE &nbsp;·&nbsp; MORE GAMES. BRIGHTER WORLDS.</footer>
</div>

<iframe name="gf-sink" style="display:none" title="submission target"></iframe>

<script>
/* ==============================================================
   CONFIG — the only block a new client / new list should touch.
   Everything below this object is generic render + submit logic.
   ============================================================== */
const WAITLIST = {
  id: 'fts-cabinets-v1',

  brand: {
    name: 'RED EYE',
    sub: 'FTS ARCADE FLOOR',
    favicon: '👁️',
    foot: 'RED EYE  ·  MORE GAMES. BRIGHTER WORLDS.'
  },

  copy: {
    title: 'Add your game to FTS Arcade',
    lede: 'Join the waitlist to be considered for an arcade cabinet in the Red Eye ecosystem.',
    submitLabel: 'Join Waitlist',
    submitting: 'Sending…',
    success: { icon:'🕹️', title:"You're on the list.", body:"Players build the arcade. We'll follow up if it's a fit." },
    error:   { icon:'⚠️', title:'Something snagged.', body:"That didn't go through. Check your connection and try again, or reach us directly." }
  },

  // ---- TRANSPORT -------------------------------------------------
  // FORM_ID is the value between /d/e/ and /formResponse in the
  // form's live link. Get it from Send → 🔗 on the Google Form.
  // Example: https://docs.google.com/forms/d/e/1FAIpQLSf.../viewform
  //                                            ^^^^^^^^^^^ this part
  transport: {
    type: 'gform',
    formId: '1FAIpQLSeeA3PHzBIIsDm9BP2OBS2xcH7Fl2AZ6p0Jdke6o5qn1TPHTw'
  },

  // ---- FIELDS ------------------------------------------------------
  // entry ids pulled from the pre-filled link. Order here = render order.
  fields: [
    { key:'name',        label:'Name or Handle',      type:'text',     required:true,  entry:'entry.1149113152', maxlength:60 },
    { key:'email',        label:'Email Address',       type:'email',    required:true,  entry:'entry.1626446804' },
    { key:'gameTitle',    label:'Game Title',          type:'text',     required:true,  entry:'entry.968435827' },
    { key:'gameUrl',      label:'Game URL',            type:'url',      required:true,  entry:'entry.574414592', placeholder:'https://yourgame.com' },
    { key:'description',  label:'Short Description',   type:'textarea', required:true,  entry:'entry.1722451020', maxlength:300, hint:'1–2 sentences.' },
    { key:'fit',          label:'Why it fits FTS Arcade', type:'textarea', required:true, entry:'entry.526330227' },
    { key:'areas',        label:'Areas of Interest',   type:'checkbox', required:true,  entry:'entry.1403663564',
      options:['Arcade Cabinets','Regional Events','House Servers','Community Showcases'] },
    { key:'consent',      label:'I agree to be contacted about Red Eye opportunities.', type:'consent', required:true,
      entry:'entry.51777480', value:'Yes, please!' },

    // hidden / attribution — not rendered as inputs
    { key:'source',   type:'hidden', entry:'entry.1734263527', from:'param:src',           default:'arcade-floor' },
    { key:'campaign', type:'hidden', entry:'entry.1307903855', from:'param:utm_campaign',  default:'' },
    { key:'referrer', type:'hidden', entry:'entry.604254289',  from:'param:ref',            default:'' },
    { key:'waitlistId', type:'hidden', entry:'entry.612731165', from:'static',              default:'fts-cabinets-v1' }
  ]
};
/* ============================================================== */

(function(){
  const qs = new URLSearchParams(location.search);
  const form = document.getElementById('waitlist-form');
  const statusBox = document.getElementById('form-status');

  document.title = `${WAITLIST.brand.name} — Waitlist`;
  document.getElementById('brand-name').textContent = WAITLIST.brand.name;
  document.getElementById('brand-sub').textContent = WAITLIST.brand.sub;
  document.getElementById('copy-title').textContent = WAITLIST.copy.title;
  document.getElementById('copy-lede').textContent = WAITLIST.copy.lede;
  document.getElementById('brand-foot').textContent = WAITLIST.brand.foot;

  function el(tag, attrs={}, ...kids){
    const n = document.createElement(tag);
    for(const k in attrs){
      if(k==='html') n.innerHTML = attrs[k];
      else n.setAttribute(k, attrs[k]);
    }
    kids.forEach(k=>n.appendChild(typeof k==='string'?document.createTextNode(k):k));
    return n;
  }

  // ---- render visible fields ----
  WAITLIST.fields.filter(f=>f.type!=='hidden').forEach(f=>{
    let node;
    if(f.type==='text'||f.type==='email'||f.type==='url'){
      node = el('div',{class:'field'},
        el('label',{for:f.key}, f.label, f.required?el('span',{class:'req'},'*'):''),
        el('input',{type:f.type,id:f.key,name:f.key,
          ...(f.required?{required:''}:{}), ...(f.maxlength?{maxlength:f.maxlength}:{}),
          ...(f.placeholder?{placeholder:f.placeholder}:{})}),
        el('div',{class:'err-msg'},'This field needs a value.')
      );
    } else if(f.type==='textarea'){
      node = el('div',{class:'field'},
        el('label',{for:f.key}, f.label, f.required?el('span',{class:'req'},'*'):''),
        el('textarea',{id:f.key,name:f.key,rows:'3',...(f.required?{required:''}:{}),...(f.maxlength?{maxlength:f.maxlength}:{})}),
        f.hint?el('small',{class:'hint'},f.hint):el('span'),
        el('div',{class:'err-msg'},'This field needs a value.')
      );
    } else if(f.type==='checkbox'){
      const grid = el('div',{class:'check-grid'});
      f.options.forEach((opt,i)=>{
        const id = f.key+'_'+i;
        grid.appendChild(el('label',{class:'check-item',for:id},
          el('input',{type:'checkbox',id:id,name:f.key,value:opt}),
          opt
        ));
      });
      node = el('fieldset',{class:'field'},
        el('legend',{}, f.label.toUpperCase() + (f.required?' *':'')),
        grid,
        el('div',{class:'err-msg', style:'margin-top:8px'},'Pick at least one.')
      );
      node.dataset.group = f.key;
    } else if(f.type==='consent'){
      node = el('div',{class:'field consent'},
        el('input',{type:'checkbox',id:f.key,name:f.key,value:f.value,...(f.required?{required:''}:{})}),
        el('label',{for:f.key}, f.label)
      );
    }
    if(node) form.appendChild(node);
  });

  // honeypot
  form.appendChild(el('div',{class:'hp'},
    el('label',{for:'company'},'Company'),
    el('input',{type:'text',id:'company',name:'company',tabindex:'-1',autocomplete:'off'})
  ));

  const submitBtn = el('button',{type:'submit'}, WAITLIST.copy.submitLabel);
  form.appendChild(submitBtn);
  form.appendChild(el('p',{class:'foot-note'},'This waitlist feeds the Red Eye outreach pipeline. No spam — just next steps.'));

  // ---- validation ----
  function markInvalid(fieldEl, bad){
    fieldEl.classList.toggle('invalid', bad);
  }
  function validate(){
    let ok = true;
    WAITLIST.fields.filter(f=>f.required && f.type!=='hidden').forEach(f=>{
      if(f.type==='checkbox'){
        const grp = form.querySelector(`[data-group="${f.key}"]`);
        const checked = form.querySelectorAll(`input[name="${f.key}"]:checked`).length>0;
        markInvalid(grp, !checked);
        if(!checked) ok=false;
      } else if(f.type==='consent'){
        const box = document.getElementById(f.key);
        const wrap = box.closest('.field');
        const bad = !box.checked;
        markInvalid(wrap, bad);
        if(bad) ok=false;
      } else {
        const input = form.querySelector(`[name="${f.key}"]`);
        const wrap = input.closest('.field');
        let bad = !input.value.trim();
        if(f.type==='url' && input.value && !/^https?:\/\//i.test(input.value)) bad = true;
        if(f.type==='email' && input.value && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(input.value)) bad = true;
        markInvalid(wrap, bad);
        if(bad) ok=false;
      }
    });
    return ok;
  }

  // ---- submit ----
  let submitted = false;
  form.addEventListener('submit', function(e){
    e.preventDefault();
    if(submitted) return;
    if(form.querySelector('#company').value.trim()){ return; } // honeypot tripped — silently drop
    if(!validate()) return;

    submitted = true;
    submitBtn.disabled = true;
    submitBtn.textContent = WAITLIST.copy.submitting;

    if(WAITLIST.transport.formId === 'REPLACE_WITH_FORM_ID'){
      showStatus('error', {icon:'🔧', title:'Not wired up yet', body:'transport.formId still needs the live Google Form ID.'});
      return;
    }

    const action = `https://docs.google.com/forms/d/e/${WAITLIST.transport.formId}/formResponse`;
    const post = el('form',{action:action, method:'POST', target:'gf-sink', style:'display:none'});

    WAITLIST.fields.forEach(f=>{
      if(f.type==='hidden'){
        let val = f.default || '';
        if(f.from && f.from.startsWith('param:')){
          const p = qs.get(f.from.split(':')[1]);
          if(p) val = p;
        }
        post.appendChild(el('input',{type:'hidden',name:f.entry,value:val}));
      } else if(f.type==='checkbox'){
        form.querySelectorAll(`input[name="${f.key}"]:checked`).forEach(cb=>{
          post.appendChild(el('input',{type:'hidden',name:f.entry,value:cb.value}));
        });
      } else if(f.type==='consent'){
        post.appendChild(el('input',{type:'hidden',name:f.entry,value:f.value}));
      } else {
        const input = form.querySelector(`[name="${f.key}"]`);
        post.appendChild(el('input',{type:'hidden',name:f.entry,value:input.value.trim()}));
      }
    });

    document.body.appendChild(post);

    const sink = document.querySelector('iframe[name="gf-sink"]');
    let settled = false;
    sink.addEventListener('load', function onLoad(){
      if(settled) return;
      settled = true;
      sink.removeEventListener('load', onLoad);
      showStatus('success', WAITLIST.copy.success);
    });
    // fallback in case the load event never fires
    setTimeout(()=>{
      if(!settled){ settled = true; showStatus('success', WAITLIST.copy.success); }
    }, 4000);

    post.submit();
  });

  function showStatus(kind, copy){
    form.style.display = 'none';
    statusBox.style.display = 'block';
    statusBox.className = kind === 'error' ? 'error' : '';
    document.getElementById('status-icon').textContent = copy.icon;
    document.getElementById('status-title').textContent = copy.title;
    document.getElementById('status-body').textContent = copy.body;
    statusBox.scrollIntoView({behavior:'smooth', block:'start'});
  }
})();
</script>
</body>
</html>
