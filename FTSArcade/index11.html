<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FishTacoStand Arcade</title>

    <!-- ── Primary Meta ─────────────────────────────────────────── -->
    <meta name="description" content="FishTacoStand Arcade — a playful retro arcade hub serving Neon Invaders, Astroids, Cave Racer, RED EYE, RC Racer, Tetris, and more." />

    <!-- ── Favicons ─────────────────────────────────────────────── -->
    <link rel="icon" type="image/png" href="fts-favicon.png">
    <link rel="shortcut icon" type="image/png" href="fts-favicon.png">
    <link rel="apple-touch-icon" href="fts-favicon.png">

    <!-- ── Open Graph ───────────────────────────────────────────── -->
    <meta property="og:title"       content="FishTacoStand Arcade">
    <meta property="og:description" content="Step up to the FishTacoStand Arcade: a retro cabinet hub for Neon Invaders, Astroids, Cave Racer, RED EYE, RC Racer, Tetris, and more.">
    <meta property="og:url"         content="https://frymatic.us/FTSArcade/">
    <meta property="og:type"        content="website">
    <meta property="og:site_name"   content="FishTacoStand Arcade">
    <meta property="og:image"       content="https://frymatic.us/FTSArcade/FishTacoStand.png">
    <meta property="og:image:alt"   content="FishTacoStand Arcade cabinet menu with clickable retro games.">
    <meta property="og:image:type"  content="image/png">

    <!-- ── Twitter / X ──────────────────────────────────────────── -->
    <meta name="twitter:card"        content="summary_large_image">
    <meta name="twitter:title"       content="FishTacoStand Arcade">
    <meta name="twitter:description" content="A retro arcade hub serving Neon Invaders, Astroids, Cave Racer, RED EYE, RC Racer, Tetris, and more.">
    <meta name="twitter:image"       content="https://frymatic.us/FTSArcade/FishTacoStand.png">

    <!-- ── Fonts ────────────────────────────────────────────────── -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Press+Start+2P&display=swap" rel="stylesheet">

    <style>
        /* ═══════════════════════════════════════════════════════════
           RESET + VARIABLES
           ═══════════════════════════════════════════════════════════ */
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --neon-blue:    #00d9ff;
            --neon-pink:    #ff006e;
            --neon-yellow:  #ffbe0b;
            --neon-green:   #00ff88;
            --neon-purple:  #a855f7;
            --neon-red:     #ff0040;
            --neon-orange:  #f59e0b;
            --dark-bg:      #0a0a0f;
            --screen-bg:    #04040e;
        }

        html, body {
            width: 100%; height: 100%;
            overflow: hidden;
            background: var(--dark-bg);
            font-family: 'Press Start 2P', monospace;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            background: url('the-Floor.png') center center / cover no-repeat;
            position: relative;
        }

        /* Floor depth overlay */
        body::before {
            content: '';
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.28);
            pointer-events: none; z-index: 0;
        }

        /* Global CRT scanlines */
        body::after {
            content: '';
            position: fixed; inset: 0;
            background: repeating-linear-gradient(
                0deg,
                rgba(0,0,0,0.14) 0px, transparent 1px,
                transparent 2px, rgba(0,0,0,0.14) 3px
            );
            pointer-events: none;
            z-index: 1000;
            animation: globalFlicker 0.15s infinite;
        }

        @keyframes globalFlicker {
            0%, 100% { opacity: 0.96; }
            50%       { opacity: 0.99; }
        }


        /* ═══════════════════════════════════════════════════════════
   CABINET SCENE
   ═══════════════════════════════════════════════════════════ */
    .cabinet-wrapper {
        display: flex;
        align-items: safe center;
        justify-content: center;
        width: 100vw; height: 100dvh;
        padding-top: clamp(0.2rem, 0.5dvh, 0.5rem);
        overflow: hidden;
        position: relative; z-index: 1;
    }

    .arcade-container {
        position: relative;
        display: inline-block;
        line-height: 0;
        flex-shrink: 0;
        /* FIX: Giving the container a definitive height forces absolute children to scale perfectly */
        height: min(calc(90vw * 1.334), 150dvh); 
    }

    /* Cabinet image: fills viewport proportionally */
    .cabinet-base {
        display: block;
        height: 100%; /* Now safely inherits the exact container height */
        width: auto;
        max-width: none;
        position: relative; z-index: 5;
        pointer-events: none;
        user-select: none;
    }


        /* ── TRIPTYCH FLANKING CABINETS ─────────────────────────── */
        .cabinet-flank {
            position: absolute; 
            top: 0;
            height: 100%; 
            width: auto; 
            max-width: none;
            z-index: 2; 
            pointer-events: none;
            opacity: 0; 
            transition: opacity 0.55s ease;
            /* Ensure the actual image asset stretches properly if needed */
            object-fit: cover;
        }

        .flank-left {
            /* Push it slightly further behind the center artwork edge to eliminate gaps */
            right: 90%; 
            /* Flip the mask so it is solid near the center cabinet and fades out at the screen edge */
           }

        .flank-right {
            /* Push it slightly further behind the center artwork edge to eliminate gaps */
            left: 90%; 
            /* Flip the mask so it is solid near the center cabinet and fades out at the screen edge */
            }

        @media (min-aspect-ratio: 4/3) { .cabinet-flank { opacity: 1; } }
        @media (orientation: portrait) {
            .cabinet-wrapper { padding: clamp(0.5rem, 2vw, 1.5rem); }
            .cabinet-flank { display: none; }
        }


        /* ═══════════════════════════════════════════════════════════
           SCREEN REGION (absolutely positioned over cabinet-base)
           ═══════════════════════════════════════════════════════════ */
        .arcade-screen {
            position: absolute;
            left: 16%; top: 20.5%;
            width: 68%; height: 27%;
            z-index: 10;
            cursor: pointer;
            overflow: hidden;
            border-radius: 3px;

            /* The Magic Sauce */
            transform-origin: center center; /* Try 'bottom center' if it's easier to line up */
            transform: perspective(600px) rotateX(3deg); /* Tweak these until it matches the bezel */
            
            /* Smooths out the text rendering during the 3D tilt */
            backface-visibility: hidden;
        }

        /* Per-screen dense scanlines */
        .arcade-screen::before {
            content: '';
            position: absolute; inset: 0;
            background: repeating-linear-gradient(
                0deg,
                transparent, transparent 2px,
                rgba(0,0,0,0.06) 2px, rgba(0,0,0,0.06) 4px
            );
            pointer-events: none; z-index: 30;
        }

        /* CRT curvature vignette */
        .arcade-screen::after {
            content: '';
            position: absolute; inset: 0;
            background: radial-gradient(
                ellipse at 50% 50%,
                transparent 55%,
                rgba(0,0,0,0.45) 100%
            );
            pointer-events: none; z-index: 31;
        }


        /* ── IDLE STATE ─────────────────────────────────────────── */
        .screen-idle {
            position: absolute; inset: 0;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            gap: 10%;
            background: radial-gradient(
                ellipse at 50% 40%,
                rgba(0, 150, 255, 0.06) 0%,
                rgba(0,  20,  60, 0.55) 60%,
                rgba(0,   0,   0, 0.85) 100%
            );
            transition: opacity 0.28s ease, background 0.3s ease;
        }

        .arcade-screen:hover .screen-idle {
            background: radial-gradient(
                ellipse at 50% 40%,
                rgba(0, 200, 255, 0.12) 0%,
                rgba(0,  50, 120, 0.55) 60%,
                rgba(0,   0,   0, 0.75) 100%
            );
        }

        .idle-logo {
            font-family: 'Bungee', sans-serif;
            font-size: clamp(7px, 1.7vh, 14px);
            color: var(--neon-yellow);
            text-shadow: 0 0 10px var(--neon-yellow), 0 0 22px rgba(255,190,11,0.4);
            letter-spacing: 3px;
            animation: logoPulse 3s ease-in-out infinite alternate;
            text-align: center;
        }

        @keyframes logoPulse {
            0%   { text-shadow: 0 0 8px var(--neon-yellow); }
            100% { text-shadow: 0 0 18px var(--neon-yellow), 0 0 36px rgba(255,190,11,0.4), 0 0 60px rgba(255,190,11,0.15); }
        }

        .insert-coin {
            font-size: clamp(5px, 1.2vh, 9px);
            color: var(--neon-yellow);
            text-shadow: 0 0 8px var(--neon-yellow);
            animation: blinkStep 1.1s step-end infinite;
            letter-spacing: 1px;
        }

        @keyframes blinkStep {
            0%, 100% { opacity: 1; }
            50%       { opacity: 0; }
        }


        /* ── COIN DROP FX ───────────────────────────────────────── */
        .coin-drop {
            position: absolute;
            font-size: clamp(14px, 2.8vh, 24px);
            pointer-events: none;
            z-index: 35;
            animation: dropCoin 0.7s cubic-bezier(0.36, 0.07, 0.19, 0.97) forwards;
        }

        @keyframes dropCoin {
            0%   { opacity: 1;   transform: translateY(-24px) rotate(0deg)    scale(1.1); }
            70%  { opacity: 0.9; transform: translateY(60px)  rotate(480deg)  scale(0.8); }
            100% { opacity: 0;   transform: translateY(110px) rotate(640deg)  scale(0.4); }
        }

        /* ── WHITE FLASH on start ───────────────────────────────── */
        .screen-flash {
            position: absolute; inset: 0;
            background: rgba(255,255,255,0.9);
            opacity: 0;
            pointer-events: none; z-index: 32;
            animation: screenFlash 0.4s ease forwards;
        }

        @keyframes screenFlash {
            0%   { opacity: 0.75; }
            100% { opacity: 0; }
        }


        /* ═══════════════════════════════════════════════════════════
           GAME SELECTION MENU (rendered inside the screen region)
           ═══════════════════════════════════════════════════════════ */
        .screen-menu {
            position: absolute; inset: 0;
            background: #04040e;
            display: flex; flex-direction: column;
            padding: 4% 3.5% 2.5%;
            opacity: 0;
            transform: scale(0.975) translateY(6px);
            transition: opacity 0.42s ease, transform 0.42s ease;
            pointer-events: none;
        }

        .screen-menu.active {
            opacity: 1;
            transform: scale(1) translateY(0);
            pointer-events: all;
        }

        /* Menu header bar */
        .menu-header {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            margin-bottom: 3.5%;
            position: relative;
        }

        .menu-title {
            font-size: clamp(5px, 1.0vh, 8px);
            color: var(--neon-blue);
            text-shadow: 0 0 10px var(--neon-blue);
            letter-spacing: 3px;
        }

        /* ── GAME GRID ──────────────────────────────────────────── */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 3.5%;
            flex: 1;
            min-height: 0;
        }

        /* ── BASE TILE ──────────────────────────────────────────── */
        .game-tile {
            border: 1px solid;
            border-radius: 2px;
            display: flex; flex-direction: column;
            align-items: center; justify-content: flex-start;
            padding: 8% 4% 4%;
            position: relative;
            overflow: hidden;
            text-decoration: none;
            cursor: pointer;
            /* staggered entry */
            opacity: 0;
        }

        /* Stagger animation trigger class */
        .game-tile.entering { animation: tileIn 0.32s ease forwards; }

        .game-tile:nth-child(1).entering { animation-delay: 0.04s; }
        .game-tile:nth-child(2).entering { animation-delay: 0.09s; }
        .game-tile:nth-child(3).entering { animation-delay: 0.14s; }
        .game-tile:nth-child(4).entering { animation-delay: 0.19s; }
        .game-tile:nth-child(5).entering { animation-delay: 0.24s; }
        .game-tile:nth-child(6).entering { animation-delay: 0.29s; }

        @keyframes tileIn {
            0%   { opacity: 0; transform: scale(0.92) translateY(6px); }
            100% { opacity: 1; transform: scale(1)    translateY(0); }
        }

        .game-tile:not(.disabled):hover {
            transform: scale(1.05);
            z-index: 2;
        }

        .game-tile.disabled { cursor: default; }

        /* ── TILE COLOUR THEMES ─────────────────────────────────── */
        .tile-tetris {
            border-color: var(--neon-purple);
            background: linear-gradient(155deg, rgba(168,85,247,0.13) 0%, rgba(4,4,14,0.9) 70%);
            box-shadow: inset 0 0 12px rgba(168,85,247,0.08), 0 0 5px rgba(168,85,247,0.12);
            transition: box-shadow 0.15s ease, transform 0.12s ease;
        }
        .tile-tetris:not(.disabled):hover {
            box-shadow: inset 0 0 20px rgba(168,85,247,0.18), 0 0 14px rgba(168,85,247,0.35);
        }

        .tile-astroids {
            border-color: var(--neon-blue);
            background: linear-gradient(155deg, rgba(0,217,255,0.12) 0%, rgba(4,4,14,0.9) 70%);
            box-shadow: inset 0 0 12px rgba(0,217,255,0.07), 0 0 5px rgba(0,217,255,0.12);
            transition: box-shadow 0.15s ease, transform 0.12s ease;
        }
        .tile-astroids:hover {
            box-shadow: inset 0 0 20px rgba(0,217,255,0.16), 0 0 14px rgba(0,217,255,0.32);
        }

        .tile-cave-racer {
            border-color: var(--neon-orange);
            background: linear-gradient(155deg, rgba(245,158,11,0.12) 0%, rgba(4,4,14,0.9) 70%);
            box-shadow: inset 0 0 12px rgba(245,158,11,0.07), 0 0 5px rgba(245,158,11,0.12);
            transition: box-shadow 0.15s ease, transform 0.12s ease;
        }
        .tile-cave-racer:hover {
            box-shadow: inset 0 0 20px rgba(245,158,11,0.18), 0 0 14px rgba(245,158,11,0.34);
        }

        .tile-red-eye {
            border-color: var(--neon-red);
            background: linear-gradient(155deg, rgba(255,0,64,0.12) 0%, rgba(4,4,14,0.9) 70%);
            box-shadow: inset 0 0 12px rgba(255,0,64,0.07), 0 0 5px rgba(255,0,64,0.12);
            transition: box-shadow 0.15s ease, transform 0.12s ease;
        }
        .tile-red-eye:hover {
            box-shadow: inset 0 0 20px rgba(255,0,64,0.18), 0 0 14px rgba(255,0,64,0.34);
        }

        .tile-neon-invaders {
            border-color: var(--neon-green);
            background: linear-gradient(155deg, rgba(0,255,136,0.11) 0%, rgba(4,4,14,0.9) 70%);
            box-shadow: inset 0 0 12px rgba(0,255,136,0.07), 0 0 5px rgba(0,255,136,0.12);
            transition: box-shadow 0.15s ease, transform 0.12s ease;
        }
        .tile-neon-invaders:hover {
            box-shadow: inset 0 0 20px rgba(0,255,136,0.17), 0 0 14px rgba(0,255,136,0.32);
        }

        .tile-rc-racer {
            border-color: var(--neon-yellow);
            background: linear-gradient(155deg, rgba(255,190,11,0.11) 0%, rgba(4,4,14,0.9) 70%);
            box-shadow: inset 0 0 12px rgba(255,190,11,0.07), 0 0 5px rgba(255,190,11,0.12);
            transition: box-shadow 0.15s ease, transform 0.12s ease;
        }
        .tile-rc-racer:hover {
            box-shadow: inset 0 0 20px rgba(255,190,11,0.17), 0 0 14px rgba(255,190,11,0.32);
        }


        /* ── TILE CONTENT ───────────────────────────────────────── */
        .tile-icon {
            width: clamp(18px, 4vh, 34px);
            height: clamp(18px, 4vh, 34px);
            flex-shrink: 0;
            margin-bottom: 7%;
        }

        .tile-name {
            font-size: clamp(4px, 0.85vh, 7px);
            color: #fff;
            text-align: center;
            line-height: 1.5;
            letter-spacing: 0.4px;
        }

        .tile-sub {
            font-size: clamp(3px, 0.6vh, 5px);
            color: rgba(255,255,255,0.38);
            text-align: center;
            margin-top: 5%;
            letter-spacing: 0.5px;
            line-height: 1.5;
        }

        .tile-badge {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            padding: 2.5% 0;
            font-size: clamp(3px, 0.6vh, 5px);
            text-align: center;
            letter-spacing: 2px;
        }

        .badge-soon {
            background: rgba(168,85,247,0.18);
            color: var(--neon-purple);
            text-shadow: 0 0 6px var(--neon-purple);
        }

        /* ── MENU FOOTER ────────────────────────────────────────── */
        .menu-footer {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 2.5%;
        }

        .menu-back {
            font-size: clamp(4px, 0.7vh, 5.5px);
            color: rgba(255,255,255,0.2);
            cursor: pointer;
            letter-spacing: 1px;
            transition: color 0.2s ease, text-shadow 0.2s ease;
            user-select: none;
        }

        .menu-back:hover {
            color: var(--neon-pink);
            text-shadow: 0 0 8px var(--neon-pink);
        }


        /* ═══════════════════════════════════════════════════════════
           KEYBOARD HINT
           ═══════════════════════════════════════════════════════════ */
        .key-hint {
            position: fixed;
            bottom: 14px; left: 50%;
            transform: translateX(-50%);
            font-size: clamp(5px, 0.85vh, 7px);
            color: rgba(255,255,255,0.13);
            z-index: 500;
            letter-spacing: 1px;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }
        .key-hint.hidden { opacity: 0; }


        /* ═══════════════════════════════════════════════════════════
           EDGE VOLUME SLIDER  (preserved from original Gemini code)
           ═══════════════════════════════════════════════════════════ */
        #edge-volume {
            position: fixed;
            right: 0; top: 50%;
            transform: translateY(-50%);
            z-index: 500;
            display: flex; flex-direction: column;
            align-items: center; gap: 8px;
            width: 44px; padding: 14px 10px;
            background: rgba(10,0,20,0.85);
            border: 1px solid rgba(255,0,110,0.3);
            border-right: none;
            border-radius: 10px 0 0 10px;
            backdrop-filter: blur(8px);
            transition:
                width       0.35s cubic-bezier(0.34, 1.3, 0.64, 1),
                border-color 0.3s ease,
                box-shadow   0.3s ease;
            overflow: hidden;
            cursor: pointer;
        }

        #edge-volume:hover,
        #edge-volume.open {
            width: 72px;
            border-color: rgba(255,0,110,0.7);
            box-shadow: -4px 0 24px rgba(255,0,110,0.25),
                        inset 0 0 20px rgba(255,0,110,0.05);
        }

        #vol-icon {
            font-size: 14px; color: var(--neon-pink);
            text-shadow: 0 0 8px var(--neon-pink);
            user-select: none; flex-shrink: 0;
            transition: text-shadow 0.3s ease; line-height: 1;
        }
        #edge-volume:hover #vol-icon {
            text-shadow: 0 0 14px var(--neon-pink), 0 0 28px var(--neon-pink);
        }

        #vol-pct {
            font-size: 7px; color: var(--neon-blue);
            text-shadow: 0 0 6px var(--neon-blue);
            white-space: nowrap; letter-spacing: 0.5px;
            flex-shrink: 0; opacity: 0;
            transition: opacity 0.25s ease;
        }
        #edge-volume:hover #vol-pct,
        #edge-volume.open  #vol-pct { opacity: 1; }

        #vol-track {
            position: relative; width: 20px; height: 140px;
            flex-shrink: 0; opacity: 0;
            transition: opacity 0.25s ease 0.05s;
        }
        #edge-volume:hover #vol-track,
        #edge-volume.open  #vol-track { opacity: 1; }

        #vol-track::before {
            content: '';
            position: absolute; left: 50%; top: 0; bottom: 0; width: 2px;
            transform: translateX(-50%);
            background: rgba(255,0,110,0.2); border-radius: 2px;
        }
        #vol-track::after {
            content: '';
            position: absolute; left: 50%; bottom: 0; width: 2px;
            height: var(--vol-fill, 20%);
            transform: translateX(-50%);
            background: linear-gradient(to top, var(--neon-pink), var(--neon-blue));
            border-radius: 2px;
            box-shadow: 0 0 6px var(--neon-pink);
            transition: height 0.05s linear;
        }

        #vol-range {
            position: absolute; left: 50%; top: 0;
            transform: translateX(-50%) rotate(-90deg);
            transform-origin: center center;
            width: 140px; height: 20px;
            margin-left: -60px; margin-top: 60px;
            appearance: none; -webkit-appearance: none;
            background: transparent; cursor: pointer; outline: none;
        }
        #vol-range::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px; height: 14px; border-radius: 50%;
            background: var(--neon-blue); border: 2px solid var(--neon-pink);
            box-shadow: 0 0 8px var(--neon-blue), 0 0 16px var(--neon-pink);
            transition: box-shadow 0.2s ease, transform 0.2s ease;
        }
        #vol-range::-webkit-slider-thumb:hover {
            transform: scale(1.3);
            box-shadow: 0 0 12px var(--neon-blue), 0 0 24px var(--neon-pink);
        }
        #vol-range::-moz-range-thumb {
            width: 14px; height: 14px; border-radius: 50%;
            background: var(--neon-blue); border: 2px solid var(--neon-pink);
            box-shadow: 0 0 8px var(--neon-blue); cursor: pointer;
        }

        #vol-ticks {
            position: absolute; right: -6px; top: 0; bottom: 0;
            display: flex; flex-direction: column;
            justify-content: space-between; pointer-events: none;
        }
        .vol-tick { width: 4px; height: 1px; background: rgba(255,0,110,0.4); }
        .vol-tick.major { width: 6px; background: rgba(0,217,255,0.6); }
    </style>
</head>
<body>

    <div class="cabinet-wrapper">
        <div class="arcade-container">

            <!-- Outward-facing flanking cabinets -->
            <img src="cabinet-left.png"  class="cabinet-flank flank-left"  alt="">
            <img src="cabinet-right.png" class="cabinet-flank flank-right" alt="">

            <!-- Main cabinet -->
            <img src="the-Cabinet.png" alt="FTS Arcade Cabinet" class="cabinet-base">

            <!-- ── INTERACTIVE SCREEN REGION ───────────────────── -->
            <div class="arcade-screen" id="arcadeScreen">

                <!-- Idle / attract state -->
                <div class="screen-idle" id="screenIdle">
                    <span class="idle-logo">FTS ARCADE</span>
                    <span class="insert-coin">▶ INSERT COIN ◀</span>
                </div>

                <!-- Game selection menu (revealed after coin) -->
                <div class="screen-menu" id="screenMenu">

                    <div class="menu-header">
                        <span class="menu-title">── SELECT GAME ──</span>
                    </div>

                    <div class="game-grid" id="gameGrid">

    <!-- ── EDGE VOLUME CONTROL ──────────────────────────────────── -->
    <div id="edge-volume" title="Volume">
        <div id="vol-icon">◁)))</div>
        <div id="vol-pct">20%</div>
        <div id="vol-track">
            <div id="vol-ticks">
                <span class="vol-tick major"></span>
                <span class="vol-tick"></span>
                <span class="vol-tick"></span>
                <span class="vol-tick"></span>
                <span class="vol-tick major"></span>
                <span class="vol-tick"></span>
                <span class="vol-tick"></span>
                <span class="vol-tick"></span>
                <span class="vol-tick major"></span>
            </div>
            <input type="range" id="vol-range" min="0" max="100" value="20" step="1">
        </div>
    </div>


    <script>
    /* ══════════════════════════════════════════════════════════════
       AUDIO ENGINE
       ══════════════════════════════════════════════════════════════ */
    const AudioCtx    = window.AudioContext || window.webkitAudioContext;
    const audioCtx    = new AudioCtx();
    const masterGain  = audioCtx.createGain();
    masterGain.connect(audioCtx.destination);

    const savedVol = parseFloat(localStorage.getItem('fts-volume') ?? '20');
    masterGain.gain.value = savedVol / 100;

    function wake() { if (audioCtx.state === 'suspended') audioCtx.resume(); }

    /** Play a single tone. All params explicit. */
    function tone(freq, type, vol, dur, delay = 0) {
        const osc  = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(masterGain);
        osc.frequency.value = freq;
        osc.type = type;
        const t = audioCtx.currentTime + delay;
        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.linearRampToValueAtTime(vol, t + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        osc.start(t);
        osc.stop(t + dur + 0.03);
    }

    const sfx = {
        hover:  () => tone(620,  'square',   0.07, 0.10),
        coin:   () => {
            tone(880,  'square',   0.18, 0.07);
            tone(1200, 'square',   0.12, 0.08, 0.06);
            tone(1500, 'triangle', 0.08, 0.06, 0.10);
            tone(660,  'triangle', 0.10, 0.18, 0.12);
        },
        start:  () => {
            [523, 659, 784, 1047].forEach((f, i) =>
                tone(f, 'square', 0.12, 0.09, i * 0.07)
            );
        },
        select: () => {
            tone(1047, 'square', 0.10, 0.05);
            tone(1319, 'square', 0.08, 0.05, 0.06);
            tone(1568, 'square', 0.13, 0.11, 0.12);
        },
        denied: () => {
            tone(200, 'sawtooth', 0.13, 0.09);
            tone(155, 'sawtooth', 0.10, 0.18, 0.08);
        },
        exit:   () => {
            [1047, 784, 659, 523].forEach((f, i) =>
                tone(f, 'square', 0.08, 0.07, i * 0.05)
            );
        },
    };


    /* ══════════════════════════════════════════════════════════════
       DOM REFS
       ══════════════════════════════════════════════════════════════ */
    const screen    = document.getElementById('arcadeScreen');
    const idle      = document.getElementById('screenIdle');
    const menu      = document.getElementById('screenMenu');
    const back      = document.getElementById('menuBack');
    const keyHint   = document.getElementById('keyHint');
    const gameGrid  = document.getElementById('gameGrid');
    const tiles     = gameGrid.querySelectorAll('.game-tile');

    let menuOpen = false;


    /* ══════════════════════════════════════════════════════════════
       STATE MACHINE  (idle ↔ menu)
       ══════════════════════════════════════════════════════════════ */
    function openMenu() {
        if (menuOpen) return;
        menuOpen = true;

        // White flash
        const flash = document.createElement('div');
        flash.className = 'screen-flash';
        screen.appendChild(flash);
        setTimeout(() => flash.remove(), 450);

        // Fade idle out
        idle.style.transition = 'opacity 0.25s ease';
        idle.style.opacity = '0';

        setTimeout(() => {
            idle.style.display = 'none';

            // Reset tile animations so they re-run each open
            tiles.forEach(t => t.classList.remove('entering'));
            void gameGrid.offsetHeight; // force reflow
            tiles.forEach(t => t.classList.add('entering'));

            menu.classList.add('active');
            keyHint.classList.remove('hidden');
        }, 280);
    }

    function closeMenu() {
        if (!menuOpen) return;
        menuOpen = false;
        wake(); sfx.exit();
        menu.classList.remove('active');
        keyHint.classList.add('hidden');

        setTimeout(() => {
            idle.style.display = '';
            void idle.offsetHeight;
            idle.style.transition = 'opacity 0.38s ease';
            idle.style.opacity    = '';
        }, 460);
    }


    /* ══════════════════════════════════════════════════════════════
       INTERACTIONS
       ══════════════════════════════════════════════════════════════ */

    // ── Insert coin ──────────────────────────────────────────────
    screen.addEventListener('click', (e) => {
        if (menuOpen) return;
        wake();

        // Coin drop animation
        const coin = document.createElement('span');
        coin.className   = 'coin-drop';
        coin.textContent = '🪙';
        coin.style.left  = (e.offsetX - 14) + 'px';
        coin.style.top   = '-28px';
        screen.appendChild(coin);
        setTimeout(() => coin.remove(), 780);

        sfx.coin();
        setTimeout(() => { sfx.start(); openMenu(); }, 390);
    });

    // ── Back / exit ──────────────────────────────────────────────
    back.addEventListener('click', (e) => { e.stopPropagation(); closeMenu(); });

    // ── Game tile clicks ─────────────────────────────────────────
    gameGrid.addEventListener('click', (e) => {
        const tile = e.target.closest('.game-tile');
        if (!tile) return;
        wake();

        if (tile.dataset.game === 'tetris') {
            sfx.denied();
            // Shake the tile
            tile.style.transition = 'transform 0.08s ease';
            tile.style.transform  = 'translateX(-4px)';
            setTimeout(() => tile.style.transform = 'translateX(4px)',  80);
            setTimeout(() => tile.style.transform = 'translateX(-2px)', 160);
            setTimeout(() => { tile.style.transform = ''; tile.style.transition = ''; }, 240);
            return;
        }

        sfx.select();
        // navigation proceeds via <a href>
    });

    // ── Tile hover sounds ────────────────────────────────────────
    gameGrid.addEventListener('mouseover', (e) => {
        if (e.target.closest('.game-tile')) { wake(); sfx.hover(); }
    });

    // ── Screen hover sound ───────────────────────────────────────
    screen.addEventListener('mouseenter', () => {
        if (!menuOpen) { wake(); sfx.hover(); }
    });

    // ── Keyboard ESC ─────────────────────────────────────────────
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && menuOpen) closeMenu();
    });


    /* ══════════════════════════════════════════════════════════════
       VOLUME CONTROL  (preserved from original Gemini code)
       ══════════════════════════════════════════════════════════════ */
    const edgeVol  = document.getElementById('edge-volume');
    const volRange = document.getElementById('vol-range');
    const volPct   = document.getElementById('vol-pct');
    const volTrack = document.getElementById('vol-track');

    volRange.value = savedVol;
    volPct.textContent = Math.round(savedVol) + '%';
    volTrack.style.setProperty('--vol-fill', savedVol + '%');

    function updateVolIcon(pct) {
        const icon = document.getElementById('vol-icon');
        icon.textContent =
            pct === 0  ? '◁'    :
            pct < 40   ? '◁)'   :
            pct < 75   ? '◁))'  : '◁)))';
    }
    updateVolIcon(savedVol);

    volRange.addEventListener('input', (e) => {
        wake();
        const val = parseFloat(e.target.value);
        masterGain.gain.setTargetAtTime(val / 100, audioCtx.currentTime, 0.015);
        volPct.textContent = Math.round(val) + '%';
        volTrack.style.setProperty('--vol-fill', val + '%');
        updateVolIcon(val);
        localStorage.setItem('fts-volume', val);
    });

    volRange.addEventListener('mousedown', () => edgeVol.classList.add('open'));
    document.addEventListener('mouseup',   () => edgeVol.classList.remove('open'));
    </script>
