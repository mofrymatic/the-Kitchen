<style>
:root{color-scheme:dark;--cyan:#20eaff;--magenta:#ff28b7;--red:#ff2745;--gold:#ffd15c;--green:#53ff64;--ink:#020208}

#audioPanel{position:absolute;z-index:30;inset:7%;padding:18px;background:rgba(2,5,15,.97);border:1px solid rgba(32,234,255,.6);box-shadow:0 0 50px rgba(32,234,255,.18);overflow:auto}.aux-head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:1px solid rgba(32,234,255,.25);padding-bottom:12px}.aux-head h2{margin:0;color:var(--cyan);font-size:20px}.aux-head p{margin:4px 0 0;color:#b278ff;font-size:10px}.aux-close{background:none;border:1px solid rgba(255,255,255,.25);color:#fff;font-size:24px}.aux-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.aux-row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;border:1px solid rgba(32,234,255,.16);padding:10px}.aux-copy strong{display:block;color:#fff;font-size:12px}.aux-copy small{display:block;color:#8099ad;font-size:9px;line-height:1.35;margin-top:4px}.aux-control select,.aux-control input[type=range]{width:180px;max-width:28vw;background:#061327;color:#fff;border:1px solid rgba(32,234,255,.38);padding:6px}.switch{display:flex;align-items:center;gap:6px;color:#fff;font-size:10px}.aux-foot{display:flex;justify-content:space-between;align-items:center;gap:15px;padding-top:12px;margin-top:12px;border-top:1px solid rgba(32,234,255,.2);color:#8099ad;font-size:9px}.aux-save{padding:9px 14px;background:#061327;color:#fff;border:1px solid var(--cyan)}

<body><main id="shell" aria-label="Cave Defender arcade game"><canvas id="scene" width="480" height="270"></canvas><div id="crt"></div><div id="glass"></div><div id="bezel"></div><canvas id="hud" width="960" height="540"></canvas><div id="help"><b>ARROWS/WASD</b> FLY · <b>Z</b> FIRE · <b>X/SPACE</b> HYPERFLOW · <b>C</b> SMART BOMB · <b>P</b> PAUSE · <b>R</b> RESTART · <b>O</b> AUXOR</div><button id="audioButton" type="button">♫</button><div id="auxNow">AUXOR · 151 BPM<br>AFTERBURN / INDUSTRIAL TECHNO</div><section id="audioPanel" hidden><header class="aux-head"><div><h2>AUXOR · CAVE DEFENDER</h2><p>151 BPM · MIDI-DERIVED ADAPTIVE RESCUE ENGINE</p></div><button class="aux-close" id="audioClose">×</button></header><div class="aux-grid"><label class="aux-row"><span class="aux-copy"><strong>Source Variation</strong><small>Three treatments of the supplied MIDI contour.</small></span><span class="aux-control"><select id="musicVariation"><option value="afterburn">AFTERBURN</option><option value="redline">REDLINE</option><option value="vector">VECTOR</option></select></span></label><label class="aux-row"><span class="aux-copy"><strong>Music Style</strong><small>FTS arrangement matrix shared with the current arcade audio work.</small></span><span class="aux-control"><select id="musicStyle"><option value="med_wave">MED WAVE</option><option value="witch_house">WITCH HOUSE</option><option value="g_funk">G-FUNK</option><option value="klezmer">KLEZMER</option><option value="jungle">JUNGLE</option><option value="uk_rnb">UK R&amp;B</option><option value="acidcore">ACIDCORE</option><option value="deep_house">DEEP HOUSE</option><option value="trap">TRAP</option><option value="uk_drill">UK DRILL</option><option value="psytrance">PSYTRANCE</option><option value="triphop">TRIP-HOP</option><option value="dubstep">DUBSTEP</option><option value="liquid_dnb">LIQUID D&amp;B</option><option value="viking_metal">VIKING METAL</option><option value="industrial_techno">INDUSTRIAL TECHNO</option></select></span></label><label class="aux-row"><span class="aux-copy"><strong>Adaptive Music</strong><small>Raises arrangement pressure with abductions, mutants, Baiters, mines, swarms, low integrity, and Hyperflow.</small></span><span class="switch"><input id="adaptiveMusic" type="checkbox"> ENABLE</span></label><label class="aux-row"><span class="aux-copy"><strong>Background Music</strong><small>Off by default.</small></span><span class="switch"><input id="bgmEnabled" type="checkbox"> ENABLE</span></label><label class="aux-row"><span class="aux-copy"><strong>Sound Effects</strong><small>Laser, boost, rescue, impact, mutation, Baiter arrival, mines, Pod rupture, swarms, smart bomb, wave.</small></span><span class="switch"><input id="sfxEnabled" type="checkbox"> ENABLE</span></label><label class="aux-row"><span class="aux-copy"><strong>Music Volume</strong></span><span class="aux-control"><input id="musicVolume" type="range" min="0" max="100"></span></label><label class="aux-row"><span class="aux-copy"><strong>SFX Volume</strong></span><span class="aux-control"><input id="sfxVolume" type="range" min="0" max="100"></span></label></div><footer class="aux-foot"><span><b>M</b> toggles music · audio remains OFF by default</span><button class="aux-save" id="audioSave">SAVE &amp; CLOSE</button></footer></section><div id="touch"><div class="pad left"><button class="tb" data-key="ArrowLeft">◀</button><button class="tb" data-key="ArrowUp">▲</button><button class="tb" data-key="ArrowRight">▶</button><button class="tb" data-key="ArrowDown">▼</button></div><div class="pad right"><button class="tb fire" data-key="KeyZ">FIRE</button><button class="tb boost" data-key="Space">BOOST</button><button class="tb bomb" data-key="KeyC">BOMB</button></div></div><div id="testBadge"></div><div id="spriteBadge">SPRITES · LOADING</div></main>
<script>
(()=>{'use strict';
const shell=document.getElementById('shell'),canvas=document.getElementById('scene'),hudCanvas=document.getElementById('hud');
const ctx=canvas.getContext('2d',{alpha:false}),hud=hudCanvas.getContext('2d',{alpha:true});const W=960,H=540,TAU=Math.PI*2;
let renderScale=.5,hudDpr=1,lastTime=performance.now(),shake=0,flash=0;const keys=Object.create(null);const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t,wrap=(v,m)=>((v%m)+m)%m;const rnd=(a,b)=>a+Math.random()*(b-a);const distWrap=(a,b,m)=>{let d=wrap(a-b,m);if(d>m/2)d-=m;return d};
const WORLD_W=12000,GROUND_BASE=430,PLAYER_R=11,BASE_THRUST=520,BOOST_MULT=2.05,BOOST_DRAIN=31,BOOST_RECHARGE=18,LASER_SPEED=1200,SMART_RADIUS=490;
const MINE_CAP=42;
const baiterDelay=()=>Math.max(18,34-state.wave*1.2);
const ENEMY_SCORE=Object.freeze({lander:150,mutant:150,baiter:200,bomber:250,pod:1000,swarmer:150});
const PAL=[{wallA:'#ff1f78',wallB:'#ff5024',edge:'#ffd15c',grid:'#20eaff',hud:'#ff294b'},{wallA:'#dd20ff',wallB:'#ff205e',edge:'#ff91ee',grid:'#41a9ff',hud:'#ff345e'},{wallA:'#ff3e32',wallB:'#ff9a16',edge:'#fff06b',grid:'#32ffd2',hud:'#ff293f'},{wallA:'#7150ff',wallB:'#ff1cb1',edge:'#93fbff',grid:'#28cfff',hud:'#ff2c66'}];
const state={phase:'title',paused:false,time:0,worldX:900,y:250,vx:0,vy:0,facing:1,boost:100,boosting:false,lives:3,score:0,high:0,wave:1,smartBombs:3,fireCd:0,invuln:0,combo:1,rescued:0,lost:0,carrying:null,cameraX:0,threat:0,waveTime:0,baiterCd:0};
try{state.high=Number(localStorage.getItem('caveDefenderHigh')||localStorage.getItem('caveRacerV3HighScore')||0)}catch(_){}

const SPRITES={
  src:'cave-defender-sprites.png',
  image:new Image(),
  ready:false,
  failed:false,
  frames:{
    player:[[28,48,190,84],[225,46,208,89],[452,28,290,118],[776,31,168,132],[964,31,196,137],[1216,25,238,123]],
    lander:[[40,171,131,137],[189,159,162,158],[377,154,187,197],[568,169,143,151]],
    mutant:[[762,163,180,161],[951,160,189,163],[1133,152,190,175],[1308,159,191,170]],
    baiter:[[30,386,171,91],[199,379,188,98],[385,371,191,104]],
    bomber:[[602,363,163,111],[763,360,180,112],[939,357,170,120]],
    pod:[[1116,349,131,141],[1243,348,137,144],[1376,341,155,154]],
    swarmer:[[24,533,170,127],[196,530,176,124],[377,520,199,138],[377,520,199,138]],
    human:[[672,559,75,112],[779,553,72,116],[870,566,96,91],[967,517,106,157]],
    mine:[[1195,538,111,114],[1328,529,147,128]],
    fx:[[25,702,179,82],[208,696,124,90],[349,690,182,92],[548,681,260,106],[829,670,170,112],[1030,665,168,123]],
    explosion:[[35,815,147,168],[191,809,167,177],[348,798,194,196],[529,783,249,216],[766,785,237,205],[1005,790,470,193]]
  }
};
SPRITES.image.decoding='async';
SPRITES.image.onload=()=>{SPRITES.ready=true;const b=document.getElementById('spriteBadge');if(b)b.textContent='SPRITES · ONLINE';};
SPRITES.image.onerror=()=>{SPRITES.failed=true;const b=document.getElementById('spriteBadge');if(b)b.textContent='SPRITES · VECTOR FALLBACK';};
SPRITES.image.src=SPRITES.src;
function spriteFrame(group,index=0){const arr=SPRITES.frames[group];return arr?arr[Math.max(0,Math.min(arr.length-1,index|0))]:null}
function drawSprite(group,index,x,y,w,h,{flipX=false,rotation=0,alpha=1,glow=null,glowBlur=0}={}){
  if(!SPRITES.ready)return false;const f=spriteFrame(group,index);if(!f)return false;
  ctx.save();ctx.translate(x,y);ctx.rotate(rotation);if(flipX)ctx.scale(-1,1);ctx.globalAlpha=alpha;
  if(glow){ctx.shadowColor=glow;ctx.shadowBlur=glowBlur}
  ctx.drawImage(SPRITES.image,f[0],f[1],f[2],f[3],-w/2,-h/2,w,h);ctx.restore();return true
}
function enemySpriteIndex(e){
  if(e.type==='lander')return e.carry?2:(e.fire<.22?3:(Math.sin(e.phase*2)>0?1:0));
  if(e.type==='mutant')return Math.floor((e.phase*1.7)%4);
  if(e.type==='baiter')return Math.floor((e.phase*2)%3);
  if(e.type==='bomber')return e.drop<.22?2:(Math.floor(e.phase)%2);
  if(e.type==='pod')return Math.floor((e.phase*.55)%3);
  if(e.type==='swarmer')return Math.floor((e.phase*2.2)%4);
  return 0
}
function enemySpriteSize(type){return {lander:[54,58],mutant:[62,54],baiter:[62,32],bomber:[66,45],pod:[62,62],swarmer:[36,26]}[type]||[48,40]}

const humans=[],enemies=[],mines=[],lasers=[],enemyShots=[],particles=[],shockwaves=[],stars=Array.from({length:110},()=>({x:Math.random()*W,y:Math.random()*H,s:.15+Math.random()*.9,a:.08+Math.random()*.35}));
function palette(){return PAL[(state.wave-1)%PAL.length]}
function terrainY(wx){wx=wrap(wx,WORLD_W);return GROUND_BASE+Math.sin(wx*.0022)*34+Math.sin(wx*.0067+1.8)*17+Math.sin(wx*.00063+4.2)*28+Math.sin(wx*.017)*5}
function terrainSlope(wx){return (terrainY(wx+4)-terrainY(wx-4))/8}
function screenX(wx){return W*.48+distWrap(wx,state.cameraX,WORLD_W)}
function configure(){canvas.width=Math.round(W*renderScale);canvas.height=Math.round(H*renderScale);ctx.setTransform(renderScale,0,0,renderScale,0,0);ctx.imageSmoothingEnabled=false;const r=shell.getBoundingClientRect();hudDpr=clamp(devicePixelRatio||1,1,2);hudCanvas.width=Math.round(r.width*hudDpr);hudCanvas.height=Math.round(r.height*hudDpr);hud.setTransform(hudCanvas.width/W,0,0,hudCanvas.height/H,0,0)}
function makeEnemy(type,x,y,extra={}){return Object.assign({type,x:wrap(x,WORLD_W),y,vx:rnd(-25,25),vy:rnd(-12,15),hp:1,target:null,carry:null,fire:rnd(.3,1.8),phase:rnd(0,TAU),drop:rnd(.8,2.0)},extra)}
function resetEntities(){humans.length=enemies.length=mines.length=lasers.length=enemyShots.length=particles.length=shockwaves.length=0;const n=8+Math.min(8,state.wave);for(let i=0;i<n;i++){const x=wrap(500+i*(WORLD_W/n)+rnd(-180,180),WORLD_W);humans.push({x,y:terrainY(x)-7,state:'ground',carrier:null,vy:0,blink:rnd(0,TAU),anim:rnd(0,TAU)})}spawnWave()}
function spawnWave(){enemies.length=0;mines.length=0;state.waveTime=0;state.baiterCd=0;const landers=4+state.wave*2,bombers=state.wave>=2?Math.min(1+Math.floor((state.wave-2)/2),4):0,pods=state.wave>=3?Math.min(1+Math.floor((state.wave-3)/3),3):0;for(let i=0;i<landers;i++)enemies.push(makeEnemy('lander',state.worldX+600+i*WORLD_W/landers+rnd(-240,240),rnd(90,220)));for(let i=0;i<bombers;i++)enemies.push(makeEnemy('bomber',state.worldX+WORLD_W*(i+1)/(bombers+1)+rnd(-360,360),rnd(120,300),{vx:rnd(95,150)*(i%2?1:-1),vy:rnd(-35,35),fire:rnd(.8,1.6),drop:rnd(.45,1.15)}));for(let i=0;i<pods;i++)enemies.push(makeEnemy('pod',state.worldX+WORLD_W*(i+.5)/pods+rnd(-420,420),rnd(130,320),{vx:rnd(-60,60),vy:rnd(-25,25),fire:999,drop:999}))}
function spawnBaiter(){const side=Math.random()<.5?-1:1;enemies.push(makeEnemy('baiter',state.worldX+side*rnd(620,900),clamp(state.y+rnd(-150,150),90,terrainY(state.worldX)-70),{vx:-side*rnd(720,850),vy:rnd(-120,120),fire:rnd(.2,.55),drop:999}));AUXOR.sfx('baiter')}
function spawnSwarmers(e,count=6){for(let i=0;i<count;i++){const a=i/count*TAU+rnd(-.25,.25),speed=rnd(260,390);enemies.push(makeEnemy('swarmer',e.x+rnd(-10,10),e.y+rnd(-10,10),{vx:Math.cos(a)*speed,vy:Math.sin(a)*speed,fire:rnd(.7,1.5),drop:999,phase:a}))}AUXOR.sfx('swarm')}
function layMine(e){if(mines.length>=MINE_CAP)return;mines.push({x:e.x,y:e.y+rnd(-12,12),phase:rnd(0,TAU),life:22});AUXOR.sfx('mine')}

function startGame(){Object.assign(state,{phase:'play',paused:false,time:0,worldX:900,y:240,vx:180,vy:0,facing:1,boost:100,boosting:false,lives:3,score:0,wave:1,smartBombs:3,fireCd:0,invuln:0,combo:1,rescued:0,lost:0,carrying:null,cameraX:900,threat:0,waveTime:0,baiterCd:0});resetEntities();AUXOR.reset();reconcileAudio()}
function endGame(){state.phase='over';state.boosting=false;AUXOR.sfx('game_over');reconcileAudio();if(state.score>state.high){state.high=Math.floor(state.score);try{localStorage.setItem('caveDefenderHigh',state.high)}catch(_){}}}
function burst(x,y,col,n=18,pow=1){for(let i=0;i<n;i++)particles.push({x,y,vx:rnd(-250,250)*pow,vy:rnd(-250,250)*pow,life:rnd(.25,.8),col,size:rnd(1,3)});if(n>=16)shockwaves.push({x,y,r:5,max:92+pow*42,life:1,col,width:1.5,spriteExplosion:true})}
function ring(x,y,col,max=180,width=2){shockwaves.push({x,y,r:5,max,life:1,col,width})}
function hitPlayer(){if(state.invuln>0)return;state.lives--;state.invuln=1.4;state.boost=Math.max(0,state.boost-28);state.vx*=-.35;state.vy*=-.55;shake=18;flash=1;burst(state.worldX,state.y,palette().edge,28,1.2);ring(state.worldX,state.y,palette().hud,220,3);AUXOR.sfx('hit');if(state.lives<=0)endGame()}
function fireLaser(){if(state.phase!=='play'||state.paused||state.fireCd>0)return;state.fireCd=.095;const dir=state.facing;lasers.push({x:wrap(state.worldX+dir*24,WORLD_W),y:state.y,vx:dir*LASER_SPEED,life:.75});AUXOR.sfx('laser')}
function enemyPoints(type){return ENEMY_SCORE[type]||0}
function destroyEnemy(index,cause='laser'){const e=enemies[index];if(!e)return 0;releaseCarrier(e,true);burst(e.x,e.y,palette().edge,e.type==='pod'?34:18,e.type==='pod'?1.45:1);ring(e.x,e.y,e.type==='pod'?'#fff':palette().grid,e.type==='pod'?180:80,e.type==='pod'?3:1);const points=enemyPoints(e.type);enemies.splice(index,1);state.score+=points;if(e.type==='pod')spawnSwarmers(e,5+Math.min(4,Math.floor(state.wave/3)));AUXOR.sfx(e.type==='pod'?'pod':'explode');return points}
function smartBomb(){if(state.phase!=='play'||state.paused||state.smartBombs<=0)return;state.smartBombs--;const p=palette();ring(state.worldX,state.y,'#fff',SMART_RADIUS,5);ring(state.worldX,state.y,p.grid,SMART_RADIUS*1.15,2);burst(state.worldX,state.y,p.grid,45,1.6);shake=12;for(let i=enemies.length-1;i>=0;i--){const e=enemies[i],dx=Math.abs(distWrap(e.x,state.worldX,WORLD_W)),dy=Math.abs(e.y-state.y);if(dx<SMART_RADIUS&&dy<SMART_RADIUS*.65)destroyEnemy(i,'bomb')}for(let i=mines.length-1;i>=0;i--){const m=mines[i],dx=Math.abs(distWrap(m.x,state.worldX,WORLD_W)),dy=Math.abs(m.y-state.y);if(dx<SMART_RADIUS&&dy<SMART_RADIUS*.65){burst(m.x,m.y,p.grid,8,.6);mines.splice(i,1)}}AUXOR.sfx('bomb')}
function nearestGroundHuman(e){let best=null,bd=1e9;for(const h of humans)if(h.state==='ground'){const d=Math.abs(distWrap(h.x,e.x,WORLD_W));if(d<bd){bd=d;best=h}}return best}
function releaseCarrier(e,fall){if(!e.carry)return;const h=e.carry;h.carrier=null;h.state=fall?'falling':'ground';h.vy=fall?60:0;if(!fall){h.y=terrainY(h.x)-7}e.carry=null}
function mutate(e){if(e.carry){const h=e.carry;h.state='lost';h.carrier=null;state.lost++;e.carry=null}e.type='mutant';e.vx=0;e.vy=0;e.hp=1;AUXOR.sfx('mutate')}
function rescueHuman(h){if(state.carrying||h.state!=='falling')return;state.carrying=h;h.state='carried';h.carrier='player';state.score+=500;state.rescued++;AUXOR.sfx('rescue')}
function deliverHuman(){const h=state.carrying;if(!h)return;const gy=terrainY(state.worldX);if(state.y<gy-34)return;h.state='ground';h.carrier=null;h.x=state.worldX;h.y=gy-7;h.vy=0;state.carrying=null;state.score+=500;state.combo=Math.min(5,state.combo+.25);AUXOR.sfx('deliver')}
function updatePlayer(dt){state.fireCd=Math.max(0,state.fireCd-dt);state.invuln=Math.max(0,state.invuln-dt);const up=keys.ArrowUp||keys.KeyW,down=keys.ArrowDown||keys.KeyS,left=keys.ArrowLeft||keys.KeyA,right=keys.ArrowRight||keys.KeyD;let ax=0,ay=0;if(left){ax-=1;state.facing=-1}if(right){ax+=1;state.facing=1}if(up)ay-=1;if(down)ay+=1;const wantsBoost=keys.Space||keys.KeyX;state.boosting=!!(wantsBoost&&state.boost>0.3);const mult=state.boosting?BOOST_MULT:1;if(state.boosting)state.boost=Math.max(0,state.boost-BOOST_DRAIN*dt);else state.boost=Math.min(100,state.boost+BOOST_RECHARGE*dt);state.vx+=ax*BASE_THRUST*mult*dt;state.vy+=ay*BASE_THRUST*.82*mult*dt;const drag=Math.pow(state.boosting?.993:.978,dt*60);state.vx*=drag;state.vy*=Math.pow(.965,dt*60);state.vx=clamp(state.vx,-930*mult,930*mult);state.vy=clamp(state.vy,-510*mult,510*mult);state.worldX=wrap(state.worldX+state.vx*dt,WORLD_W);state.y+=state.vy*dt;const gy=terrainY(state.worldX);if(state.y>gy-PLAYER_R){state.y=gy-PLAYER_R;state.vy=Math.min(-80,state.vy*-.32);hitPlayer()}if(state.y<72){state.y=72;state.vy=Math.max(30,state.vy*-.3)}deliverHuman();state.cameraX=wrap(lerp(state.cameraX,state.worldX,.11),WORLD_W);if(state.boosting&&Math.random()<dt*22)burst(wrap(state.worldX-state.facing*18,WORLD_W),state.y,palette().grid,1,.35);if(state.boosting&&Math.random()<dt*5)ring(state.worldX,state.y,palette().grid,90,1)}
function updateHumans(dt){for(const h of humans){h.blink+=dt*3;if(h.state==='falling'){h.vy+=260*dt;h.y+=h.vy*dt;const gy=terrainY(h.x)-7;if(h.y>=gy){h.y=gy;h.vy=0;h.state='ground'}const dx=Math.abs(distWrap(h.x,state.worldX,WORLD_W)),dy=Math.abs(h.y-state.y);if(dx<24&&dy<24)rescueHuman(h)}else if(h.state==='carried'){h.x=state.worldX;h.y=state.y+18}else if(h.state==='ground'){h.y=terrainY(h.x)-7}}}
function enemyShoot(e){const dx=distWrap(state.worldX,e.x,WORLD_W),dy=state.y-e.y,d=Math.hypot(dx,dy)||1;enemyShots.push({x:e.x,y:e.y,vx:dx/d*360,vy:dy/d*360,life:3});AUXOR.sfx('enemy')}
function updateEnemies(dt){let danger=0;state.waveTime+=dt;state.baiterCd=Math.max(0,state.baiterCd-dt);if(enemies.length&&state.waveTime>baiterDelay()&&state.baiterCd<=0){spawnBaiter();state.baiterCd=Math.max(5.5,10-state.wave*.25)}for(const e of enemies){e.phase+=dt*(e.type==='swarmer'?5.8:2.3);e.fire-=dt;e.drop-=dt;if(e.type==='lander'){if(e.carry){e.y-=46*dt;e.x=wrap(e.x+Math.sin(e.phase)*12*dt,WORLD_W);const h=e.carry;h.x=e.x;h.y=e.y+16;if(e.y<72)mutate(e)}else{if(!e.target||e.target.state!=='ground')e.target=nearestGroundHuman(e);if(e.target){const dx=distWrap(e.target.x,e.x,WORLD_W);e.vx=lerp(e.vx,clamp(dx*.65,-110,110),.04);const targetY=terrainY(e.target.x)-34;e.vy=lerp(e.vy,clamp((targetY-e.y)*.8,-90,90),.035);e.x=wrap(e.x+e.vx*dt,WORLD_W);e.y+=e.vy*dt;if(Math.abs(dx)<16&&Math.abs(e.y-targetY)<22){e.carry=e.target;e.target.state='abducted';e.target.carrier=e;AUXOR.sfx('abduct')}}}if(e.carry||e.y>340)danger+=1}else if(e.type==='mutant'){const dx=distWrap(state.worldX,e.x,WORLD_W),dy=state.y-e.y,d=Math.hypot(dx,dy)||1;e.vx=lerp(e.vx,dx/d*300+Math.sin(e.phase*1.7)*95,.07);e.vy=lerp(e.vy,dy/d*250+Math.cos(e.phase*2.1)*80,.07);e.x=wrap(e.x+e.vx*dt,WORLD_W);e.y=clamp(e.y+e.vy*dt,82,terrainY(e.x)-34);danger+=2}else if(e.type==='baiter'){const dx=distWrap(state.worldX,e.x,WORLD_W),dy=state.y-e.y,d=Math.hypot(dx,dy)||1;const leadX=dx+state.vx*.28,leadY=dy+state.vy*.18,ld=Math.hypot(leadX,leadY)||1;e.vx=lerp(e.vx,leadX/ld*860,.12);e.vy=lerp(e.vy,leadY/ld*620,.12);e.x=wrap(e.x+e.vx*dt,WORLD_W);e.y=clamp(e.y+e.vy*dt,82,terrainY(e.x)-28);danger+=3}else if(e.type==='bomber'){e.x=wrap(e.x+e.vx*dt,WORLD_W);e.y+=e.vy*dt+Math.sin(e.phase)*18*dt;const ceiling=90,floor=terrainY(e.x)-55;if(e.y<ceiling||e.y>floor){e.vy*=-1;e.y=clamp(e.y,ceiling,floor)}if(e.drop<=0){layMine(e);e.drop=rnd(.55,1.2)}danger+=1.4}else if(e.type==='pod'){e.x=wrap(e.x+e.vx*dt,WORLD_W);e.y+=Math.sin(e.phase*.72)*13*dt+e.vy*dt*.25;e.y=clamp(e.y,105,terrainY(e.x)-55);danger+=.7}else if(e.type==='swarmer'){const dx=distWrap(state.worldX,e.x,WORLD_W),dy=state.y-e.y,d=Math.hypot(dx,dy)||1,orbit=Math.sin(e.phase*1.3)*120;e.vx=lerp(e.vx,dx/d*420+Math.cos(e.phase)*orbit,.12);e.vy=lerp(e.vy,dy/d*350+Math.sin(e.phase*1.7)*110,.12);e.x=wrap(e.x+e.vx*dt,WORLD_W);e.y=clamp(e.y+e.vy*dt,78,terrainY(e.x)-24);danger+=1.8}if(e.fire<=0&&Math.abs(distWrap(e.x,state.worldX,WORLD_W))<540&&!['pod','bomber'].includes(e.type)){enemyShoot(e);e.fire=e.type==='baiter'?rnd(.28,.55):e.type==='swarmer'?rnd(.65,1.2):e.type==='mutant'?rnd(.45,.9):rnd(1.1,2.2)}}state.threat=clamp(danger/Math.max(1,enemies.length*1.8),0,1)}
function updateProjectiles(dt){for(let i=lasers.length-1;i>=0;i--){const l=lasers[i];l.x=wrap(l.x+l.vx*dt,WORLD_W);l.life-=dt;let hit=-1;for(let j=0;j<enemies.length;j++){const e=enemies[j],rx=e.type==='swarmer'?11:e.type==='pod'?25:20,ry=e.type==='swarmer'?9:e.type==='pod'?22:15;if(Math.abs(distWrap(e.x,l.x,WORLD_W))<rx&&Math.abs(e.y-l.y)<ry){hit=j;break}}if(hit>=0){destroyEnemy(hit,'laser');lasers.splice(i,1);continue}let mineHit=-1;for(let j=0;j<mines.length;j++){const m=mines[j];if(Math.abs(distWrap(m.x,l.x,WORLD_W))<10&&Math.abs(m.y-l.y)<10){mineHit=j;break}}if(mineHit>=0){const m=mines[mineHit];burst(m.x,m.y,palette().grid,8,.55);mines.splice(mineHit,1);lasers.splice(i,1);AUXOR.sfx('mine_pop');continue}if(l.life<=0)lasers.splice(i,1)}for(let i=enemyShots.length-1;i>=0;i--){const b=enemyShots[i];b.x=wrap(b.x+b.vx*dt,WORLD_W);b.y+=b.vy*dt;b.life-=dt;if(Math.abs(distWrap(b.x,state.worldX,WORLD_W))<PLAYER_R+5&&Math.abs(b.y-state.y)<PLAYER_R+5){enemyShots.splice(i,1);hitPlayer();continue}if(b.life<=0||b.y>H+80||b.y<40)enemyShots.splice(i,1)}for(let i=mines.length-1;i>=0;i--){const m=mines[i];m.phase+=dt*3.2;m.life-=dt;if(Math.abs(distWrap(m.x,state.worldX,WORLD_W))<PLAYER_R+8&&Math.abs(m.y-state.y)<PLAYER_R+8){burst(m.x,m.y,palette().hud,18,1);mines.splice(i,1);hitPlayer();continue}if(m.life<=0)mines.splice(i,1)}}
function updateEffects(dt){for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x=wrap(p.x+p.vx*dt,WORLD_W);p.y+=p.vy*dt;p.vx*=Math.pow(.97,dt*60);p.vy*=Math.pow(.97,dt*60);p.life-=dt;if(p.life<=0)particles.splice(i,1)}for(let i=shockwaves.length-1;i>=0;i--){const s=shockwaves[i];s.r+=300*dt;s.life-=dt*1.25;if(s.life<=0||s.r>s.max)shockwaves.splice(i,1)}shake*=Math.pow(.07,dt);flash=Math.max(0,flash-dt*3)}
function checkWave(){if(enemies.length)return;state.wave++;state.smartBombs=Math.min(5,state.smartBombs+1);state.score+=humans.filter(h=>h.state!=='lost').length*100;mines.length=0;AUXOR.sfx('wave');spawnWave()}
function update(dt){state.time+=dt*1000;updateEffects(dt);if(state.phase!=='play'||state.paused)return;updatePlayer(dt);updateHumans(dt);updateEnemies(dt);updateProjectiles(dt);checkWave();state.score+=dt*(20+Math.abs(state.vx)*.015)*(state.boosting?1.3:1)*state.combo;AUXOR.adapt()}
function drawStars(){ctx.save();for(const s of stars){const par=.15+s.s*.6,x=wrap(s.x-state.cameraX*par,W+80)-40;ctx.globalAlpha=s.a;ctx.fillStyle=s.s>.6?palette().grid:'#fff';ctx.fillRect(x,s.y,1+s.s*1.5,1)}ctx.restore()}
function drawTerrain(){const p=palette();ctx.save();const fill=new Path2D();fill.moveTo(-20,H);for(let sx=-20;sx<=W+20;sx+=8){const wx=wrap(state.cameraX+(sx-W*.48),WORLD_W);fill.lineTo(sx,terrainY(wx))}fill.lineTo(W+20,H);fill.closePath();const g=ctx.createLinearGradient(0,GROUND_BASE-80,0,H);g.addColorStop(0,'rgba(40,5,50,.75)');g.addColorStop(1,'#050108');ctx.fillStyle=g;ctx.fill(fill);ctx.strokeStyle=p.wallA;ctx.lineWidth=2;ctx.shadowColor=p.wallA;ctx.shadowBlur=12;ctx.beginPath();for(let sx=-20;sx<=W+20;sx+=8){const wx=wrap(state.cameraX+(sx-W*.48),WORLD_W),y=terrainY(wx);if(sx===-20)ctx.moveTo(sx,y);else ctx.lineTo(sx,y)}ctx.stroke();ctx.shadowBlur=0;ctx.strokeStyle='rgba(255,255,255,.6)';ctx.lineWidth=.7;ctx.stroke();ctx.restore()}
function drawGrid(){const p=palette();ctx.save();ctx.globalAlpha=.12;ctx.strokeStyle=p.grid;ctx.lineWidth=.6;for(let x=-((state.cameraX*.35)%32);x<W;x+=32){ctx.beginPath();ctx.moveTo(x,78);ctx.lineTo(x,H);ctx.stroke()}for(let y=90;y<H;y+=32){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}ctx.restore()}
function drawHumans(){ctx.save();for(const h of humans){if(h.state==='lost')continue;const x=screenX(h.x);if(x<-40||x>W+40)continue;const idx=h.state==='falling'?2:h.state==='carried'||h.state==='abducted'?3:(Math.sin(h.blink)>0.55?1:0);if(drawSprite('human',idx,x,h.y-4,26,38,{alpha:.96,glow:h.state==='abducted'?'#ff536b':h.state==='carried'?'#ffd15c':'#53ff64',glowBlur:5}))continue;ctx.translate(x,h.y);ctx.strokeStyle=h.state==='abducted'?'#ff536b':h.state==='carried'?'#ffd15c':'#53ff64';ctx.fillStyle=ctx.strokeStyle;ctx.lineWidth=1.4;ctx.beginPath();ctx.arc(0,-5,2.5,0,TAU);ctx.fill();ctx.beginPath();ctx.moveTo(0,-2);ctx.lineTo(0,6);ctx.moveTo(0,1);ctx.lineTo(-4,4);ctx.moveTo(0,1);ctx.lineTo(4,4);ctx.moveTo(0,6);ctx.lineTo(-3,11);ctx.moveTo(0,6);ctx.lineTo(3,11);ctx.stroke();ctx.translate(-x,-h.y)}ctx.restore()}
function drawEnemies(){const p=palette();ctx.save();for(const e of enemies){const x=screenX(e.x);if(x<-90||x>W+90)continue;const [sw,sh]=enemySpriteSize(e.type),ang=(e.type==='mutant'||e.type==='baiter'||e.type==='swarmer')?Math.atan2(e.vy,e.vx):0;const flip=(e.type==='mutant'||e.type==='baiter'||e.type==='swarmer'||e.type==='bomber')&&e.vx<0;const glow={lander:'#53ff64',mutant:p.hud,baiter:p.edge,bomber:'#ff9f2f',pod:'#c982ff',swarmer:'#ffd15c'}[e.type]||p.grid;if(drawSprite(e.type,enemySpriteIndex(e),x,e.y,sw,sh,{flipX:flip,rotation:flip?ang+Math.PI:ang,glow,glowBlur:e.type==='pod'?11:6}))continue;ctx.save();ctx.translate(x,e.y);ctx.strokeStyle=glow;ctx.shadowColor=glow;ctx.shadowBlur=8;ctx.lineWidth=1.5;if(e.type==='pod'){ctx.beginPath();ctx.arc(0,0,15,0,TAU);ctx.stroke()}else{ctx.rotate(ang);ctx.beginPath();ctx.moveTo(16,0);ctx.lineTo(-10,-8);ctx.lineTo(-5,0);ctx.lineTo(-10,8);ctx.closePath();ctx.stroke()}ctx.restore()}ctx.restore()}
function drawMines(){const p=palette();ctx.save();for(const m of mines){const x=screenX(m.x);if(x<-35||x>W+35)continue;const armed=(Math.sin(m.phase*2)>.2)?1:0;if(drawSprite('mine',armed,x,m.y,31,31,{rotation:m.phase*.08,glow:armed?p.hud:'#c982ff',glowBlur:armed?10:5}))continue;ctx.save();ctx.translate(x,m.y);ctx.strokeStyle=p.hud;ctx.beginPath();ctx.arc(0,0,6,0,TAU);ctx.stroke();ctx.restore()}ctx.restore()}
function drawProjectiles(){ctx.save();for(const l of lasers){const x=screenX(l.x);if(drawSprite('fx',0,x,l.y,36,13,{flipX:l.vx<0,glow:palette().grid,glowBlur:6}))continue;ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,l.y);ctx.lineTo(x-Math.sign(l.vx)*24,l.y);ctx.stroke()}for(const b of enemyShots){const x=screenX(b.x),ang=Math.atan2(b.vy,b.vx);if(drawSprite('fx',1,x,b.y,24,11,{rotation:ang,glow:palette().hud,glowBlur:6}))continue;ctx.fillStyle=palette().hud;ctx.beginPath();ctx.arc(x,b.y,2.5,0,TAU);ctx.fill()}ctx.restore()}
function drawEffects(){ctx.save();for(const s of shockwaves){const x=screenX(s.x);if(s.spriteExplosion&&SPRITES.ready){const progress=1-clamp(s.life,0,1),frame=Math.min(5,Math.floor(progress*6));drawSprite('explosion',frame,x,s.y,56+progress*58,56+progress*58,{alpha:Math.min(1,s.life*1.45),glow:s.col,glowBlur:10});continue}ctx.globalAlpha=s.life*.5;ctx.strokeStyle=s.col;ctx.lineWidth=s.width;ctx.shadowColor=s.col;ctx.shadowBlur=10;ctx.beginPath();ctx.ellipse(x,s.y,s.r*1.45,s.r*.55,0,0,TAU);ctx.stroke()}for(const p of particles){const x=screenX(p.x);ctx.globalAlpha=clamp(p.life*1.4,0,1);ctx.fillStyle=p.col;ctx.fillRect(x,p.y,p.size,p.size)}ctx.restore()}
function drawShockCone(){if(!state.boosting)return;const p=palette(),dir=state.facing,x=W*.48,y=state.y;ctx.save();ctx.translate(x,y);ctx.scale(dir,1);ctx.globalCompositeOperation='screen';for(let i=0;i<6;i++){const d=26+i*28,w=17+i*10;ctx.globalAlpha=.13*(1-i/8);ctx.strokeStyle=i%2?p.grid:'#fff';ctx.lineWidth=i===0?2.3:1.1;ctx.beginPath();ctx.moveTo(12,-4);ctx.quadraticCurveTo(-d*.35,-w*.72,-d,-w);ctx.moveTo(12,4);ctx.quadraticCurveTo(-d*.35,w*.72,-d,w);ctx.stroke()}for(let i=0;i<4;i++){const d=42+i*40;ctx.globalAlpha=.12;ctx.strokeStyle=i%2?p.wallA:p.grid;ctx.beginPath();ctx.ellipse(-d,0,14+i*7,7+i*4,0,0,TAU);ctx.stroke()}ctx.restore()}
function drawPlayer(){if(state.invuln>0&&Math.floor(state.time/70)%2===0)return;const p=palette(),dir=state.facing,pitch=clamp(state.vy/900,-.28,.28);let frame=0;if(state.invuln>0)frame=5;else if(state.boosting)frame=2;else if(state.vy<-90)frame=3;else if(state.vy>90)frame=4;else if(Math.abs(state.vx)>260)frame=1;if(drawSprite('player',frame,W*.48,state.y,state.boosting?92:76,state.boosting?48:42,{flipX:dir<0,rotation:dir<0?-pitch:pitch,glow:p.grid,glowBlur:state.boosting?12:6}))return;ctx.save();ctx.translate(W*.48,state.y);ctx.scale(dir,1);ctx.rotate(pitch);ctx.strokeStyle=p.grid;ctx.fillStyle='#02030a';ctx.shadowColor=p.grid;ctx.shadowBlur=state.boosting?16:9;ctx.lineWidth=1.6;ctx.beginPath();ctx.moveTo(26,0);ctx.lineTo(8,-6);ctx.lineTo(-7,-7);ctx.lineTo(-20,-13);ctx.lineTo(-12,-2);ctx.lineTo(-26,0);ctx.lineTo(-12,2);ctx.lineTo(-20,13);ctx.lineTo(-7,7);ctx.lineTo(8,6);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore()}
function drawRadar(){const p=palette(),x=320,y=17,w=320,h=44;hud.save();hud.fillStyle='rgba(0,0,0,.72)';hud.fillRect(x,y,w,h);hud.strokeStyle='rgba(65,80,255,.75)';hud.strokeRect(x+.5,y+.5,w-1,h-1);const mapX=wx=>x+wrap(wx,WORLD_W)/WORLD_W*w;hud.strokeStyle='rgba(255,136,70,.55)';hud.beginPath();for(let i=0;i<=120;i++){const wx=i/120*WORLD_W,rx=x+i/120*w,ry=y+h-4-(H-terrainY(wx))*.035;if(i===0)hud.moveTo(rx,ry);else hud.lineTo(rx,ry)}hud.stroke();const radarCol={lander:'#53ff64',mutant:p.hud,baiter:'#fff',bomber:'#ff9f2f',pod:'#c982ff',swarmer:'#ffd15c'};for(const e of enemies){hud.fillStyle=radarCol[e.type]||'#fff';const sz=e.type==='pod'?4:e.type==='swarmer'?2:3;hud.fillRect(mapX(e.x)-sz/2,y+8+(e.y/450)*(h-16),sz,sz)}for(const m of mines){hud.fillStyle='rgba(255,60,120,.75)';hud.fillRect(mapX(m.x),y+8+(m.y/450)*(h-16),1.5,1.5)}for(const hmn of humans)if(hmn.state!=='lost'){hud.fillStyle=hmn.state==='abducted'?'#ff536b':'#ffd15c';hud.fillRect(mapX(hmn.x),y+h-8,2,2)}const px=mapX(state.worldX);hud.strokeStyle='#fff';hud.lineWidth=1.5;hud.strokeRect(px-4,y+4,8,h-8);hud.restore()}
