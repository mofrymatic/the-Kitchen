const clamp=(v,a,b)=>v<a?a:v>b?b:v, TAU=Math.PI*2, rnd=(a,b)=>a+Math.random()*(b-a);
function closest(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay,l2=dx*dx+dy*dy;let t=l2?((px-ax)*dx+(py-ay)*dy)/l2:0;t=t<0?0:t>1?1:t;return[ax+dx*t,ay+dy*t,t];}
function inPoly(x,y,p){let c=false;for(let i=0,j=p.length-1;i<p.length;j=i++){const a=p[i],b=p[j];if((a[1]>y)!==(b[1]>y)&&x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0])c=!c}return c;}

function resolve(b,nx,ny,pen,e,svx=0,svy=0){b.x+=nx*pen;b.y+=ny*pen;const rvx=b.vx-svx,rvy=b.vy-svy,vn=rvx*nx+rvy*ny;if(vn>=0)return 0;

function hitWall(b,w){const[qx,qy]=closest(b.x,b.y,w.ax,w.ay,w.bx,w.by);let nx=b.x-qx,ny=b.y-qy;const d=Math.hypot(nx,ny),min=b.r+w.t;if(d>=min||d<1e-6)return 0;nx/=d;ny/=d;
 if(w.oneway){const sx=w.by-w.ay,sy=-(w.bx-w.ax);if((b.x-w.ax)*sx+(b.y-w.ay)*sy>0)return 0;}
 const imp=resolve(b,nx,ny,min-d,w.e);
 if(w.sling&&imp>90&&(w.sling.cool||0)<=S.t&&!S.tilt){const s=w.sling,K2=2350;b.vx+=nx*K2;b.vy+=ny*K2;s.flash=1;s.cool=S.t+.12;add(110,100);energy(1);sfx.sling();switchHit()}
 else if(w.tag==='core'&&imp>0)coreHit(b,imp);

 for(const q of targets){glow(q.lamp[0],q.lamp[1],30,'a',q.lit?.75:play?.12+.1*Math.sin(t*3):0);glow(q.lamp[0],q.lamp[1],44,'w',q.flash)}
 for(const side of['L','R']){const n=S['a'+side];aLamps[side].forEach((p,i)=>glow(p[0],p[1],24,'g',i<n?.8:(play&&i===n&&blink)?.4:0));
  const lit=!S.loopsDone[side==='L'?'LOOPL':'LOOPR'];arrowLamps[side].forEach((p,i)=>glow(p[0],p[1],30,'r',play&&lit?(Math.floor(t*6)%4===i?.9:.18):0))}
 const lv=S.multiball?10:Math.floor(S.energy/10);coreLamps.forEach((p,i)=>glow(p[0],p[1],26,'b',i<lv?(S.energy>=100||S.multiball?.55+.45*Math.sin(t*9):.8):0));
 if(S.energy>=100||S.multiball){glow(617,640,110,'b',.35+.25*Math.sin(t*6));glow(614,860,70,'w',.3+.3*Math.sin(t*9))}
 if(S.lockBall)glow(614,760,190,'b',.8);
 rollLamps.forEach((p,i)=>glow(p[0],p[1],20,'a',S.rolls[i]?.9:0));
 if(S.hyperLit)glow(925,660,60,'p',.35+.35*Math.sin(t*8));
 if(S.skillArmed&&play&&S.balls.some(inLane)||S.t<S.skillUntil&&S.skillArmed){glow(597,1150,46,'p',.5+.4*blink);glow(748,450,40,'p',.4+.4*blink)}
 if(S.saveUntil>S.t&&play)glow(600,1214,50,'a',S.saveUntil-S.t<2?blink*.8:.7);
 glow(SAUCER.x,SAUCER.y+8,60,'r',S.balls.some(b=>b.held&&b.held.kind==='saucer')?.8:0);
 if(S.flash)glow(615,700,700,'w',S.flash*.22);
 ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over'}
function saucerHole(){const g=ctx.createRadialGradient(SAUCER.x,SAUCER.y,2,SAUCER.x,SAUCER.y,24);g.addColorStop(0,'#000');g.addColorStop(.7,'#140608');g.addColorStop(1,'rgba(40,10,12,0)');ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(SAUCER.x,SAUCER.y,24,18,0,0,TAU);ctx.fill();
 ctx.strokeStyle='rgba(210,215,225,.6)';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(SAUCER.x,SAUCER.y,20,15,0,Math.PI*.1,Math.PI*.9);ctx.stroke()}
function slingRubber(){for(const s of slings){if(!s.flash)continue;const[ax,ay]=s.a,[cx,cy]=s.c,mx=(ax+cx)/2,my=(ay+cy)/2,nx=-(cy-ay),ny=cx-ax,l=Math.hypot(nx,ny),o=s.flash*9*(s===slings[0]?1:-1);ctx.strokeStyle=`rgba(255,255,255,${.7*s.flash})`;ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(ax,ay);ctx.quadraticCurveTo(mx+nx/l*o,my+ny/l*o,cx,cy);ctx.stroke()}}
function glass(){const g=ctx.createLinearGradient(OX,0,OX+LW,PFH);g.addColorStop(0,'rgba(255,255,255,.035)');g.addColorStop(.45,'rgba(255,255,255,0)');g.addColorStop(.7,'rgba(255,255,255,.025)');g.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=g;ctx.fillRect(OX,0,LW,PFH)}
function render(){ctx.setTransform(K,0,0,K,0,0);ctx.fillStyle='#050405';ctx.fillRect(0,0,LW,LH);dmdRender();drawDMD();
 const sx=S.shake?rnd(-S.shake,S.shake)*.6:0,sy=S.shake?rnd(-S.shake,S.shake)*.4:0;
 ctx.save();ctx.beginPath();ctx.rect(0,DMDH,LW,PFH);ctx.clip();ctx.translate(-OX+sx,DMDH+sy);
 if(artReady)ctx.drawImage(art,OX,0,LW,PFH);saucerHole();lanePanel();rocket();lamps();slingRubber();
 const L0=S.balls.filter(b=>!b.ramp),L1=S.balls.filter(b=>b.ramp);
 drawFlipper(FL);drawFlipper(FR);for(const b of L0)drawBall(b);drawSpinner();for(const b of L1)drawBall(b);
 if(S.tilt){ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(OX,0,LW,PFH)}glass();
 if(paused){ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(OX,0,LW,PFH)}ctx.restore();
 if(DEBUG)debugDraw()}
let DEBUG=/debug/.test(location.hash);
function debugDraw(){ctx.save();ctx.setTransform(K,0,0,K,0,0);ctx.translate(-OX,DMDH);ctx.strokeStyle='#0f0';ctx.lineWidth=2;for(const w of walls){ctx.strokeStyle=w.oneway?'#ff0':w.sling?'#f0f':'#0f0';ctx.beginPath();ctx.moveTo(w.ax,w.ay);ctx.lineTo(w.bx,w.by);ctx.stroke()}
 ctx.strokeStyle='#0ff';for(const p of[...posts,...bumpers]){ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,TAU);ctx.stroke()}for(const t of targets){ctx.strokeStyle='#fa0';ctx.beginPath();ctx.moveTo(t.ax,t.ay);ctx.lineTo(t.bx,t.by);ctx.stroke()}
 ctx.strokeStyle='rgba(255,80,255,.8)';for(const r of Object.values(ROUTES)){ctx.beginPath();r.pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.stroke()}ctx.restore()}

/* ============ loop ============ */
let last=performance.now(),acc=0;const STEP=1/240;
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(!paused&&!window.__HALT){acc+=dt;while(acc>=STEP){physics(STEP);acc-=STEP}rules(dt)}else dmdCompose(0);render();requestAnimationFrame(frame)}
requestAnimationFrame(frame);
window.__PIN__={S,FL,FR,walls,ROUTES,physics,rules,startGame,launch,newBall,inLane,releasePlunger,setDebug:v=>DEBUG=v};
