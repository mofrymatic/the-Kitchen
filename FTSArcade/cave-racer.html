  <style>
    :root{
      color-scheme:dark;
      --red:#ff2745;
      --cyan:#20eaff;
      --magenta:#ff28b7;
      --ink:#03040a;
    }
    *,*::before,*::after{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;background:#020208}
    body{
      display:grid;
      place-items:center;
      background:
        radial-gradient(circle at 50% 42%,rgba(57,13,88,.34),transparent 48%),
        linear-gradient(120deg,rgba(255,20,75,.045),transparent 30%,rgba(0,200,255,.035) 70%,transparent),
        #020208;
      font-family:"Courier New",ui-monospace,monospace;
    }
    body.firefox #crt{opacity:.25}
    body.firefox #glass{opacity:.75}
    #shell{
      position:relative;
      width:min(100vw,177.7778vh);
      aspect-ratio:16/9;
      overflow:hidden;
      background:#020208;
      border:1px solid rgba(255,49,79,.34);
      box-shadow:0 0 90px rgba(255,20,80,.08),0 0 60px rgba(0,225,255,.06),inset 0 0 30px rgba(0,0,0,.8);
      isolation:isolate;
    }
    #scene,#hud{
      position:absolute;inset:0;width:100%;height:100%;display:block;
      background:#020208;
      cursor:crosshair;
    }
    #scene{
      z-index:1;
      image-rendering:pixelated;
      image-rendering:crisp-edges;
    }
    #hud{
      z-index:8;
      pointer-events:none;
      background:transparent;
      image-rendering:auto;
    }
    #tiltShift,#crt,#glass,#bezel{position:absolute;inset:0;pointer-events:none}
    #tiltShift{
      z-index:2;
      background:
        linear-gradient(to bottom,rgba(0,0,0,.34),rgba(0,0,0,.14) 9%,rgba(255,255,255,.018) 17%,transparent 28%,transparent 72%,rgba(255,255,255,.016) 82%,rgba(0,0,0,.16) 90%,rgba(0,0,0,.38)),
        radial-gradient(ellipse at center,transparent 42%,rgba(0,0,0,.16) 100%);
      mix-blend-mode:screen;
      opacity:.88;
    }
    body.firefox #tiltShift{opacity:.7}
    #crt{
      z-index:3;
      opacity:.46;
      background:
        repeating-linear-gradient(to bottom,rgba(255,255,255,.02) 0,rgba(255,255,255,.02) 1px,rgba(0,0,0,.22) 1px,rgba(0,0,0,.22) 3px,transparent 3px,transparent 5px),
        repeating-linear-gradient(to right,rgba(255,30,90,.022) 0,rgba(255,30,90,.022) 1px,rgba(0,235,255,.016) 1px,rgba(0,235,255,.016) 2px,transparent 2px,transparent 4px);
      mix-blend-mode:multiply;
    }
    #glass{
      z-index:4;
      background:
        linear-gradient(112deg,rgba(255,255,255,.05),transparent 17%,transparent 72%,rgba(255,255,255,.022)),
        radial-gradient(ellipse at center,transparent 49%,rgba(0,0,0,.56) 100%);
    }
    #bezel{
      z-index:5;
      box-shadow:inset 0 0 0 2px rgba(26,2,8,.88),inset 0 0 0 3px rgba(255,40,72,.14),inset 0 0 48px rgba(0,0,0,.72);
    }
    #help{
      position:absolute;left:50%;bottom:8px;transform:translateX(-50%);z-index:9;
      display:flex;gap:18px;align-items:center;white-space:nowrap;pointer-events:none;
      color:rgba(196,226,245,.62);font-size:clamp(8px,1vw,12px);letter-spacing:.08em;
      text-shadow:0 0 8px rgba(0,220,255,.3);
    }
    #help b{color:#fff;font-weight:700}
    #touchControls{display:none}
    .touchButton{
      appearance:none;border:1px solid rgba(255,48,89,.55);border-radius:16px;background:linear-gradient(180deg,rgba(27,8,33,.96),rgba(4,3,12,.98));
      color:#fff;font:800 16px/1 "Courier New",monospace;letter-spacing:.08em;min-height:68px;box-shadow:inset 0 0 20px rgba(255,28,116,.12),0 0 20px rgba(0,0,0,.45);touch-action:manipulation
    }
    .touchButton small{display:block;margin-top:8px;color:rgba(210,230,255,.62);font-size:10px}
    @media(max-width:600px){#help{gap:8px;bottom:5px;letter-spacing:.02em}#help span:last-child{display:none}}
    @media(orientation:portrait) and (pointer:coarse){
      body{display:flex;flex-direction:column;justify-content:center;gap:12px;padding:env(safe-area-inset-top) 10px env(safe-area-inset-bottom)}
      #shell{width:100%;max-width:100%;height:auto;aspect-ratio:16/9;border-radius:10px}
      #touchControls{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:680px}
      #help{display:none}
    }
    @media(orientation:landscape) and (pointer:coarse){#touchControls{display:none}#help{display:none}}

<body>
  <main id="shell" aria-label="Cave Racer arcade game">
    <canvas id="scene" width="480" height="270"></canvas>
    <div id="tiltShift"></div>
    <div id="crt"></div>
    <div id="glass"></div>
    <div id="bezel"></div>
    <canvas id="hud" width="960" height="540" aria-hidden="true"></canvas>
    <div id="help" aria-hidden="true">
      <span><b>Z / ↑</b> HOP</span>
      <span><b>X / SPACE</b> HYPERFLOW</span>
      <span><b>P</b> PAUSE</span>
      <span><b>R</b> RESTART</span>
    </div>
  </main>
  <section id="touchControls" aria-label="Touch controls">
    <button class="touchButton" id="hopButton" type="button">HOP<small>LEFT SIDE</small></button>
    <button class="touchButton" id="boostButton" type="button">BOOST<small>RIGHT SIDE</small></button>
  </section>

<script>
(() => {
  'use strict';

  const shell = document.getElementById('shell');
  const canvas = document.getElementById('scene');
  const hudCanvas = document.getElementById('hud');
  const ctx = canvas.getContext('2d', {alpha:false, desynchronized:true}) || canvas.getContext('2d', {alpha:false});
  const hud = hudCanvas.getContext('2d', {alpha:true, desynchronized:true}) || hudCanvas.getContext('2d', {alpha:true});

  const W=960,H=540,TAU=Math.PI*2;
  const IS_FIREFOX=/firefox/i.test(navigator.userAgent||'');
  if(IS_FIREFOX) document.body.classList.add('firefox');

  let renderScale=IS_FIREFOX?0.42:0.5;
  let quality=IS_FIREFOX?0.72:1;
  let frameEMA=16.7, qualityTimer=0, hudDpr=1;
  const BASE_SPEED=760,MAX_CRUISE=1120,BOOST_MULT=1.95;
  const BOOST_DRAIN=34,BOOST_RECHARGE=18,HOP_IMPULSE=-315,HOP_COOLDOWN=.12;
  const PLAYER_R=12,WAVE_DISTANCE=11800,SEG=12;
  const GRID_SPACING=24,GRID_COLS=Math.ceil(W/GRID_SPACING)+3,GRID_ROWS=Math.ceil(H/GRID_SPACING)+2,GRID_SPAN=GRID_COLS*GRID_SPACING;
  const MAX_SPAWNS={sparks:220,trail:110,rings:28};

  const PALETTES=[
    {wallA:'#ff1f78',wallB:'#ff5024',edge:'#ffd15c',grid:'#20eaff',hud:'#ff294b'},
    {wallA:'#dd20ff',wallB:'#ff205e',edge:'#ff91ee',grid:'#41a9ff',hud:'#ff345e'},
    {wallA:'#ff3e32',wallB:'#ff9a16',edge:'#fff06b',grid:'#32ffd2',hud:'#ff293f'},
    {wallA:'#7150ff',wallB:'#ff1cb1',edge:'#93fbff',grid:'#28cfff',hud:'#ff2c66'}
  ];

  const keys=Object.create(null),touches=new Map();
  const grid=[],sparks=[],rings=[];
  const trail=Array.from({length:MAX_SPAWNS.trail},()=>({worldX:0,y:H/2,vy:0,boost:0,valid:false}));
  let trailHead=0,trailCount=0,lastTrailWorldX=-1e9;
  let stars=[],lastTime=performance.now(),shake=0,hitFlash=0,boostFlash=0,pauseLatch=false;

  const state={
    phase:'start',paused:false,time:0,distance:0,score:0,highScore:loadHighScore(),wave:1,lives:3,
    speed:BASE_SPEED,targetSpeed:BASE_SPEED,playerX:W*.235,playerY:H*.5,playerVY:0,
    pitch:0,pitchVel:0,inputLift:0,boost:100,boosting:false,boostLock:0,invulnerable:0,
    nearMiss:0,combo:1,comboTimer:0,hopCooldown:0
  };

  function loadHighScore(){try{return Number(localStorage.getItem('caveRacerV3HighScore')||0)}catch(_){return 0}}
  function saveHighScore(v){try{localStorage.setItem('caveRacerV3HighScore',String(v))}catch(_){}}
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  const lerp=(a,b,t)=>a+(b-a)*t;
  function rgba(hex,a){const n=parseInt(hex.slice(1),16);return 'rgba(' + ((n>>16)&255) + ',' + ((n>>8)&255) + ',' + (n&255) + ',' + a + ')'}
  function palette(){return PALETTES[(state.wave-1)%PALETTES.length]}
  function round(v){return Math.round(v)}

  function configureCanvases(){
    canvas.width=Math.max(1,Math.round(W*renderScale));
    canvas.height=Math.max(1,Math.round(H*renderScale));
    ctx.setTransform(renderScale,0,0,renderScale,0,0);
    ctx.imageSmoothingEnabled=false;

    const rect=shell.getBoundingClientRect();
    hudDpr=clamp(window.devicePixelRatio||1,1,IS_FIREFOX?1.5:2);
    hudCanvas.width=Math.max(1,Math.round(rect.width*hudDpr));
    hudCanvas.height=Math.max(1,Math.round(rect.height*hudDpr));
    hud.setTransform(hudCanvas.width/W,0,0,hudCanvas.height/H,0,0);
    hud.imageSmoothingEnabled=true;
  }

  function tuneQuality(dt){
    frameEMA=frameEMA*.92+dt*1000*.08;
    qualityTimer+=dt;
    if(qualityTimer<1.0) return;
    qualityTimer=0;
    let next=renderScale;
    if(frameEMA>22.5) next=Math.max(IS_FIREFOX?0.34:0.38,renderScale-0.08);
    else if(frameEMA<16.5) next=Math.min(IS_FIREFOX?0.54:0.68,renderScale+0.04);
    quality=clamp((next-(IS_FIREFOX?0.34:0.38))/0.30,0.42,1);
    if(Math.abs(next-renderScale)>.01){renderScale=next;configureCanvases()}
  }

  function caveAt(screenX){
    const wx=state.distance+screenX;
    const difficulty=Math.min(67,state.distance/17000*38+(state.wave-1)*2.7);
    const center=H*.5
      +Math.sin(wx*.00185+.7)*(56+difficulty*.18)
      +Math.sin(wx*.0064+2.2)*23
      +Math.sin(wx*.00058+4.7)*24;
    const squeeze=Math.sin(wx*.00118-.8)*.5+.5;
    const pulse=Math.pow(squeeze,2.7)*(48+difficulty*.21);
    const half=clamp(176-difficulty-pulse+Math.sin(wx*.0041)*10,76,188);
    return{top:center-half,bottom:center+half,center:center,half:half};
  }

  function buildCave(){
    const samples=[];
    for(let x=-SEG*2;x<=W+SEG*2;x+=SEG){const c=caveAt(x);samples.push({x:x,top:c.top,bottom:c.bottom})}
    const top=new Path2D();top.moveTo(samples[0].x,0);for(let i=0;i<samples.length;i++)top.lineTo(samples[i].x,samples[i].top);top.lineTo(samples[samples.length-1].x,0);top.closePath();
    const bottom=new Path2D();bottom.moveTo(samples[0].x,H);for(let i=0;i<samples.length;i++)bottom.lineTo(samples[i].x,samples[i].bottom);bottom.lineTo(samples[samples.length-1].x,H);bottom.closePath();
    return{samples:samples,top:top,bottom:bottom};
  }

  function initGrid(){
    grid.length=0;
    for(let r=0;r<GRID_ROWS;r++)for(let c=0;c<GRID_COLS;c++){
      const ax=(c-1)*GRID_SPACING,ay=r*GRID_SPACING;
      grid.push({c:c,r:r,ax:ax,ay:ay,x:ax,y:ay,vx:0,vy:0,energy:0});
    }
  }
  function resetNode(p){p.x=p.ax;p.y=p.ay;p.vx=0;p.vy=0;p.energy=0}

  function resetTrail(){trailHead=0;trailCount=0;lastTrailWorldX=-1e9;recordTrail(true)}
  function recordTrail(force){
    const worldX=state.distance+state.playerX;
    if(!force&&worldX-lastTrailWorldX<8)return;
    const t=trail[trailHead];t.worldX=worldX;t.y=state.playerY;t.vy=state.playerVY;t.boost=state.boosting?1:0;t.valid=true;
    trailHead=(trailHead+1)%MAX_SPAWNS.trail;trailCount=Math.min(MAX_SPAWNS.trail,trailCount+1);lastTrailWorldX=worldX;
  }
  function trailPoint(indexFromOldest){
    const start=(trailHead-trailCount+MAX_SPAWNS.trail)%MAX_SPAWNS.trail;
    return trail[(start+indexFromOldest)%MAX_SPAWNS.trail];
  }
  function trailSample(worldX){
    if(trailCount<2)return null;
    const first=trailPoint(0),last=trailPoint(trailCount-1);
    if(worldX<first.worldX||worldX>last.worldX)return null;
    let lo=0,hi=trailCount-1;
    while(hi-lo>1){const m=(lo+hi)>>1;if(trailPoint(m).worldX<=worldX)lo=m;else hi=m}
    const a=trailPoint(lo),b=trailPoint(hi),span=Math.max(1,b.worldX-a.worldX),t=clamp((worldX-a.worldX)/span,0,1);
    return{y:lerp(a.y,b.y,t),vy:lerp(a.vy,b.vy,t),boost:lerp(a.boost,b.boost,t)};
  }

  function applyWake(dt){
    const wakeLength=state.boosting?610:420;
    const baseRadius=state.boosting?84:66,maxRadius=state.boosting?205:148;
    const baseForce=(state.boosting?330:175)*dt*(0.8+quality*0.4);
    const playerWorldX=state.distance+state.playerX;
    for(let i=0;i<grid.length;i++){
      const p=grid[i];
      const nodeWorldX=state.distance+p.ax;
      const dxTrail=playerWorldX-nodeWorldX;
      if(dxTrail>4&&dxTrail<wakeLength){
        const s=trailSample(nodeWorldX);
        if(s){
          const cone=lerp(baseRadius,maxRadius,Math.pow(dxTrail/wakeLength,.68));
          const dy=p.ay-s.y,ad=Math.abs(dy);
          if(ad<cone){
            const tail=Math.pow(1-dxTrail/wakeLength,.48),radial=Math.pow(1-ad/cone,1.08);
            const shell=Math.exp(-Math.pow((ad-cone*.55)/Math.max(10,cone*.22),2));
            const core=Math.exp(-Math.pow(ad/Math.max(10,cone*.24),2));
            const wave=Math.sin(dxTrail*.055-state.time*.011+s.vy*.006+p.r*.38);
            const f=baseForce*tail*(radial*.74+shell*.92+core*.34)*(1+s.boost*.42);
            const sign=dy===0?(p.r&1?1:-1):Math.sign(dy);
            p.vx-=f*(1.3+dxTrail/wakeLength*1.7);
            p.vy+=sign*f*(1.9+shell*.72)+wave*f*.40+s.vy*dt*tail*.33;
            p.energy=Math.min(2.0,p.energy+f*.06);
          }
        }
      }

      const localX=p.ax-state.playerX;
      const localY=p.ay-state.playerY;
      const ax=Math.abs(localX), ay=Math.abs(localY);
      const nx=state.boosting?185:145, ny=state.boosting?130:108;
      if(localX>-70&&localX<nx&&ay<ny){
        const rx=1-ax/nx, ry=1-ay/ny;
        const falloff=Math.max(0,rx)*Math.max(0,ry);
        if(falloff>0){
          const force=(state.boosting?210:135)*dt*falloff*falloff;
          const verticalSign=localY===0?(p.r&1?1:-1):Math.sign(localY);
          p.vx+=localX>0?force*1.8:-force*.55;
          p.vy+=verticalSign*force*(1.55+Math.abs(localY)/ny*1.1)+state.playerVY*dt*.14;
          p.energy=Math.min(2.1,p.energy+force*.16);
        }
      }
    }
  }

  function updateGrid(dt){
    const scroll=state.phase==='play'&&!state.paused?state.speed*dt:0;
    const spring=20,damp=Math.pow(.83,dt*60);
    for(let i=0;i<grid.length;i++){
      const p=grid[i];
      p.ax-=scroll;
      if(p.ax<-GRID_SPACING*1.5){p.ax+=GRID_SPAN;p.x+=GRID_SPAN;resetNode(p)}
      p.vx+=(p.ax-p.x)*spring*dt;
      p.vy+=(p.ay-p.y)*spring*dt;
      p.vx*=damp;p.vy*=damp;p.x+=p.vx*dt;p.y+=p.vy*dt;p.energy*=Math.pow(.90,dt*60);
      if(p.ax>state.playerX+8){
        const snap=1-Math.pow(.022,dt);
        p.x=lerp(p.x,p.ax,snap);p.y=lerp(p.y,p.ay,snap);p.vx*=.18;p.vy*=.18;p.energy*=.35;
      }
    }
    if(state.phase==='play'&&!state.paused)applyWake(dt);
  }

  const node=(c,r)=>grid[r*GRID_COLS+((c+GRID_COLS)%GRID_COLS)];
  function drawGrid(p){
    ctx.save();
    ctx.lineWidth=.65;
    ctx.strokeStyle=rgba(p.grid,IS_FIREFOX?.09:.12);
    ctx.beginPath();
    for(let r=0;r<GRID_ROWS;r++)for(let c=0;c<GRID_COLS-1;c++){
      const a=node(c,r),b=node(c+1,r);if(Math.abs(a.x-b.x)>GRID_SPACING*2.5)continue;ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y)
    }
    for(let c=0;c<GRID_COLS;c++)for(let r=0;r<GRID_ROWS-1;r++){
      const a=node(c,r),b=node(c,r+1);ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y)
    }
    ctx.stroke();

    const minorCutoff=quality<.58;
    for(let i=0;i<grid.length;i++){
      const q=grid[i];
      if(q.x<-20||q.x>W+20||q.y<-20||q.y>H+20)continue;
      const major=q.c%5===0&&q.r%5===0,mid=!major&&(q.c%2===0||q.r%2===0);
      if(minorCutoff&&!major&&!mid)continue;
      const base=major?2.2:mid?1.35:.78;
      const dx=q.x-q.ax,dy=q.y-q.ay,disp=Math.sqrt(dx*dx+dy*dy),e=clamp(disp/22+q.energy,0,1.45);
      const glow=(major||e>.18)&&quality>.62&&!IS_FIREFOX;
      ctx.globalAlpha=(major?.56:mid?.28:.12)+e*.56;
      ctx.fillStyle=p.grid;
      ctx.shadowColor=p.grid;
      ctx.shadowBlur=glow?(3+e*8):0;
      ctx.beginPath();ctx.arc(q.x,q.y,base*(1+e*1.15),0,TAU);ctx.fill();
    }
    ctx.restore();
  }

  function drawWallTexture(path,samples,isTop,p){
    ctx.save();ctx.clip(path);
    const g=ctx.createLinearGradient(0,isTop?0:H,0,H*.5);g.addColorStop(0,'#08010d');g.addColorStop(.28,p.wallB);g.addColorStop(.78,p.wallA);g.addColorStop(1,'#18051c');
    ctx.globalAlpha=.86;ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;
    const flow=state.distance*(state.boosting?2.05:1.25),bands=Math.max(7,Math.round((state.boosting?16:11)*(0.7+quality*0.45)));
    for(let b=0;b<bands;b++){
      const inset=7+b*9.2,phase=b*.81+flow*(.0056+b*.00012),hot=b%4===0;
      ctx.beginPath();
      for(let i=0;i<samples.length;i++){
        const s=samples[i],rip=Math.sin((s.x+flow*.58)*.027+phase)*(3.4+b*.1),y=isTop?s.top-inset-rip:s.bottom+inset+rip;
        if(i===0)ctx.moveTo(s.x,y);else ctx.lineTo(s.x,y);
      }
      ctx.strokeStyle=hot?p.edge:(b&1?p.wallA:p.wallB);
      ctx.globalAlpha=hot?.52:.22;
      ctx.lineWidth=hot?2.0:1.0;
      ctx.shadowColor=hot?p.edge:p.wallA;
      ctx.shadowBlur=(quality>.7&&!IS_FIREFOX)?(hot?8:2):0;
      ctx.stroke();
    }
    ctx.shadowBlur=0;ctx.globalAlpha=.16;ctx.strokeStyle=p.grid;ctx.lineWidth=.8;
    const cell=72,off=-((state.distance*.68)%cell);
    for(let x=off-cell;x<W+cell;x+=cell){
      const phase=(Math.floor(x/cell))*1.73,stateY=isTop?42+Math.sin(phase+state.time*.0004)*26:H-42-Math.sin(phase+state.time*.0004)*26;

  function spawnSpark(x,y,color,n,power){

  }
  function updateSparks(dt){for(let i=sparks.length-1;i>=0;i--){const s=sparks[i];s.x+=s.vx*dt;s.y+=s.vy*dt;s.vx*=Math.pow(.984,dt*60);s.vy*=Math.pow(.968,dt*60);s.life-=dt;if(s.life<=0)sparks.splice(i,1)}}
  function drawSparks(){ctx.save();ctx.lineCap='round';for(let i=0;i<sparks.length;i++){const s=sparks[i],a=clamp(s.life/s.max,0,1);ctx.globalAlpha=a;ctx.strokeStyle=s.color;ctx.shadowColor=s.color;ctx.shadowBlur=(quality>.62&&!IS_FIREFOX)?6:0;ctx.lineWidth=s.size;ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.lineTo(s.x-s.vx*.045,s.y-s.vy*.045);ctx.stroke()}ctx.restore()}

  function spawnRing(x,y,color,power){

  function updateRings(dt){for(let i=rings.length-1;i>=0;i--){const r=rings[i];r.r+=(180+r.power*170)*dt;r.life-=dt*(1.4+r.power*.25);r.x-=state.speed*dt*.16;if(r.life<=0||r.r>r.max)rings.splice(i,1)}}

  function drawRibbon(p){
    if(trailCount<3)return;
    const points=[];
    for(let i=0;i<trailCount;i++){
      const t=trailPoint(i),x=t.worldX-state.distance;
      if(x<-160||x>state.playerX+8)continue;
      points.push({x:x,y:t.y,b:t.boost});
    }
    if(points.length<3)return;
    const drawPass=(width,alpha,color,blur)=>{
      ctx.save();ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle=color;ctx.globalAlpha=alpha;ctx.lineWidth=width;ctx.shadowColor=color;ctx.shadowBlur=(quality>.66&&!IS_FIREFOX)?blur:0;ctx.beginPath();ctx.moveTo(points[0].x,points[0].y);

      const z=points[points.length-1];ctx.lineTo(z.x,z.y);ctx.stroke();ctx.restore();
    };
    drawPass(state.boosting?22:12,state.boosting?.12:.07,p.wallA,18);
    drawPass(state.boosting?8:4.6,state.boosting?.38:.24,p.grid,12);
    drawPass(state.boosting?2.0:1.1,state.boosting?.82:.5,'#fff',4);
  }

  function playerPath(){const q=new Path2D();q.moveTo(-7,-7);q.quadraticCurveTo(3,-9,14,-4);q.lineTo(28,-1.5);q.quadraticCurveTo(34,0,28,2.5);q.lineTo(13,4);q.quadraticCurveTo(5,9,-5,7);q.closePath();q.moveTo(-3,4);q.lineTo(-19,11);q.lineTo(-7,1);q.closePath();q.moveTo(-7,1);q.lineTo(-22,4);q.lineTo(-9,-3);q.closePath();return q}
  function drawCape(t,p,a,scale){

    const body=playerPath();ctx.globalAlpha=a;ctx.fillStyle='#02030a';ctx.strokeStyle=p.grid;ctx.lineWidth=1.6;ctx.shadowColor=p.grid;ctx.shadowBlur=(quality>.62&&!IS_FIREFOX)?(state.boosting?16:10):0;ctx.fill(body);ctx.stroke(body);

    ctx.globalAlpha=a*(state.boosting?.98:.58);ctx.fillStyle='#fff';ctx.shadowColor=p.grid;ctx.shadowBlur=(quality>.62&&!IS_FIREFOX)?(state.boosting?20:10):0;ctx.beginPath();ctx.arc(-2,0,state.boosting?3.4:2.2,0,TAU);ctx.fill();ctx.restore();

  function drawPlayer(p){

  function drawPortal(p){
    const cx=state.playerX+210,cy=H*.5+Math.sin(state.time*.0014)*14,rx=165,ry=110;
    const bg=ctx.createRadialGradient(cx,cy,12,cx,cy,250);
    bg.addColorStop(0,rgba('#53a6ff',0.34));bg.addColorStop(.36,rgba('#1cbcff',0.24));bg.addColorStop(.65,rgba(p.wallA,0.16));bg.addColorStop(1,'rgba(0,0,0,0)');

    for(let i=0;i<3;i++){
      const pr=1+i*.22,phase=state.time*.0038*(i+1),color=i===0?p.edge:i===1?p.wallA:p.grid;
      ctx.beginPath();
      for(let a=0;a<=TAU+.01;a+=TAU/90){
        const noise=1+Math.sin(a*7+phase)*.12+Math.cos(a*11-phase*.7)*.08;
        const x=Math.cos(a)*rx*pr*noise, y=Math.sin(a)*ry*pr*noise;

  function startGame(){
    Object.assign(state,{phase:'play',paused:false,time:0,distance:0,score:0,wave:1,lives:3,speed:BASE_SPEED,targetSpeed:BASE_SPEED,playerX:W*.235,playerY:H*.5,playerVY:0,pitch:0,pitchVel:0,inputLift:0,boost:100,boosting:false,boostLock:0,invulnerable:0,nearMiss:0,combo:1,comboTimer:0,hopCooldown:0});

  function hitWall(c){
    if(state.invulnerable>0)return;
    state.lives--;state.invulnerable=1.18;state.playerVY*=-.42;state.playerY=clamp(state.playerY,c.top+PLAYER_R+9,c.bottom-PLAYER_R-9);state.boost=Math.max(0,state.boost-25);state.boosting=false;state.boostLock=.52;state.combo=1;state.comboTimer=0;hitFlash=1;shake=Math.max(shake,19);spawnSpark(state.playerX,state.playerY,palette().edge,24,1.2);spawnRing(state.playerX,state.playerY,palette().hud,1.1);if(state.lives<=0)endGame();

  function update(dt){
    state.time+=dt*1000;updateStars(dt);updateSparks(dt);updateRings(dt);hitFlash=Math.max(0,hitFlash-dt*3.7);boostFlash=Math.max(0,boostFlash-dt*2.8);shake*=Math.pow(.06,dt);
    if(state.phase!=='play'||state.paused){updateGrid(dt);return}

    state.invulnerable=Math.max(0,state.invulnerable-dt);state.boostLock=Math.max(0,state.boostLock-dt);state.hopCooldown=Math.max(0,state.hopCooldown-dt);
    const wantsBoost=keys.Space||keys.KeyX||touchMode('boost');
    const canBoost=wantsBoost&&state.boost>.5&&state.boostLock<=0;
    if(canBoost&&!state.boosting){boostFlash=1;shake=Math.max(shake,8);spawnSpark(state.playerX-18,state.playerY,palette().grid,14,1.1);spawnRing(state.playerX-8,state.playerY,palette().grid,1.2)}
    state.boosting=!!canBoost;
    if(state.boosting){state.boost=Math.max(0,state.boost-BOOST_DRAIN*dt);if(state.boost<=.01){state.boosting=false;state.boostLock=.72}}else state.boost=Math.min(100,state.boost+BOOST_RECHARGE*dt);

    const cruise=Math.min(MAX_CRUISE,BASE_SPEED+state.distance*.00145);state.targetSpeed=cruise*(state.boosting?BOOST_MULT:1);state.speed=lerp(state.speed,state.targetSpeed,1-Math.pow(state.boosting?.00018:.012,dt));
    state.playerX=lerp(state.playerX,state.boosting?W*.35:W*.235,1-Math.pow(.008,dt));

    const gravity=720;
    state.playerVY+=gravity*dt;
    state.playerVY*=Math.pow(.90,dt*60);
    state.playerVY=clamp(state.playerVY,-430,610);
    state.playerY+=state.playerVY*dt;
    state.pitch=clamp(state.playerVY/780,-.18,.28);

    state.distance+=state.speed*dt;recordTrail(false);updateGrid(dt);state.wave=1+Math.floor(state.distance/WAVE_DISTANCE);state.score+=state.speed*dt*(state.boosting?.25:.115)*state.combo;
    const c=caveAt(state.playerX),ct=state.playerY-PLAYER_R-c.top,cb=c.bottom-(state.playerY+PLAYER_R),clearance=Math.min(ct,cb);
    if(clearance<0)hitWall(c);else if(clearance<25){state.nearMiss=Math.min(1,state.nearMiss+dt*5);state.comboTimer+=dt;if(state.comboTimer>.52){state.combo=Math.min(5,state.combo+.25);state.comboTimer=0}if(Math.random()<dt*18)spawnSpark(state.playerX+2,ct<cb?c.top:c.bottom,palette().edge,1,.7)}else{state.nearMiss=Math.max(0,state.nearMiss-dt*2.5);state.comboTimer=Math.max(0,state.comboTimer-dt);if(state.comboTimer<=0)state.combo=lerp(state.combo,1,1-Math.pow(.34,dt))}
    const rate=(state.boosting?68:24)*(0.65+quality*0.35);if(Math.random()<rate*dt)spawnSpark(state.playerX-16,state.playerY+(Math.random()-.5)*11,palette().grid,state.boosting?2:1,state.boosting?1.0:.52);

  }

  function cyberFrame(g,p){

    const p=palette(),c=buildCave(),sx=shake>.1?(Math.random()-.5)*shake:0,sy=shake>.1?(Math.random()-.5)*shake*.6:0;
    ctx.fillStyle='#020208';ctx.fillRect(0,0,W,H);
    ctx.save();ctx.translate(sx,sy);drawSpeedLines(p);drawGrid(p);drawPortal(p);drawRibbon(p);drawCave(c,p);drawRings();drawSparks();drawPlayer(p);
    if(state.nearMiss>.02){ctx.fillStyle=rgba(p.edge,state.nearMiss*.06);ctx.fillRect(0,0,W,H)}
    ctx.restore();
    if(boostFlash>0){const g=ctx.createRadialGradient(state.playerX,state.playerY,8,state.playerX,state.playerY,330);g.addColorStop(0,rgba(p.grid,boostFlash*.22));g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
    if(hitFlash>0){ctx.fillStyle='rgba(255,35,20,' + (hitFlash*.22) + ')';ctx.fillRect(0,0,W,H)}
    drawHud(p);drawOverlay(p);
  }

  function touchMode(m){for(const v of touches.values())if(v===m)return true;return false}
  function pointerMode(clientX){const r=shell.getBoundingClientRect(),x=(clientX-r.left)/r.width;return x<.5?'hop':'boost'}
  function hop(){begin();if(state.phase==='play'&&!state.paused&&state.hopCooldown<=0){state.playerVY=HOP_IMPULSE;state.hopCooldown=HOP_COOLDOWN;spawnRing(state.playerX-6,state.playerY,palette().grid,.25);spawnSpark(state.playerX-10,state.playerY+8,palette().grid,4,.42)}}
  function begin(){if(state.phase!=='play')startGame()}
  function togglePause(){if(state.phase!=='play')return;state.paused=!state.paused;lastTime=performance.now()}

  window.addEventListener('keydown',e=>{
    if(['ArrowUp','Space'].includes(e.code))e.preventDefault();
    if(e.code==='KeyR'){startGame();return}
    if((e.code==='KeyP'||e.code==='Escape')&&!pauseLatch){pauseLatch=true;togglePause();return}
    if(['ArrowUp','KeyW','KeyZ'].includes(e.code)&&!keys[e.code])hop();
    keys[e.code]=true;if(['KeyX','Space'].includes(e.code))begin();
  },{passive:false});
  window.addEventListener('keyup',e=>{keys[e.code]=false;if(e.code==='KeyP'||e.code==='Escape')pauseLatch=false});

  canvas.addEventListener('pointerdown',e=>{e.preventDefault();try{canvas.setPointerCapture(e.pointerId)}catch(_){}const mode=pointerMode(e.clientX);if(mode==='hop'){hop();touches.set(e.pointerId,'hop-used')}else{touches.set(e.pointerId,'boost');begin()}});
  canvas.addEventListener('pointermove',e=>{if(touches.get(e.pointerId)==='boost'&&pointerMode(e.clientX)!=='boost')touches.delete(e.pointerId)});
  const endPointer=e=>touches.delete(e.pointerId);canvas.addEventListener('pointerup',endPointer);canvas.addEventListener('pointercancel',endPointer);canvas.addEventListener('contextmenu',e=>e.preventDefault());

  const hopButton=document.getElementById('hopButton'),boostButton=document.getElementById('boostButton');
  hopButton.addEventListener('pointerdown',e=>{e.preventDefault();hop()});
  boostButton.addEventListener('pointerdown',e=>{e.preventDefault();touches.set('boostButton','boost');begin()});
  const releaseBoost=()=>touches.delete('boostButton');boostButton.addEventListener('pointerup',releaseBoost);boostButton.addEventListener('pointercancel',releaseBoost);boostButton.addEventListener('pointerleave',releaseBoost);

  document.addEventListener('visibilitychange',()=>{lastTime=performance.now();for(const k of Object.keys(keys))keys[k]=false;touches.clear();if(document.hidden&&state.phase==='play')state.paused=true});
  window.addEventListener('resize',configureCanvases,{passive:true});
  if('ResizeObserver' in window){new ResizeObserver(configureCanvases).observe(shell)}

  function frame(now){const dt=Math.min(.033,Math.max(0,(now-lastTime)/1000));lastTime=now;tuneQuality(dt);update(dt);drawScene();requestAnimationFrame(frame)}
  if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches){renderScale=IS_FIREFOX?0.36:0.42;quality=.55}

  configureCanvases();initGrid();initStars();resetTrail();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
