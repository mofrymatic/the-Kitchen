'use strict';

const VERSION='fts-arcade-ring-0.3.1';
const TAU=Math.PI*2, DEG=Math.PI/180;
// Dimensional contract: 1 engine unit = 1 inch.
const RING={outer:430,inner:118,sides:32,ceil:132};
const PLAYER_R=11,PLAYER_H=74,EYE=69,SPEED_WALK=84,SPEED_RUN=387.2,ACCEL=10; // 22 mph sprint

const AISLE={secondary:47.25,primary:70.87,merge:141.73}; // 1.2m / 1.8m / 3.6m references, inches
const FOV=76*Math.PI/180,NEAR=.6,SHADES=11,TILE_H=256,LOOK_UP=180,LOOK_DOWN=320;
const PORTALS={
 lobby:'https://frymatic.us/',
 theaters:'https://discord.gg/F2U6GT8g0',
 redeye:'https://frymatic.us/FTSArcade/REDEYE/',

 adDeal:'https://frymatic.us/FTSArcade/advertise/'
};

const ASSET_FILES={
 world:'fts-arcade-world-atlas.png',
 skin:'fts-arcade-cabinet-skins.png',
 screen:'fts-arcade-screen-atlas.png',
 fixture:'fts-arcade-fixture-atlas.png'
};
const WORLD_RECTS={
 WALL_MARBLE:[16,16,64,64],WALL_BLACK_GOLD:[96,16,64,64],WALL_LIGHT:[176,16,64,64],WALL_RIB:[256,16,64,64],WALL_GOLD:[336,16,64,64],
 FLOOR_BLACK:[416,16,64,64],FLOOR_ALT:[496,16,64,64],FLOOR_RED:[576,16,64,64],OFFICE_WOOD:[656,16,64,64],OFFICE_DARK:[736,16,64,64],
 STAGE_RED:[816,16,64,64],BRASS_PANEL:[896,16,64,64],CEILING_DARK:[16,96,64,64],EXIT:[96,96,64,64],OFFICE:[176,96,64,64],
 STAGE:[256,96,64,64],DJ:[336,96,64,64],FTS:[416,96,64,64],NEON_PINK:[496,96,64,64],NEON_BLUE:[576,96,64,64],NEON_GOLD:[656,96,64,64]
};
const FIXTURE_RECTS={VEND_DRINK:[16,16,64,64],VEND_SNACK:[96,16,64,64],JUKEBOX:[176,16,64,64],WHITEBOARD:[256,16,64,64],BULLETIN:[336,16,64,64],TOKEN:[416,16,64,64],POSTER_1:[496,16,64,64],POSTER_2:[576,16,64,64],POSTER_3:[656,16,64,64],AD_SPACE:[736,16,64,64],AD_DEAL:[816,16,64,64],WAYFIND:[896,16,64,64],OFFICE_DOOR:[16,96,64,64],STAGE_SIGN:[96,96,64,64],DJ_SIGN:[176,96,64,64],POSTER_4:[256,96,64,64]};
const SKIN_TILE=128,SKIN_COLS=16;
const SKIN_PARTS=['MARQUEE','LEFT','RIGHT','CONTROL','FRONT'];
function skinRect(letter,part){
 const li=letter.charCodeAt(0)-65,pi=SKIN_PARTS.indexOf(part),idx=li*5+pi;
 return[(idx%SKIN_COLS)*SKIN_TILE,Math.floor(idx/SKIN_COLS)*SKIN_TILE,SKIN_TILE,SKIN_TILE];
}
function screenRect(n){const i=Math.max(0,Math.min(24,n-1));return[(i%5)*128,Math.floor(i/5)*128,128,128];}
const BLACK_RECT=[(130%SKIN_COLS)*SKIN_TILE,Math.floor(130/SKIN_COLS)*SKIN_TILE,SKIN_TILE,SKIN_TILE];

const MATERIALS=[];
const MAT={};
function mat(name,sheet,rect,opts){MAT[name]=MATERIALS.length;MATERIALS.push(Object.assign({name,sheet,rect,stretch:false},opts||{}));return MAT[name];}
Object.keys(WORLD_RECTS).forEach(k=>mat(k,'world',WORLD_RECTS[k]));
Object.keys(FIXTURE_RECTS).forEach(k=>mat('FIX_'+k,'fixture',FIXTURE_RECTS[k]));
for(let cc=65;cc<=90;cc++){
 const L=String.fromCharCode(cc);
 for(const p of SKIN_PARTS)mat('SKIN_'+L+'_'+p,'skin',skinRect(L,p),{stretch:true});
}
mat('CAB_BLACK','skin',BLACK_RECT,{stretch:true});
for(let i=1;i<=25;i++)mat('SCREEN_'+String(i).padStart(2,'0'),'screen',screenRect(i),{stretch:true});

const Geom={
 view(px,py,ca,sa,x,y){const dx=x-px,dy=y-py;return{tx:dx*sa-dy*ca,tz:dx*ca+dy*sa};},
 clipNear(a,b,near){const A={tx:a.tx,tz:a.tz,t:0},B={tx:b.tx,tz:b.tz,t:1};if(A.tz<near&&B.tz<near)return null;if(A.tz<near){const f=(near-A.tz)/(B.tz-A.tz);A.tx+=(B.tx-A.tx)*f;A.tz=near;A.t=f;}else if(B.tz<near){const f=(near-B.tz)/(A.tz-B.tz);B.tx+=(A.tx-B.tx)*f;B.tz=near;B.t=1-f;}return[A,B];},
 projX(tx,tz,hw,pd){return hw+(tx/tz)*pd;},
 projY(h,pz,tz,hor,pd){return hor-((h-pz)*pd)/tz;},
 projDist(w,fov){return(w/2)/Math.tan(fov/2);},
 planePatternTransform(px,py,ca,sa,hw,pd,row,depth){const k=depth/pd;if(!Number.isFinite(k)||Math.abs(k)<1e-8)return null;const as=sa*k,cs=ca*k,bs=-ca*k,ds=sa*k,cy=row+.5,wx=px+ca*depth,wy=py+sa*depth,es=wx-as*hw-cs*cy,fs=wy-bs*hw-ds*cy,det=as*ds-bs*cs;if(!Number.isFinite(det)||Math.abs(det)<1e-10)return null;const a=ds/det,b=-bs/det,c=-cs/det,d=as/det;return{a,b,c,d,e:-(a*es+c*fs),f:-(b*es+d*fs)};},
 frontNormal(x1,y1,x2,y2){const dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy)||1;return{nx:dy/L,ny:-dx/L};},
 closestOnSeg(px,py,x1,y1,x2,y2){const dx=x2-x1,dy=y2-y1,l2=dx*dx+dy*dy;let t=l2===0?0:((px-x1)*dx+(py-y1)*dy)/l2;t=Math.max(0,Math.min(1,t));const x=x1+t*dx,y=y1+t*dy;return{x,y,t,d2:(px-x)*(px-x)+(py-y)*(py-y)};},
 pointInPoly(x,y,p){let inside=false;for(let i=0,j=p.length-1;i<p.length;j=i++){const xi=p[i][0],yi=p[i][1],xj=p[j][0],yj=p[j][1];const hit=((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi+1e-12)+xi);if(hit)inside=!inside;}return inside;},
 area(p){let a=0;for(let i=0;i<p.length;i++){const q=p[(i+1)%p.length];a+=p[i][0]*q[1]-q[0]*p[i][1];}return a/2;},
 makeCW(p){return this.area(p)>0?p.slice().reverse():p.slice();},
 polar(r,a){return[Math.cos(a)*r,Math.sin(a)*r];}
};

const MapBuilder={
 build(defs){
  const verts=[],vmap=new Map(),lines=[],emap=new Map();
  const V=(x,y)=>{const qx=Math.round(x*1000)/1000,qy=Math.round(y*1000)/1000,k=qx+','+qy;if(vmap.has(k))return vmap.get(k);const i=verts.length;verts.push({x:qx,y:qy});vmap.set(k,i);return i;};
  const sectors=defs.map((d,idx)=>{const poly=Geom.makeCW(d.poly);return{idx,id:d.id,poly,floor:d.floor||0,ceil:d.ceil||RING.ceil,light:d.light||.95,ftex:d.ftex,ctex:d.ctex,wtex:d.wtex,lines:[]};});
  const key=(a,b)=>a<b?a+':'+b:b+':'+a;
  sectors.forEach(s=>{
   for(let i=0;i<s.poly.length;i++){
    const a=s.poly[i],b=s.poly[(i+1)%s.poly.length],v1=V(a[0],a[1]),v2=V(b[0],b[1]),k=key(v1,v2);
    if(emap.has(k)){
     const li=emap.get(k),ln=lines[li];
     if(ln.back>=0)throw new Error('non-manifold edge '+k);
     ln.back=s.idx;s.lines.push(li);
    }else{
     const li=lines.length;lines.push({idx:li,v1,v2,front:s.idx,back:-1,upper:s.wtex,lower:s.wtex,mid:s.wtex,midTex:-1,midBot:0,midTop:0,blocking:false,tag:''});
     emap.set(k,li);s.lines.push(li);
    }
   }
  });
  return{verts,sectors,lines,solids:[],cabinets:[],exits:[],fixtures:[],ads:[],targets:[],spawn:{x:0,y:-300,ang:Math.PI/2}};
 },
 validate(map){const errs=[];for(const s of map.sectors){if(s.poly.length<3)errs.push(s.id+': too few vertices');if(Geom.area(s.poly)>=0)errs.push(s.id+': not clockwise');let sign=0;for(let i=0;i<s.poly.length;i++){const a=s.poly[i],b=s.poly[(i+1)%s.poly.length],c=s.poly[(i+2)%s.poly.length],z=(b[0]-a[0])*(c[1]-b[1])-(b[1]-a[1])*(c[0]-b[0]);if(Math.abs(z)<1e-6)continue;const q=Math.sign(z);if(sign&&q!==sign)errs.push(s.id+': non-convex');sign=q;}if(s.ceil-s.floor<PLAYER_H)errs.push(s.id+': headroom');}
  for(const ln of map.lines){const a=map.verts[ln.v1],b=map.verts[ln.v2],n=Geom.frontNormal(a.x,a.y,b.x,b.y),mx=(a.x+b.x)/2+n.nx*.5,my=(a.y+b.y)/2+n.ny*.5;if(!Geom.pointInPoly(mx,my,map.sectors[ln.front].poly))errs.push('line '+ln.idx+': front winding');}
  return errs;
 }
};

function innerSquarePoint(a){
 const c=Math.cos(a),s=Math.sin(a),k=RING.inner/Math.max(Math.abs(c),Math.abs(s));
 return[c*k,s*k];
}
function ringDefs(){
 const defs=[];
 for(let i=0;i<RING.sides;i++){
  const a0=i*TAU/RING.sides,a1=(i+1)*TAU/RING.sides;
  defs.push({id:'RING_'+String(i+1).padStart(2,'0'),poly:[Geom.polar(RING.outer,a0),Geom.polar(RING.outer,a1),innerSquarePoint(a1),innerSquarePoint(a0)],floor:0,ceil:RING.ceil,light:.90+.05*((i%4)/3),ftex:i%2?MAT.FLOOR_BLACK:MAT.FLOOR_ALT,ctex:MAT.CEILING_DARK,wtex:MAT.WALL_BLACK_GOLD});
 }
 return defs;
}
