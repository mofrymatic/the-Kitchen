4],[-0.1051,-0.5608],[-0.1067,-0.5735],[-0.1135,-0.5911],[-0.0811,-0.6065],[-0.0655,-0.6160],[-0.0467,-0.6325],[-0.0334,-0.6497],[-0.0344,-0.6517],[-0.0617,-0.6444],[-0.0706,-0.6439],[-0.0601,-0.7082],[-0.0322,-0.8510],[-0.0068,-0.9709],[-0.0007,-0.9958],[0.0016,-1.0000],[0.0324,-0.8503],[0.0722,-0.6423],[0.0378,-0.6513],[0.0355,-0.6511],[0.0357,-0.6487],[0.0474,-0.6329],[0.0675,-0.6149],[0.0856,-0.6041],[0.1137,-0.5904],[0.1076,-0.5752],[0.1055,-0.5629],[0.1072,-0.5500],[0.1149,-0.5325],[0.1250,-0.5181],[0.1388,-0.5037],[0.1567,-0.4887],[0.1878,-0.4666],[-0.0312,-0.4642],[-0.1639,-0.4639],[-0.1879,-0.4650]],h:[]}];

  // ===========================================================================
  // Glow sprite helper
  // ===========================================================================
  function makeGlowTexture(inner, middle, outer) {
    const size = 512;
    const c = document.createElement("canvas");
    c.width = c.height = size;
    const ctx = c.getContext("2d");
    const g = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
    g.addColorStop(0.00, inner);
    g.addColorStop(0.22, middle);
    g.addColorStop(0.58, outer);
    g.addColorStop(1.00, "rgba(42, 6, 70, 0)");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, size, size);
    const tex = new THREE.CanvasTexture(c);
    tex.encoding = THREE.sRGBEncoding;
    return tex;
  }

  const aura = new THREE.Sprite(new THREE.SpriteMaterial({

  }));
  aura.scale.set(7.6, 7.6, 1);
  scene.add(aura);

  // ===========================================================================
  // FUSED HEXAGONAL CRYSTAL
  // 6 side quads + 6 upper pyramid faces + 6 lower pyramid faces, emitted as a
  // single non-indexed buffer so the surface is continuous (no seam meshes).
  // ===========================================================================
  function buildHexCrystal(radius, bandHalf, capHeight) {
    const ringTop = [];
    const ringBottom = [];
    for (let i = 0; i < 6; i++) {
      const a = i * Math.PI / 3;                       // vertex on +X
      const x = Math.cos(a) * radius;
      const z = Math.sin(a) * radius;
      ringTop.push(new THREE.Vector3(x,  bandHalf, z));
      ringBottom.push(new THREE.Vector3(x, -bandHalf, z));
    }
    const apexTop    = new THREE.Vector3(0,  bandHalf + capHeight, 0);
    const apexBottom = new THREE.Vector3(0, -bandHalf - capHeight, 0);

    const positions = [], zones = [], faceIds = [];
    function tri(a, b, c, zone, faceId) {
      [a, b, c].forEach(v => positions.push(v.x, v.y, v.z));
      zones.push(zone, zone, zone);
      faceIds.push(faceId, faceId, faceId);
    }

    let faceId = 0;
    for (let i = 0; i < 6; i++) {
      const n = (i + 1) % 6;
      // prism wall (two triangles, one facet)
      tri(ringBottom[i], ringTop[i], ringTop[n], 0, faceId);
      tri(ringBottom[i], ringTop[n], ringBottom[n], 0, faceId);
      faceId++;
      // upper pyramid facet
      tri(ringTop[i], apexTop, ringTop[n], 1, faceId++);
      // lower pyramid facet
      tri(ringBottom[i], ringBottom[n], apexBottom, -1, faceId++);
    }

    const g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
    g.setAttribute("aZone",    new THREE.Float32BufferAttribute(zones, 1));
    g.setAttribute("aFaceId",  new THREE.Float32BufferAttribute(faceIds, 1));
    g.computeVertexNormals();
    g.computeBoundingSphere();
    return g;
  }

  const crystalGeometry = buildHexCrystal(R, BAND_H, CAP_H);

  // ===========================================================================
  // Shell material - opalescent amethyst / obsidian, now noticeably denser so
  // the sigil's white light is tinted by the purple and black whorls.
  // ===========================================================================
  function makeShellMaterial(side) {
    const m = new THREE.MeshPhysicalMaterial({
      color: 0xffffff,
      roughness: 0.10,
      metalness: 0.0,
      transmission: 0.42,      // was 0.74 - denser stone, stronger tint
      thickness: 2.6,
      ior: 1.62,
      clearcoat: 1.0,
      clearcoatRoughness: 0.06,
      transparent: true,
      opacity: 0.995,
      side: side,
      depthWrite: false,
      emissive: 0x190727,
      emissiveIntensity: 0.30
    });

    m.onBeforeCompile = shader => {
      shader.uniforms.uTime = { value: 0 };
      shader.uniforms.uGlow = { value: 1 };

      shader.vertexShader = `
        attribute float aZone;
        attribute float aFaceId;
        varying float vZone;
        varying float vFaceId;
        varying vec3 vLocalPosition;
      ` + shader.vertexShader;

      shader.vertexShader = shader.vertexShader.replace(
        "#include <begin_vertex>",
        `
          #include <begin_vertex>
          vZone = aZone;
          vFaceId = aFaceId;
          vLocalPosition = position;
        `
      );

      shader.fragmentShader = `
        uniform float uTime;
        uniform float uGlow;
        varying float vZone;
        varying float vFaceId;
        varying vec3 vLocalPosition;

        float hash31(vec3 p) {
          p = fract(p * 0.1031);
          p += dot(p, p.yzx + 33.33);
          return fract((p.x + p.y) * p.z);
        }
        float noise3(vec3 p) {
          vec3 i = floor(p), f = fract(p);
          f = f * f * (3.0 - 2.0 * f);
          return mix(
            mix(mix(hash31(i+vec3(0,0,0)), hash31(i+vec3(1,0,0)), f.x),
                mix(hash31(i+vec3(0,1,0)), hash31(i+vec3(1,1,0)), f.x), f.y),
            mix(mix(hash31(i+vec3(0,0,1)), hash31(i+vec3(1,0,1)), f.x),
                mix(hash31(i+vec3(0,1,1)), hash31(i+vec3(1,1,1)), f.x), f.y),
            f.z);
        }
        float fbm(vec3 p) {
          float v = 0.0, a = 0.5;
          for (int i = 0; i < 4; i++) { v += noise3(p) * a; p *= 2.03; a *= 0.5; }
          return v;
        }
      ` + shader.fragmentShader;

      // ---- stone colour + whorl density -------------------------------------
      shader.fragmentShader = shader.fragmentShader.replace(
        "#include <color_fragment>",
        `
          #include <color_fragment>

          vec3 obsidian    = vec3(0.008, 0.005, 0.016);
          vec3 blackViolet = vec3(0.043, 0.010, 0.078);
          vec3 amethyst    = vec3(0.36,  0.062, 0.76);
          vec3 lavender    = vec3(0.72,  0.39,  1.0);

          float marble = fbm(vLocalPosition * 2.15 + vec3(vFaceId * 0.37));
          float vein = smoothstep(0.56, 0.76, abs(sin(
            vLocalPosition.y * 4.5 + vLocalPosition.x * 3.2 + marble * 7.0)));

          float heightBlend = smoothstep(-2.45, 2.4, vLocalPosition.y);
          float zoneBias = vZone > 0.5 ? 0.70
                         : (vZone < -0.5 ? 0.14 : 0.36 + marble * 0.30);

          float amethystMix = clamp(zoneBias + heightBlend * 0.17 + marble * 0.18, 0.0, 1.0);
          vec3 stone = mix(obsidian, amethyst, amethystMix);
          stone = mix(stone, blackViolet, smoothstep(0.28, 0.62, 1.0 - marble) * 0.52);
          stone = mix(stone, lavender, vein * 0.16);

          diffuseColor.rgb *= stone;

          // Dark whorls sit denser than the bright amethyst ones, so the light
          // leaving the core is filtered unevenly - purple and black marbling.
          float whorlDensity = 1.0 - amethystMix;
          diffuseColor.a = clamp(diffuseColor.a * (0.80 + whorlDensity * 0.28), 0.0, 1.0);
        `
      );

      // ---- opalescent fresnel fire ------------------------------------------
      shader.fragmentShader = shader.fragmentShader.replace(
        "#include <emissivemap_fragment>",
        `
          #include <emissivemap_fragment>

          vec3 V = normalize(vViewPosition);
          vec3 N = normalize(normal);
          float fresnel = pow(1.0 - abs(dot(N, V)), 2.25);

          float phase = fresnel * 8.0 + vLocalPosition.y * 0.72
                      + vFaceId * 0.43 + uTime * 0.42;

          vec3 opal = 0.5 + 0.5 * cos(phase + vec3(0.0, 2.094, 4.188));
          opal = mix(opal, vec3(0.78, 0.45, 1.0), 0.44);

          float internal = pow(max(0.0, 1.0 - length(vLocalPosition.xz) * 0.53), 2.0);
          internal *= 0.32 + 0.68 * smoothstep(-2.3, 0.75, vLocalPosition.y);

          totalEmissiveRadiance += opal * fresnel * 0.38;
          totalEmissiveRadiance += vec3(0.42, 0.11, 0.80) * internal * 0.22 * uGlow;
        `
      );

      m.userData.shader = shader;
    };
    return m;
  }

  // Back faces first, then the sigil, then front faces: correct layering for a
  // transparent enclosure around a solid core.
  const shellBackMaterial  = makeShellMaterial(THREE.BackSide);
  const shellFrontMaterial = makeShellMaterial(THREE.FrontSide);

  const shellBack = new THREE.Mesh(crystalGeometry, shellBackMaterial);
  shellBack.renderOrder = 0;
  world.add(shellBack);

  const shellFront = new THREE.Mesh(crystalGeometry, shellFrontMaterial);
  shellFront.renderOrder = 20;
  world.add(shellFront);

  // ===========================================================================
  // SIGIL - extruded, chamfered, and capped on both ends (solid, not hollow)
  // ===========================================================================
  function buildSigilShapes(data) {
    return data.map(entry => {
      let outer = entry.o.map(p => new THREE.Vector2(p[0], p[1]));
      if (THREE.ShapeUtils.isClockWise(outer)) outer = outer.reverse();
      const shape = new THREE.Shape(outer);
      entry.h.forEach(ring => {
        let hole = ring.map(p => new THREE.Vector2(p[0], p[1]));
        if (!THREE.ShapeUtils.isClockWise(hole)) hole = hole.reverse();
        shape.holes.push(new THREE.Path(hole));
      });
      return shape;
    });
  }

  const sigilGeometry = new THREE.ExtrudeGeometry(buildSigilShapes(SIGIL), {
    depth: 0.22,
    steps: 1,
    bevelEnabled: true,      // bevel on => ExtrudeGeometry emits both end caps
    bevelThickness: 0.040,
    bevelSize: 0.030,
    bevelOffset: 0,
    bevelSegments: 4,
    curveSegments: 1
  });
  sigilGeometry.center();
  sigilGeometry.computeBoundingBox();

  // ---------------------------------------------------------------------------
  // Exact inscription solve.
  //
  // The crystal is the intersection of 18 half-spaces (6 prism walls, 6 upper
  // pyramid facets, 6 lower pyramid facets), each of the form  L(p) <= c  with
  // c > 0, so the solid is convex and contains the origin.  For a vertex p the
  // largest admissible uniform scale is  min over planes of  c / L(p)  where
  // L(p) > 0.  Taking the min across every vertex gives the exact largest scale
  // at which the whole sigil is strictly inside the stone - no guesswork.
  // ---------------------------------------------------------------------------
  function maxInscribedScale(geometry, radius, bandHalf, capHeight, offsetY) {
    const apothem = radius * Math.cos(Math.PI / 6);
    const normals = [];
    for (let k = 0; k < 6; k++) {
      const a = Math.PI / 6 + k * Math.PI / 3;   // face normals sit between vertices
      normals.push([Math.cos(a), Math.sin(a)]);
    }
    const pos = geometry.attributes.position;
    const slope = capHeight / apothem;
    const capLimit = bandHalf + capHeight;
    let s = Infinity;

    for (let i = 0; i < pos.count; i++) {
      const x = pos.getX(i);
      const y = pos.getY(i) + offsetY;
      const z = pos.getZ(i);
      for (let k = 0; k < 6; k++) {
        const d = x * normals[k][0] + z * normals[k][1];
        if (d > 1e-12) s = Math.min(s, apothem / d);          // prism wall
        let L = slope * d + y;
        if (L > 1e-12) s = Math.min(s, capLimit / L);          // upper pyramid
        L = slope * d - y;
        if (L > 1e-12) s = Math.min(s, capLimit / L);          // lower pyramid
      }
    }
    return s;
  }

  // The sigil's widest points are the two ear tips, which sit above centre.
  // Dropping it slightly lets them clear the waist instead of the taper.
  const SIGIL_OFFSET_Y = -0.22;
  const maxScale = maxInscribedScale(sigilGeometry, R, BAND_H, CAP_H, SIGIL_OFFSET_Y);
  const sigilScale = maxScale * FILL;

  // ===========================================================================
  // Sigil materials
  //   caps  -> white arcade core, hot centre with a saturated violet halo
  //   bevel -> moissanite-grade gem response with dispersion fire
  // Moissanite: n = 2.65, dispersion 0.104.  three.js r128 clamps the material
  // `ior` property at 2.3333, so the true n = 2.65 response (F0 = 0.204) and the
  // per-channel dispersion are driven from the shader instead.
  // ===========================================================================
  const MOISSANITE_N  = 2.65;
  const MOISSANITE_F0 = Math.pow((MOISSANITE_N - 1) / (MOISSANITE_N + 1), 2); // 0.2044

  function addGemShader(material, opts) {
    material.onBeforeCompile = shader => {
      shader.uniforms.uTime = { value: 0 };
      shader.uniforms.uF0 = { value: MOISSANITE_F0 };
      shader.uniforms.uCore = { value: opts.core };
      shader.uniforms.uFire = { value: opts.fire };

      shader.vertexShader = "varying vec3 vLocal;\n" + shader.vertexShader;
      shader.vertexShader = shader.vertexShader.replace(
        "#include <begin_vertex>",
        "#include <begin_vertex>\n  vLocal = position;"
      );

      shader.fragmentShader = `
        uniform float uTime;
        uniform float uF0;
        uniform float uCore;
        uniform float uFire;
        varying vec3 vLocal;
      ` + shader.fragmentShader;

      shader.fragmentShader = shader.fragmentShader.replace(
        "#include <emissivemap_fragment>",
        `
        #include <emissivemap_fragment>

        vec3 V = normalize(vViewPosition);
        vec3 N = normalize(normal);
        float cosT = clamp(abs(dot(N, V)), 0.0, 1.0);

        // Schlick with F0 taken from n = 2.65 rather than the clamped property.
        float schlick = pow(1.0 - cosT, 5.0);
        float F = uF0 + (1.0 - uF0) * schlick;

        // Dispersion 0.104: red and blue reflect at slightly different angles,
        // which is what throws moissanite's rainbow fire off a chamfer.
        float disp = 0.104 * uFire;
        vec3 Frgb = vec3(
          uF0 * (1.0 - disp) + (1.0 - uF0) * pow(1.0 - cosT * (1.0 + disp * 0.5), 5.0),
          F,
          uF0 * (1.0 + disp) + (1.0 - uF0) * pow(1.0 - cosT * (1.0 - disp * 0.5), 5.0)
        );
        Frgb = clamp(Frgb, 0.0, 1.6);

        vec3 spectral = 0.5 + 0.5 * cos(
          uTime * 0.55 + vLocal.y * 3.4 + cosT * 5.0 + vec3(0.0, 2.094, 4.188));
        spectral = mix(vec3(1.0), spectral, 0.55 * uFire);

        // Arcade core: a flat white bed of light with a violet bloom riding the
        // silhouette, the way a neon marquee reads against a dark cabinet.
        float rim = pow(1.0 - cosT, 2.0);
        totalEmissiveRadiance += vec3(1.0, 0.97, 1.0) * uCore;
        totalEmissiveRadiance += vec3(0.86, 0.52, 1.0) * rim * uCore * 0.55;
        totalEmissiveRadiance += spectral * Frgb * uFire * 0.85;
        `
      );
      material.userData.shader = shader;
    };
  }

  // Front + back caps
  const sigilCapMaterial = new THREE.MeshPhysicalMaterial({
    color: 0xf7ecff,
    emissive: 0xffffff,
    emissiveIntensity: 0.55,
    roughness: 0.14,
    metalness: 0.0,
    clearcoat: 1.0,
    clearcoatRoughness: 0.05,
    transparent: false,       // solid: this is what removes the hollow read
    opacity: 1.0,
    side: THREE.FrontSide
  });
  sigilCapMaterial.ior = MOISSANITE_N;   // saturates r128's clamp at 2.3333
  addGemShader(sigilCapMaterial, { core: 0.90, fire: 0.35 });

  // Extruded walls + chamfer
  const sigilBevelMaterial = new THREE.MeshPhysicalMaterial({
    color: 0xe6d2ff,
    emissive: 0xb98cff,
    emissiveIntensity: 0.30,
    roughness: 0.07,
    metalness: 0.0,
    clearcoat: 1.0,
    clearcoatRoughness: 0.03,
    transparent: false,
    opacity: 1.0,
    side: THREE.FrontSide
  });
  sigilBevelMaterial.ior = MOISSANITE_N;
  addGemShader(sigilBevelMaterial, { core: 0.30, fire: 1.0 });

  const sigilCore = new THREE.Group();
  sigilCore.position.y = SIGIL_OFFSET_Y * sigilScale;
  world.add(sigilCore);

  // ExtrudeGeometry group order is [caps, sides] repeated per shape, so
  // materialIndex 0 = caps and 1 = walls.
  const sigilMesh = new THREE.Mesh(sigilGeometry, [sigilCapMaterial, sigilBevelMaterial]);
  sigilMesh.scale.setScalar(sigilScale);
  sigilMesh.renderOrder = 10;
  sigilCore.add(sigilMesh);

  // Soft bloom shell, kept just inside the fit so it cannot break the stone.
  const sigilBloom = new THREE.Mesh(
    sigilGeometry,
    new THREE.MeshBasicMaterial({
      color: 0xf3e2ff,
      transparent: true,
      opacity: 0.10,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      side: THREE.BackSide
    })
  );
  sigilBloom.scale.setScalar(sigilScale * 1.035);
  sigilBloom.renderOrder = 9;
  sigilCore.add(sigilBloom);

  const sigilHalo = new THREE.Sprite(new THREE.SpriteMaterial({
    map: makeGlowTexture("rgba(255,252,255,0.95)", "rgba(206,140,255,0.34)", "rgba(120,40,190,0.10)"),
    blending: THREE.AdditiveBlending, depthWrite: false, transparent: true, opacity: 0.62
  }));
  sigilHalo.scale.set(2.5 * sigilScale, 2.9 * sigilScale, 1);
  sigilHalo.renderOrder = 8;
  sigilCore.add(sigilHalo);

  // ===========================================================================
  // Facet lines on the fused shell
  // ===========================================================================
  const edgeGeometry = new THREE.EdgesGeometry(crystalGeometry, 1);
  const edges = new THREE.LineSegments(edgeGeometry, new THREE.LineBasicMaterial({
    color: 0xe8ceff, transparent: true, opacity: 0.66, blending: THREE.AdditiveBlending
  }));
  edges.renderOrder = 21;
  world.add(edges);

  world.scale.setScalar(1.03);
  world.rotation.x = -0.05;
  world.rotation.y = 0.48;

  // ===========================================================================
  // Orbiting tetrahedra
  // ===========================================================================
  const orbitGroup = new THREE.Group();
  scene.add(orbitGroup);

  const orbitSpecs = [
    { radius: 2.75, tiltX: 1.05, tiltZ:  0.08, speed:  0.42, phase: 0.0, size: 0.14 },
    { radius: 3.05, tiltX: 1.08, tiltZ:  1.03, speed: -0.31, phase: 2.1, size: 0.11 },
    { radius: 2.55, tiltX: 1.10, tiltZ: -1.02, speed:  0.53, phase: 4.0, size: 0.09 }
  ];

  const orbiting = [];
  orbitSpecs.forEach(spec => {
    const pivot = new THREE.Group();
    pivot.rotation.x = spec.tiltX;
    pivot.rotation.z = spec.tiltZ;
    orbitGroup.add(pivot);

    const pts = [];
    for (let i = 0; i < 128; i++) {
      const a = i / 128 * Math.PI * 2;
      pts.push(new THREE.Vector3(Math.cos(a) * spec.radius, 0, Math.sin(a) * spec.radius));
    }
    pivot.add(new THREE.LineLoop(
      new THREE.BufferGeometry().setFromPoints(pts),
      new THREE.LineBasicMaterial({ color: 0x9d72d5, transparent: true, opacity: 0.17 })
    ));

    const tetra = new THREE.Mesh(
      new THREE.TetrahedronGeometry(spec.size, 0),
      new THREE.MeshStandardMaterial({
        color: 0xeedbff, emissive: 0x8d35d9, emissiveIntensity: 1.25,
        roughness: 0.2, metalness: 0.05
      })
    );
    pivot.add(tetra);
    orbiting.push(Object.assign({}, spec, { pivot, tetra }));
  });

  // ===========================================================================
  // Interaction
  // ===========================================================================
  let dragging = false, lastX = 0, lastY = 0;
  let angularX = 0, angularY = 0;
  let targetX = world.rotation.x, targetY = world.rotation.y;
  let pointerNX = 0, pointerNY = 0;

  canvas.addEventListener("pointerdown", e => {
    dragging = true;
    canvas.classList.add("dragging");
    lastX = e.clientX; lastY = e.clientY;
    angularX = angularY = 0;
    if (canvas.setPointerCapture) canvas.setPointerCapture(e.pointerId);
  });

  canvas.addEventListener("pointermove", e => {
    const rect = canvas.getBoundingClientRect();
    pointerNX = ((e.clientX - rect.left) / rect.width) * 2 - 1;
    pointerNY = ((e.clientY - rect.top) / rect.height) * 2 - 1;
    if (!dragging) return;
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    angularY = dx * 0.0075;
    angularX = dy * 0.0065;
    targetY += angularY;
    targetX = THREE.MathUtils.clamp(targetX + angularX, -0.68, 0.68);
  });

  function pointerUp() { dragging = false; canvas.classList.remove("dragging"); }
  window.addEventListener("pointerup", pointerUp);
  window.addEventListener("pointercancel", pointerUp);

  // ===========================================================================
  // Resize
  // ===========================================================================
  function resize() {
    const w = canvas.clientWidth || window.innerWidth;
    const h = canvas.clientHeight || window.innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    camera.position.z = w < h * 0.75 ? 10.1 : 8.6;
  }
  window.addEventListener("resize", resize, { passive: true });
  resize();

  // ===========================================================================
  // Animation
  // ===========================================================================
  const clock = new THREE.Clock();
  let elapsed = 0;

  function animate() {
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.05);
    elapsed += dt;

    if (!dragging && !reduceMotion) {
      targetY += dt * 0.085 + angularY;
      targetX = THREE.MathUtils.clamp(targetX + angularX, -0.68, 0.68);
      angularY *= 0.93;
      angularX *= 0.91;
    }

    const hoverX = (dragging || reduceMotion) ? 0 : -pointerNY * 0.10;
    const hoverY = (dragging || reduceMotion) ? 0 :  pointerNX * 0.13;
    world.rotation.x += ((targetX + hoverX) - world.rotation.x) * 0.09;
    world.rotation.y += ((targetY + hoverY) - world.rotation.y) * 0.09;

    aura.material.opacity = 0.60 + (reduceMotion ? 0 : Math.sin(elapsed * 0.95) * 0.06);
    sigilHalo.material.opacity = 0.56 + (reduceMotion ? 0 : Math.sin(elapsed * 1.9 + 0.3) * 0.07);

    // Breathing stays strictly inside the inscribed fit: peak is FILL * 1.012,
    // still below 1.0 of maxScale, so the sigil can never pierce the shell.
    const breathe = reduceMotion ? 1 : 1 + Math.sin(elapsed * 1.55) * 0.012;
    sigilMesh.scale.setScalar(sigilScale * breathe);
    sigilBloom.scale.setScalar(sigilScale * 1.035 * breathe);

    sigilCapMaterial.emissiveIntensity   = 0.55 + (reduceMotion ? 0 : Math.sin(elapsed * 1.65) * 0.10);
    sigilBevelMaterial.emissiveIntensity = 0.30 + (reduceMotion ? 0 : Math.sin(elapsed * 1.42 + 0.4) * 0.06);

    [sigilCapMaterial, sigilBevelMaterial].forEach(m => {
      if (m.userData.shader) m.userData.shader.uniforms.uTime.value = elapsed;
    });

    [shellBackMaterial, shellFrontMaterial].forEach(m => {
      m.emissiveIntensity = 0.30 + (reduceMotion ? 0 : Math.sin(elapsed * 1.3) * 0.05);
      if (m.userData.shader) {
        m.userData.shader.uniforms.uTime.value = elapsed;
        m.userData.shader.uniforms.uGlow.value =
          1.0 + (reduceMotion ? 0 : Math.sin(elapsed * 1.2) * 0.12);
      }
    });

    sigilLight.intensity = 15 + (reduceMotion ? 0 : Math.sin(elapsed * 1.8) * 1.8);

    orbiting.forEach(o => {
      const a = elapsed * o.speed + o.phase;
      o.tetra.position.set(Math.cos(a) * o.radius, 0, Math.sin(a) * o.radius);
      if (!reduceMotion) {
        o.tetra.rotation.x += dt * 1.2;
        o.tetra.rotation.y += dt * 0.9;
      }
    });

    renderer.render(scene, camera);
  }

  animate();
})();
</script>
</body>
</html>
