    ['name','Name',r.name], ['sub','Sub-header',r.sub], ['tagline','Tagline',r.tagline], ['description','Menu intro copy',r.description], ['social','Social handle',r.social], ['menuUrl','Menu URL',r.menuUrl], ['gameUrl','Game URL',r.gameUrl], ['gameLabel','Game QR label',r.gameLabel], ['shareUrl','Canonical / share URL',r.shareUrl], ['previewImage','Preview image URL',r.previewImage], ['shareDescription','Share description',r.shareDescription]
  ];
  return `<div class="cms-editor-area"> <div class="tab-section-title">Restaurant + Share Metadata</div> ${fields.map(([k,label,val])=>`<div class="field-group"><label class="field-label">${label}</label>${k === 'description' || k === 'shareDescription' ? `<textarea oninput="cUpdInfo('${k}',this.value)">${esc(val||'')}</textarea>` : `<input type="text" value="${esc(val||'')}" oninput="cUpdInfo('${k}',this.value)">`}</div>`).join('')}<div class="sec-settings"><div class="sec-settings-hd">Heat Levels</div>${D.heatLevels.map((h,i)=>`<div style="display:flex;gap:8px;margin-bottom:8px;"><input type="text" value="${esc(h.emoji)}" oninput="cUpdHeat(${i},'emoji',this.value)" style="width:64px"><input type="text" value="${esc(h.label)}" oninput="cUpdHeat(${i},'label',this.value)"></div>`).join('')}</div></div>`;
}
function renderCMSPreview(){ return `<div style="overflow-y:auto;height:100%;"><div class="preview-banner">👁 Live preview — unsaved changes included</div>${renderMenuHTML(D)}</div>`; }
function renderCMSTests(){
  const results = latestTestResults || runTestSuite(false);
  return `<div class="cms-editor-area"><div class="tab-section-title">Release Engineering Diagnostics</div><div class="sec-settings"><div class="sec-settings-hd">Persisted Test Suite v${TEST_SUITE_VERSION}</div><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span class="pill ${results.pass ? 'pass' : 'fail'}">${results.pass ? 'PASS' : 'FAIL'} · ${results.passed}/${results.total}</span><button class="btn-pri" onclick="runTestsAndRefresh()">Run Tests</button><button class="btn-sec" onclick="clearTestResults()">Clear stored result</button></div><div class="field-group" style="margin-top:16px"><label class="field-label">Last persisted payload</label><div class="json-box">${esc(JSON.stringify(results, null, 2))}</div></div></div></div>`;
}
function renderCMS(){
  const content = cmsTab === 'boards' ? renderCMSBoards() : cmsTab === 'info' ? renderCMSInfo() : cmsTab === 'preview' ? renderCMSPreview() : renderCMSTests();
  return `<div class="cms-view"><div class="cms-topbar"><span class="dev-badge">DEV</span><nav class="cms-nav">${[['boards','Boards'],['info','Restaurant Info'],['preview','Preview'],['tests','Tests']].map(([t,l])=>`<button class="cms-tab ${cmsTab===t?'active':''}" onclick="cSetTab('${t}')">${l}</button>`).join('')}</nav><div class="cms-topbar-right"><span class="save-status" id="save-status"></span><button class="btn-sec" onclick="setView('menu')">Menu</button><button class="btn-sec" onclick="setView('assets')">Assets</button><button class="btn-sec" onclick="cReset()">Reset</button><button class="btn-pri" onclick="cSave()">Save</button></div></div><div class="cms-content">${content}</div></div>`;
}
window.cSetTab = function(t){ cmsTab = t; renderApp('cms'); };
window.cSetSec = function(i){ cmsSec = i; renderApp('cms'); };
window.cSave = function(){ saveData(D); syncMetaTags(D); flashStatus('Saved ✓'); latestTestResults = runTestSuite(true); };
window.cReset = function(){ if(!confirm('Reset to release defaults?')) return; localStorage.removeItem(STORAGE_KEY); localStorage.removeItem(TEST_RESULTS_KEY); D = clone(DEFAULTS); syncMetaTags(D); latestTestResults = runTestSuite(true); renderApp(currentView()); };
window.cUpdSecTitle = v => { cSec().title = v; scheduleAutoSave(); };
window.cUpdSecEmoji = v => { cSec().emoji = v; scheduleAutoSave(); };
window.cUpdSecSub = v => { cSec().sub = v; scheduleAutoSave(); };
window.cUpdSecNote = v => { cSec().note = v; scheduleAutoSave(); };
window.cUpdSecArt = v => { cSec().art = v; scheduleAutoSave(); };
window.cUpdSecArtPosition = v => { cSec().artPosition = v; scheduleAutoSave(); };
window.cUpdFeatured = v => { cSec().featured = v; scheduleAutoSave(); };
window.cUpdItemName = (i,v)=>{ cSec().items[i].name = v; scheduleAutoSave(); };
window.cUpdItemPrice = (i,v)=>{ cSec().items[i].price = v; scheduleAutoSave(); };
window.cUpdItemSub = (i,v)=>{ cSec().items[i].sub = v; scheduleAutoSave(); };
window.cMvItem = (i,dir)=>{ const items = cSec().items, ni = i+dir; if(ni<0 || ni>=items.length) return; [items[i], items[ni]] = [items[ni], items[i]]; renderApp('cms'); scheduleAutoSave(); };
window.cRmItem = i => { if(cSec().items.length <= 1){ alert('Need at least one item.'); return; } if(!confirm('Remove item?')) return; cSec().items.splice(i,1); renderApp('cms'); scheduleAutoSave(); };
window.cAddItem = ()=>{ cSec().items.push({name:'New item', price:'', sub:''}); renderApp('cms'); scheduleAutoSave(); };
window.cAddBoard = ()=>{ D.boards.push({id:uid(), featured:false, emoji:'🍗', title:'NEW BOARD', sub:'', note:'', art:'assets/hecks-chicken/new-board.png', artPosition:'center center', items:[{name:'Item',price:'',sub:''}]}); cmsSec = D.boards.length-1; renderApp('cms'); scheduleAutoSave(); };
window.cRmBoard = ()=>{ if(D.boards.length <= 1){ alert('Need at least one board.'); return; } if(!confirm(`Delete board "${cSec().title}"?`)) return; D.boards.splice(cmsSec,1); cmsSec = Math.max(0, cmsSec-1); renderApp('cms'); scheduleAutoSave(); };
window.cUpdInfo = (k,v)=>{ D.restaurant[k] = v; syncMetaTags(D); scheduleAutoSave(); };
window.cUpdHeat = (i,k,v)=>{ D.heatLevels[i][k] = v; scheduleAutoSave(); };

function renderDevFAB(){
  if (!devMode()) return '';
  return `<div class="dev-fab"><div class="dev-panel ${devPanelOpen ? 'open' : ''}" id="dev-panel"><div class="dev-kicker">Backstage</div><button class="dev-btn" onclick="setView('menu'); closeDevPanel()">Public Menu</button><button class="dev-btn" onclick="setView('cms'); closeDevPanel()">CMS</button><button class="dev-btn" onclick="setView('assets'); closeDevPanel()">Asset Pack</button><button class="dev-btn" onclick="setView('tests'); closeDevPanel()">Tests</button></div><button class="dev-main-btn" onclick="toggleDevPanel()">⚙ DEV · ${esc(currentView().toUpperCase())}</button></div>`;
}
window.toggleDevPanel = function(){ devPanelOpen = !devPanelOpen; const panel = document.getElementById('dev-panel'); if(panel) panel.classList.toggle('open', devPanelOpen); };
window.closeDevPanel = function(){ devPanelOpen = false; const panel = document.getElementById('dev-panel'); if(panel) panel.classList.remove('open'); };
window.setView = setView;

function testResult(name, pass, detail){ return { name, pass: !!pass, detail: detail || '' }; }
function runTestSuite(persist = true){
  const params = new URLSearchParams('dev=1');
  const sampleBoard = DEFAULTS.boards[0];
  const sampleHTML = renderMenuHTML(DEFAULTS);
  const results = [
    testResult('brand-rename', DEFAULTS.restaurant.name === "HECK'S CHICKEN", DEFAULTS.restaurant.name),
    testResult('dev-secret-exact-match', params.get('dev') === DEV_SECRET_QUERY_VALUE, 'expected ?dev=1 exact gating'),
    testResult('share-metadata-fields', !!DEFAULTS.restaurant.shareUrl && !!DEFAULTS.restaurant.previewImage && !!DEFAULTS.restaurant.shareDescription, 'share URL, preview image, and description populated'),
    testResult('graphics-overlay-board-config', DEFAULTS.boards.every(b => typeof b.art === 'string' && b.art.length > 0), 'each board has a configurable art URL'),
    testResult('menu-render-count', (sampleHTML.match(/class="board-frame/g) || []).length === DEFAULTS.boards.length, `${DEFAULTS.boards.length} boards rendered`),
    testResult('asset-pack-count', TEMPLATES.length >= 6, `${TEMPLATES.length} templates`),
    testResult('test-suite-version-bumped', TEST_SUITE_VERSION >= 2, `v${TEST_SUITE_VERSION}`),
    testResult('storage-key-versioned', /_v2$/.test(STORAGE_KEY), STORAGE_KEY),
    testResult('board-item-shape', sampleBoard.items.every(i => 'name' in i && 'price' in i && 'sub' in i), 'overlay data shape stable')
  ];
  const passed = results.filter(r => r.pass).length;
  const payload = {
    suiteVersion: TEST_SUITE_VERSION,
    appVersion: APP_VERSION,
    channel: RELEASE_CHANNEL,
    timestamp: new Date().toISOString(),
    pass: passed === results.length,
    passed,
    total: results.length,
    results
  };
  if (persist) {
    try { localStorage.setItem(TEST_RESULTS_KEY, JSON.stringify(payload)); } catch {}
  }
  latestTestResults = payload;
  return payload;
}
function readTestResults(){ try { const raw = localStorage.getItem(TEST_RESULTS_KEY); return raw ? JSON.parse(raw) : null; } catch { return null; } }
window.runTestsAndRefresh = function(){ latestTestResults = runTestSuite(true); renderApp(currentView()); };
window.clearTestResults = function(){ localStorage.removeItem(TEST_RESULTS_KEY); latestTestResults = runTestSuite(true); renderApp(currentView()); };
function renderTestsPage(){
  const r = latestTestResults || runTestSuite(false);
  return `<div><div class="tests-topbar"><div><div class="tests-topbar-name">Release Engineering Factory</div><div class="tests-topbar-sub">Persisted test suite v${TEST_SUITE_VERSION} · ${esc(APP_VERSION)}</div></div><div class="tests-topbar-right">${devMode() ? `<button class="btn-sec" onclick="setView('menu')">Menu</button><button class="btn-sec" onclick="setView('cms')">CMS</button><button class="btn-sec" onclick="setView('assets')">Assets</button>` : ''}<button class="btn-sec" onclick="runTestsAndRefresh()">Run Again</button></div></div><div class="tests-wrap"><div class="tests-hero"><div class="tests-card"><div class="tests-kicker">Mission Status</div><div class="tests-title">Heck's Chicken release candidate</div><div class="tests-subcopy">This round includes the collaborator-safe rename, populated Open Graph / Twitter share metadata, board-graphic overlay support, exact <code>?dev=1</code> backstage gating, and an incremented persisted local test suite.</div></div><div class="diag-card"><div class="tests-kicker">Result</div><div class="stat-num">${r.passed}/${r.total}</div><div class="stat-label">tests passed</div><div style="margin-top:10px"><span class="pill ${r.pass ? 'pass' : 'fail'}">${r.pass ? 'Release-ready' : 'Needs attention'}</span></div></div></div><table class="test-table"><thead><tr><th>Test</th><th>Status</th><th>Detail</th></tr></thead><tbody>${r.results.map(t => `<tr><td>${esc(t.name)}</td><td><span class="pill ${t.pass ? 'pass' : 'fail'}">${t.pass ? 'PASS' : 'FAIL'}</span></td><td>${esc(t.detail)}</td></tr>`).join('')}</tbody></table><div style="height:18px"></div><div class="diag-card"><div class="tests-kicker">Persisted Payload</div><div class="json-box">${esc(JSON.stringify(r, null, 2))}</div></div></div></div>`;
}

function renderApp(view = currentView()){
  syncMetaTags(D);
  const app = document.getElementById('app');
  if (view === 'assets') app.innerHTML = renderAssets() + renderDevFAB();
  else if (view === 'cms' && devMode()) app.innerHTML = renderCMS();
  else if (view === 'tests' && devMode()) app.innerHTML = renderTestsPage();
  else app.innerHTML = renderMenuHTML(D) + renderDevFAB();
  if (view === 'menu' || view === 'cms') injectQRsIntoMenu();
}

async function init(){
  D = loadData();
  syncMetaTags(D);
  if (typeof QRCode !== 'undefined') {
    [menuQRDataUrl, gameQRDataUrl] = await Promise.all([
      makeQR(D.restaurant.menuUrl, 120, '#FFB800', '#080503'),
      makeQR(D.restaurant.gameUrl, 120, '#FFB800', '#080503')
    ]);
  }
  latestTestResults = readTestResults() || runTestSuite(true);
  renderApp(currentView());
}

init();
</script>
</body>
</html>
