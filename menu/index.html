  <style>
    :root {
      --bg:#080503;
      --panel:#120d08;
      --panel-2:#1a120a;
      --board:#171108;
      --line:#503213;
      --line-soft:rgba(255,184,0,0.12);
      --gold:#ffb800;
      --gold-hi:#ffd060;
      --cream:#fde0b2;
      --muted:#a88457;
      --muted-2:#7a5c39;
      --ember:#e85d0c;
      --blaze:#ff8c00;
      --smoke:#291c10;
      --ok:#78d287;
      --warn:#ffcf6b;
      --bad:#ff9c90;
      --shadow:0 14px 40px rgba(0,0,0,0.45);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{min-height:100vh;background:var(--bg);color:var(--cream);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
    body{overflow-x:hidden}
    button,input,textarea,select{font:inherit}
    a{color:#8fc9ff}
    .lights{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
    .light{position:absolute;border-radius:50%}
    .light-1{width:460px;height:600px;top:-260px;left:calc(16% - 230px);background:radial-gradient(ellipse at 50% 20%, rgba(255,180,0,.17), rgba(255,100,0,.05) 45%, transparent 72%)}
    .light-2{width:520px;height:640px;top:-300px;left:calc(50% - 260px);background:radial-gradient(ellipse at 50% 20%, rgba(255,180,0,.12), rgba(255,120,0,.04) 45%, transparent 70%)}
    .light-3{width:460px;height:600px;top:-260px;left:calc(84% - 230px);background:radial-gradient(ellipse at 50% 20%, rgba(255,180,0,.17), rgba(255,100,0,.05) 45%, transparent 72%)}
    .app-shell{position:relative;z-index:1;min-height:100vh}
    .brand-bar{display:flex;flex-direction:column;align-items:center;padding:36px 20px 26px;border-bottom:1px solid var(--line-soft);text-align:center}
    .brand-sub{font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
    .brand-name{font-size:clamp(42px,8vw,90px);font-weight:900;letter-spacing:.08em;text-transform:uppercase;line-height:.92}
    .brand-tagline{margin-top:12px;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
    .brand-caption{margin-top:8px;font-size:13px;color:#d6b98b;max-width:860px;line-height:1.45}
    .page{min-height:100vh;padding:0 20px 60px}
    .boards-wrap{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;max-width:1280px;margin:34px auto 0;width:100%}
    .board-frame{position:relative;min-width:0;background:linear-gradient(170deg,#cb8d0c 0%, #5b3c03 65%, #342100 100%);padding:2.5px;border-radius:12px;box-shadow:0 0 34px rgba(255,180,0,.12),0 8px 32px rgba(0,0,0,.58)}
    .board-frame.featured{box-shadow:0 0 52px rgba(255,180,0,.22),0 12px 40px rgba(0,0,0,.65)}
    .board{position:relative;height:100%;min-height:510px;border-radius:10px;overflow:hidden;background:linear-gradient(160deg, #181006 0%, #090603 100%)}
    .board-art{position:absolute;inset:0;background-size:cover;background-position:center center;filter:saturate(1.05) brightness(.42) blur(.2px);transform:scale(1.02)}
    .board-shade{position:absolute;inset:0;background:linear-gradient(180deg, rgba(5,3,1,.40), rgba(10,7,4,.52) 18%, rgba(10,7,4,.82) 100%)}
    .board-vignette{position:absolute;inset:0;background:radial-gradient(circle at 50% 12%, rgba(255,184,0,.12), transparent 26%), linear-gradient(0deg, rgba(0,0,0,.24), transparent 24%)}
    .board-content{position:relative;z-index:2;display:flex;flex-direction:column;height:100%;padding:20px 16px 16px}
    .board-emoji{font-size:34px;text-align:center;margin-bottom:10px;filter:drop-shadow(0 0 16px rgba(255,140,0,.4))}
    .board-title{font-size:11px;font-weight:800;letter-spacing:.28em;text-transform:uppercase;color:var(--gold);text-align:center;margin-bottom:4px;text-shadow:0 0 12px rgba(255,184,0,.28)}
    .board-sub{font-size:10px;letter-spacing:.14em;color:var(--muted);text-align:center;text-transform:uppercase;margin-bottom:14px}
    .board-divider{height:1px;background:linear-gradient(to right, transparent, rgba(255,184,0,.3), transparent);margin-bottom:12px}
    .board-items{flex:1;display:flex;flex-direction:column;gap:0}
    .board-item{display:flex;align-items:flex-end;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(255,184,0,.08);gap:12px}
    .board-item:last-child{border-bottom:none}
    .item-name-wrap{flex:1;min-width:0}
    .item-name{display:block;font-size:clamp(13px,1.2vw,16px);font-weight:600;color:var(--cream)}
    .item-sub{display:block;font-size:10px;color:var(--muted);letter-spacing:.06em;margin-top:2px}
    .item-price{font-size:clamp(16px,1.4vw,20px);font-weight:800;color:var(--blaze);white-space:nowrap;font-variant-numeric:tabular-nums}
    .item-price::before{content:'$';font-size:.65em;vertical-align:super}
    .board-note{margin-top:12px;padding-top:10px;border-top:1px solid rgba(255,184,0,.12);font-size:10px;color:var(--muted);letter-spacing:.10em;text-align:center;text-transform:uppercase}
    .heat-bar{max-width:1280px;margin:22px auto 0;width:100%;display:flex;align-items:center;gap:10px;padding:12px 18px;background:rgba(255,184,0,.04);border:1px solid rgba(255,184,0,.10);border-radius:10px}
    .heat-label-head{font-size:10px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
    .heat-levels{display:flex;gap:8px;flex-wrap:wrap}
    .heat-level{display:flex;align-items:center;gap:5px;padding:4px 10px;border:1px solid rgba(255,184,0,.15);border-radius:999px;font-size:11px;color:#d7bc92;background:rgba(0,0,0,.2)}
    .qr-section{max-width:1280px;margin:24px auto 0;width:100%;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
    .qr-card{display:flex;align-items:center;gap:16px;padding:18px 20px;background:rgba(255,184,0,.04);border:1px solid rgba(255,184,0,.14);border-radius:12px;box-shadow:var(--shadow)}
    .qr-img-wrap{width:88px;height:88px;flex-shrink:0;background:#0a0704;border-radius:8px;overflow:hidden;display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,184,0,.1)}
    .qr-img-wrap img,.qr-img-wrap canvas{width:88px !important;height:88px !important;image-rendering:pixelated}
    .qr-eyebrow{font-size:9px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
    .qr-title{font-size:16px;font-weight:800;color:var(--gold);margin-bottom:4px}
    .qr-url{font-size:11px;color:var(--muted);line-height:1.4;word-break:break-word}
    .build-strip{max-width:1280px;margin:16px auto 0;padding:8px 14px;border:1px dashed rgba(255,184,0,.16);border-radius:10px;font-size:11px;display:flex;justify-content:space-between;gap:8px;color:var(--muted)}
    .dev-fab{position:fixed;right:max(12px, env(safe-area-inset-right));bottom:max(12px, env(safe-area-inset-bottom));z-index:80;display:flex;flex-direction:column;gap:10px;align-items:flex-end}
    .dev-panel{display:none;flex-direction:column;gap:8px;padding:12px;background:rgba(12,8,5,.96);border:1px solid rgba(255,184,0,.2);border-radius:14px;box-shadow:var(--shadow);min-width:190px}
    .dev-panel.open{display:flex}
    .dev-kicker{font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
    .dev-btn,.dev-main-btn{border:1px solid rgba(255,184,0,.18);background:rgba(255,184,0,.06);color:var(--cream);border-radius:10px;padding:10px 12px;font-size:12px;font-weight:700;cursor:pointer;text-align:left}
    .dev-btn:hover,.dev-main-btn:hover{border-color:rgba(255,184,0,.42);background:rgba(255,184,0,.12)}
    .dev-main-btn{padding:12px 16px;background:linear-gradient(180deg, rgba(255,184,0,.20), rgba(255,184,0,.08));font-size:13px;border-radius:999px;display:flex;align-items:center;gap:8px;box-shadow:var(--shadow)}
    .assets-view{min-height:100vh}
    .assets-topbar,.cms-topbar,.tests-topbar{display:flex;align-items:center;gap:12px;padding:16px 24px;background:#100d08;border-bottom:1px solid rgba(255,184,0,.12);position:sticky;top:0;z-index:20}
    .assets-topbar-name,.tests-topbar-name{font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
    .assets-topbar-sub,.tests-topbar-sub{font-size:12px;color:var(--muted)}
    .assets-topbar-right,.cms-topbar-right,.tests-topbar-right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .btn-pri{padding:8px 16px;background:linear-gradient(180deg, var(--gold-hi), var(--gold));border:none;border-radius:8px;color:#0a0704;font-size:13px;font-weight:800;cursor:pointer}
    .btn-pri:hover{filter:brightness(1.07)}
    .btn-sec{padding:8px 13px;background:rgba(255,255,255,.04);border:1px solid rgba(255,184,0,.18);border-radius:8px;color:var(--muted);font-size:13px;cursor:pointer}
    .btn-sec:hover{color:var(--cream)}
    .assets-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:24px;padding:28px 24px 60px;max-width:1400px;margin:0 auto}
    .asset-card{display:flex;flex-direction:column;align-items:center;gap:12px}
    .asset-card-label{font-size:10px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);align-self:flex-start}
    .asset-preview{border:1px solid rgba(255,184,0,.18);border-radius:10px;overflow:hidden;box-shadow:var(--shadow);position:relative}
    .asset-size-note{font-size:10px;color:var(--muted);align-self:flex-start}
    .asset-dl-btn{align-self:stretch;padding:9px;background:rgba(255,184,0,.08);border:1px solid rgba(255,184,0,.2);border-radius:8px;color:var(--gold);font-size:12px;font-weight:700;cursor:pointer;text-align:center}
    .asset-dl-btn:hover{background:rgba(255,184,0,.16);color:var(--gold-hi)}
    .cms-view{display:flex;flex-direction:column;height:100vh;overflow:hidden}
    .dev-badge{padding:4px 9px;background:var(--ember);color:#130800;font-size:10px;font-weight:900;letter-spacing:.18em;border-radius:4px;flex-shrink:0}
    .cms-nav{display:flex;gap:3px;flex-wrap:wrap}
    .cms-tab{padding:6px 14px;border-radius:8px;border:1px solid transparent;background:transparent;color:var(--muted);font-size:13px;font-weight:600;cursor:pointer}
    .cms-tab.active{background:#20150b;border-color:rgba(255,184,0,.16);color:var(--cream)}
    .save-status{font-size:11px;color:var(--muted)}
    .cms-content{flex:1;overflow:hidden;display:flex;flex-direction:column}
    .cms-body{display:grid;grid-template-columns:220px 1fr;height:100%;overflow:hidden}
    .cms-sidebar{background:#100d08;border-right:1px solid rgba(255,184,0,.10);overflow-y:auto;padding:16px 10px;display:flex;flex-direction:column}
    .sidebar-label{font-size:10px;font-weight:700;letter-spacing:.20em;text-transform:uppercase;color:var(--muted);padding:0 10px;margin-bottom:10px}
    .sec-btn{display:block;width:100%;text-align:left;padding:9px 12px;border-radius:8px;border:1px solid transparent;background:transparent;color:#c8a36f;font-size:13px;font-weight:600;cursor:pointer;margin-bottom:4px}
    .sec-btn.active{color:var(--cream);background:#20150b;border-color:rgba(255,184,0,.16)}
    .sidebar-add{margin-top:auto;padding:12px 10px;border:none;background:transparent;color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;border-top:1px solid rgba(255,184,0,.10)}
    .cms-editor-area{overflow-y:auto;padding:28px 32px}
    .field-label{display:block;font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
    input[type="text"], textarea, select {width:100%;padding:10px 12px;background:rgba(0,0,0,.35);border:1px solid rgba(255,184,0,.16);border-radius:8px;color:var(--cream);font-size:14px;outline:none}
    input:focus, textarea:focus, select:focus{border-color:var(--blaze);box-shadow:0 0 0 3px rgba(255,140,0,.08)}
    textarea{resize:vertical;min-height:84px}
    .field-group{margin-bottom:16px}
    .sec-settings{background:#100d08;border:1px solid rgba(255,184,0,.14);border-radius:12px;padding:16px;margin-bottom:22px}
    .sec-settings-hd,.editor-subhead,.tab-section-title{font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:14px}
    .settings-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px}
    .settings-field{flex:1;min-width:160px}
    .item-cards{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
    .item-card{background:#100d08;border:1px solid rgba(255,184,0,.14);border-radius:10px;padding:14px}
    .item-card-hd{display:flex;align-items:center;gap:8px;margin-bottom:10px}
    .drag-handle{color:var(--muted-2);font-size:16px;cursor:grab;user-select:none}
    .name-input{flex:1;font-size:15px;font-weight:500}
    .btn-icon{width:28px;height:28px;display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,184,0,.14);border-radius:6px;background:transparent;color:var(--muted);cursor:pointer}
    .btn-icon.del:hover{color:#ff7777;border-color:#ff7777}
    .item-row-fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .add-item-btn{width:100%;padding:12px;border:1px dashed rgba(255,184,0,.2);border-radius:10px;background:transparent;color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;text-align:center}
    .preview-banner{position:sticky;top:0;z-index:10;background:rgba(16,13,8,.94);backdrop-filter:blur(8px);border-bottom:1px solid rgba(255,184,0,.1);padding:8px 24px;font-size:12px;color:var(--muted)}
    .tests-wrap{max-width:1180px;margin:0 auto;padding:28px 24px 60px}
    .tests-hero{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:18px;margin-bottom:22px}
    .tests-card,.diag-card{background:#100d08;border:1px solid rgba(255,184,0,.14);border-radius:14px;padding:18px;box-shadow:var(--shadow)}
    .tests-kicker{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
    .tests-title{font-size:26px;font-weight:900;letter-spacing:.04em;margin-bottom:8px}
    .tests-subcopy{font-size:13px;line-height:1.5;color:#d6b98b}
    .stat-num{font-size:38px;font-weight:900;color:var(--gold)}
    .stat-label{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
    .test-table{width:100%;border-collapse:collapse;font-size:13px;overflow:hidden;border-radius:12px;background:#100d08;border:1px solid rgba(255,184,0,.14)}
    .test-table th,.test-table td{padding:12px 14px;border-bottom:1px solid rgba(255,184,0,.08);text-align:left;vertical-align:top}
    .test-table th{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
    .pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.08em}
    .pill.pass{background:rgba(120,210,135,.12);color:var(--ok);border:1px solid rgba(120,210,135,.28)}
    .pill.fail{background:rgba(255,156,144,.12);color:var(--bad);border:1px solid rgba(255,156,144,.28)}
    .pill.warn{background:rgba(255,207,107,.12);color:var(--warn);border:1px solid rgba(255,207,107,.28)}
    .json-box{white-space:pre-wrap;word-break:break-word;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;line-height:1.5;color:#d6b98b;background:#0c0805;border:1px solid rgba(255,184,0,.12);border-radius:12px;padding:14px;max-height:320px;overflow:auto}
    .hidden{display:none !important}
    .signage-view{position:relative;min-height:100vh;width:100%;display:flex;flex-direction:column;padding:clamp(18px,2.4vw,38px);overflow:hidden}
    .signage-header{position:relative;z-index:2;display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:clamp(14px,2vw,28px)}
    .signage-brand-sub{font-size:clamp(9px,.8vw,13px);letter-spacing:.32em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
    .signage-brand-name{font-size:clamp(28px,4.2vw,64px);font-weight:900;letter-spacing:.08em;text-transform:uppercase;line-height:.92}
    .signage-view-label{font-size:clamp(9px,.85vw,13px);letter-spacing:.24em;text-transform:uppercase;color:var(--muted);text-align:right}
    .signage-stage{position:relative;z-index:2;flex:1;min-height:0;display:grid;gap:clamp(14px,1.5vw,24px);align-items:stretch}
    .signage-stage.single{grid-template-columns:minmax(0,1fr);max-width:980px;width:100%;margin:0 auto}
    .signage-stage.split{grid-template-columns:repeat(var(--split-cols,2),minmax(0,1fr));width:100%}
    .signage-stage .board-frame{height:100%}
    .signage-stage .board{min-height:0;height:100%}
    .signage-stage .board-content{padding:clamp(22px,2.4vw,40px)}
    .signage-stage .board-emoji{font-size:clamp(38px,4vw,74px);margin-bottom:clamp(8px,1vw,16px)}
    .signage-stage .board-title{font-size:clamp(14px,1.35vw,24px)}
    .signage-stage .board-sub{font-size:clamp(10px,.9vw,15px);margin-bottom:clamp(12px,1.3vw,22px)}
    .signage-stage .item-name{font-size:clamp(18px,1.8vw,31px)}
    .signage-stage .item-sub{font-size:clamp(10px,.8vw,14px)}
    .signage-stage .item-price{font-size:clamp(22px,2vw,36px)}
    .signage-stage .board-item{padding:clamp(10px,1.1vw,18px) 0}
    .signage-stage .board-note{font-size:clamp(10px,.8vw,14px);padding-top:clamp(10px,1vw,16px)}
    .signage-footer{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:clamp(14px,1.8vw,24px);font-size:clamp(9px,.8vw,12px);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
    .signage-heat{display:flex;gap:8px;flex-wrap:wrap}
    .signage-heat span{padding:5px 9px;border:1px solid rgba(255,184,0,.14);border-radius:999px;background:rgba(0,0,0,.2)}
    .video-view{position:relative;min-height:100vh;width:100%;overflow:hidden;background:#000}
    .video-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
    .video-scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.30),rgba(8,5,3,.72) 58%,rgba(8,5,3,.90))}
    .video-view .signage-view{background:transparent}
    .video-view .board-art{opacity:.36}
    .signage-error{margin:auto;max-width:760px;text-align:center;padding:28px;border:1px solid rgba(255,184,0,.18);border-radius:16px;background:rgba(10,7,4,.76)}
    .signage-error h2{color:var(--gold);margin-bottom:10px}
    .signage-error p{color:var(--muted);line-height:1.5}

    /* 55-inch TV board composer --------------------------------------- */
    .signage-view.tv-signage{height:100vh;min-height:100vh;width:100vw;padding:0;background:
      radial-gradient(circle at 78% 12%,rgba(255,140,0,.10),transparent 26%),
      radial-gradient(circle at 18% 88%,rgba(232,93,12,.08),transparent 30%),
      linear-gradient(145deg,#0d0804,#050302 72%);}

function normalizeData(data){
  const base = clone(DEFAULTS);
  if (!data || typeof data !== 'object') return base;
  const out = { ...base, ...data };
  out.restaurant = { ...base.restaurant, ...(data.restaurant || {}) };
  out.heatLevels = Array.isArray(data.heatLevels) && data.heatLevels.length ? data.heatLevels : base.heatLevels;
  const sourceBoards = Array.isArray(data.boards) && data.boards.length ? data.boards : base.boards;
  out.boards = sourceBoards.map((b, i) => {
    const def = base.boards.find(x => x.id === b.id) || base.boards[i] || {};
    const merged = { ...def, ...b };
    merged.items = Array.isArray(b.items) && b.items.length ? b.items : (def.items || [{name:'Item',price:'',sub:''}]);
    merged.signage = { ...defaultSignage(merged), ...(def.signage || {}), ...(b.signage || {}) };

    merged.signage.showArt = merged.signage.showArt !== false;
    if (!SIGNAGE_FORMAT_IDS.has(merged.signage.layout)) merged.signage.layout = 'editorial';

    return merged;
  });

function parseViewParams(search = location.search){
  const p = new URLSearchParams(search);
  const requestedView = (p.get('view') || 'menu').trim().toLowerCase();
  const allowedView = PUBLIC_VIEWS.has(requestedView) || (DEV_VIEWS.has(requestedView) && p.get('dev') === DEV_SECRET_QUERY_VALUE);
  const rawInterval = Number.parseInt(p.get('interval') || '8000', 10);
  return {
    view: allowedView ? requestedView : 'menu',
    id: p.get('id') || p.get('board') || '',
    index: p.get('index') || p.get('screen') || '',
    boards: (p.get('boards') || '').split(',').map(v => v.trim()).filter(Boolean),

    format: SIGNAGE_FORMAT_IDS.has((p.get('format') || '').trim().toLowerCase()) ? (p.get('format') || '').trim().toLowerCase() : ''

}

function resolveBoard(ref){
  const boards = D && Array.isArray(D.boards) ? D.boards : [];

function renderTVBoardCanvas(board, plasma = true, formatOverride = ''){

function startSlideshow(intervalMs, refs = [], startRef = ''){
  const sequence = resolveBoards(refs.length ? refs : D.boards.map(b => b.id));
  if (!sequence.length) return;
  let currentIndex = Math.max(0, sequence.findIndex(b => b === resolveBoard(startRef)));
  if (currentIndex < 0) currentIndex = 0;
  const app = document.getElementById('app');
  if (!app) return;
  app.innerHTML = renderSingleBoardView(sequence[currentIndex].id);
  window.activeSlideshow = setInterval(() => {
    currentIndex = (currentIndex + 1) % sequence.length;
    const container = document.getElementById('app');
    if (container) container.innerHTML = renderSingleBoardView(sequence[currentIndex].id);
  }, intervalMs);
}

function makeQR(url, sizePx = 120, dark = '#FFB800', light = '#080503'){
  return new Promise(resolve => {
    const div = document.createElement('div'); div.style.cssText='width:120px;height:120px;'; document.getElementById('qr-factory').appendChild(div);
    try { new QRCode(div, { text:url, width:sizePx, height:sizePx, colorDark:dark, colorLight:light, correctLevel:QRCode.CorrectLevel.M }); }
    catch { resolve(''); return; }
    setTimeout(() => { const canvas = div.querySelector('canvas'); resolve(canvas ? canvas.toDataURL() : ''); div.remove(); }, 80);
  });
}

function testResult(name, pass, detail){ return { name, pass: !!pass, detail: detail || '' }; }
function runTestSuite(persist = true){
  const params = new URLSearchParams('dev=1');
  const sampleBoard = DEFAULTS.boards[0];
  const sampleHTML = renderMenuHTML(DEFAULTS);
  const results = [
    testResult('brand-rename', DEFAULTS.restaurant.name === "HECK'S CHICKEN", DEFAULTS.restaurant.name),
    testResult('dev-secret-exact-match', params.get('dev') === DEV_SECRET_QUERY_VALUE, 'expected ?dev=1 exact gating'),
    testResult('share-metadata-fields', !!DEFAULTS.restaurant.shareUrl && !!DEFAULTS.restaurant.previewImage && !!DEFAULTS.restaurant.shareDescription, 'share URL, preview image, and description populated'),
    testResult('graphics-overlay-board-config', DEFAULTS.boards.every(b => typeof b.art === 'string' && b.art.length > 0), 'each board has a configurable art URL'),
    testResult('menu-render-count', (sampleHTML.match(/class="board-frame/g) || []).length === DEFAULTS.boards.length, `${DEFAULTS.boards.length} boards rendered`),
    testResult('asset-pack-count', TEMPLATES.length >= 6, `${TEMPLATES.length} templates`),
    testResult('test-suite-version-bumped', TEST_SUITE_VERSION >= 5, `v${TEST_SUITE_VERSION}`),
    testResult('storage-key-versioned', /_v2$/.test(STORAGE_KEY), STORAGE_KEY),
    testResult('board-item-shape', sampleBoard.items.every(i => 'name' in i && 'price' in i && 'sub' in i), 'overlay data shape stable'),
    testResult('public-board-route', parseViewParams('?view=board&id=nuggets').view === 'board', 'public signage route does not require dev mode'),
    testResult('dev-view-gated', parseViewParams('?view=cms').view === 'menu' && parseViewParams('?dev=1&view=cms').view === 'cms', 'backstage views still require ?dev=1'),
    testResult('router-aliases', parseViewParams('?view=board&board=bird&screen=2').id === 'bird' && parseViewParams('?view=board&screen=2').index === '2', 'board/screen aliases supported'),
    testResult('video-src-alias', parseViewParams('?view=video&src=promo.mp4').videoUrl === 'promo.mp4', '?src= supported for video'),
    testResult('slideshow-interval-clamped', parseViewParams('?view=slideshow&interval=250').interval === 1000, 'minimum 1000 ms'),
    testResult('signage-copy-config', DEFAULTS.boards.every(b => b.signage && b.signage.headline && b.signage.steps), 'every release board has authored 55-inch copy'),
    testResult('tv-board-render', /tv-story-headline/.test(renderTVBoardCanvas(DEFAULTS.boards[0], false)) && /tv-order-rail/.test(renderTVBoardCanvas(DEFAULTS.boards[0], false)), 'single board renders editorial + ordering rail'),
    testResult('legacy-data-normalized', !!normalizeData({restaurant:{name:'Legacy'},boards:[{id:'old',title:'Old',items:[{name:'Item',price:'1',sub:''}]}]}).boards[0].signage, 'legacy localStorage gains signage defaults'),
    testResult('format-library-size', SIGNAGE_FORMATS.length >= 10, `${SIGNAGE_FORMATS.length} menu formats available`),
    testResult('format-query-override', parseViewParams('?view=board&id=nuggets&format=price-matrix').format === 'price-matrix', '?format= can preview a layout without changing board data'),
    testResult('matrix-render', /matrix-stage/.test(renderTVBoardCanvas(DEFAULTS.boards[3], false, 'price-matrix')), 'price matrix renderer available'),
    testResult('combo-render', /combo-stage/.test(renderTVBoardCanvas(DEFAULTS.boards[1], false, 'combo-stack')), 'drive-thru combo renderer available'),
    testResult('item-photo-normalized', 'photo' in normalizeData({boards:[{id:'x',title:'X',items:[{name:'One',price:'1'}]}]}).boards[0].items[0], 'optional food photography field survives legacy data')
  ];
  const passed = results.filter(r => r.pass).length;
  const payload = {
    suiteVersion: TEST_SUITE_VERSION,
    appVersion: APP_VERSION,
    channel: RELEASE_CHANNEL,
    timestamp: new Date().toISOString(),
    pass: passed === results.length,
    passed,
    total: results.length,
    results
  };
  if (persist) {
    try { localStorage.setItem(TEST_RESULTS_KEY, JSON.stringify(payload)); } catch {}
  }
  latestTestResults = payload;
  return payload;
}
function readTestResults(){ try { const raw = localStorage.getItem(TEST_RESULTS_KEY); return raw ? JSON.parse(raw) : null; } catch { return null; } }
window.runTestsAndRefresh = function(){ latestTestResults = runTestSuite(true); renderApp(currentView()); };
window.clearTestResults = function(){ localStorage.removeItem(TEST_RESULTS_KEY); latestTestResults = runTestSuite(true); renderApp(currentView()); };
function renderTestsPage(){
  const r = latestTestResults || runTestSuite(false);
  return `<div><div class="tests-topbar"><div><div class="tests-topbar-name">Release Engineering Factory</div><div class="tests-topbar-sub">Persisted test suite v${TEST_SUITE_VERSION} · ${esc(APP_VERSION)}</div></div><div class="tests-topbar-right">${devMode() ? `<button class="btn-sec" onclick="setView('menu')">Menu</button><button class="btn-sec" onclick="setView('cms')">CMS</button><button class="btn-sec" onclick="setView('assets')">Assets</button>` : ''}<button class="btn-sec" onclick="runTestsAndRefresh()">Run Again</button></div></div><div class="tests-wrap"><div class="tests-hero"><div class="tests-card"><div class="tests-kicker">Mission Status</div><div class="tests-title">Heck's Chicken release candidate</div><div class="tests-subcopy">This round turns signage into a reusable menu-format library: editorial, numbered combo, promo rail, price matrix, classic board, type columns, photo-led catalog, split feature, minimal list, and more. The same menu data can move between formats, with optional food photography rather than baked graphic boards.</div></div><div class="diag-card"><div class="tests-kicker">Result</div><div class="stat-num">${r.passed}/${r.total}</div><div class="stat-label">tests passed</div><div style="margin-top:10px"><span class="pill ${r.pass ? 'pass' : 'fail'}">${r.pass ? 'Release-ready' : 'Needs attention'}</span></div></div></div><table class="test-table"><thead><tr><th>Test</th><th>Status</th><th>Detail</th></tr></thead><tbody>${r.results.map(t => `<tr><td>${esc(t.name)}</td><td><span class="pill ${t.pass ? 'pass' : 'fail'}">${t.pass ? 'PASS' : 'FAIL'}</span></td><td>${esc(t.detail)}</td></tr>`).join('')}</tbody></table><div style="height:18px"></div><div class="diag-card"><div class="tests-kicker">Persisted Payload</div><div class="json-box">${esc(JSON.stringify(r, null, 2))}</div></div></div></div>`;
}

function renderApp(view = currentView()){
  syncMetaTags(D);
  const app = document.getElementById('app');
  const params = getViewParams();
  const activeView = view || params.view;

  if (window.activeSlideshow) {
    clearInterval(window.activeSlideshow);
    window.activeSlideshow = null;
  }

  if (activeView === 'board') {
    app.innerHTML = renderSingleBoardView(params.id || params.index);
  } else if (activeView === 'split') {
    app.innerHTML = renderSplitView(params.boards);
  } else if (activeView === 'slideshow') {
    startSlideshow(params.interval, params.boards, params.id || params.index);
  } else if (activeView === 'video') {
    app.innerHTML = renderVideoView(params.videoUrl, params.boards);
  } else if (activeView === 'assets' && devMode()) {
    app.innerHTML = renderAssets() + renderDevFAB();
  } else if (activeView === 'cms' && devMode()) {
    app.innerHTML = renderCMS();
  } else if (activeView === 'tests' && devMode()) {
    app.innerHTML = renderTestsPage();
  } else {
    app.innerHTML = renderMenuHTML(D) + renderDevFAB();
  }

  if (activeView === 'menu' || activeView === 'cms') injectQRsIntoMenu();
}

async function init(){
  D = loadData();
  syncMetaTags(D);
  if (typeof QRCode !== 'undefined') {
    [menuQRDataUrl, gameQRDataUrl] = await Promise.all([
      makeQR(D.restaurant.menuUrl, 120, '#FFB800', '#080503'),
      makeQR(D.restaurant.gameUrl, 120, '#FFB800', '#080503')
    ]);
  }
  latestTestResults = readTestResults() || runTestSuite(true);
  renderApp(currentView());
}


window.addEventListener('popstate', () => renderApp(currentView()));

init();
</script>
