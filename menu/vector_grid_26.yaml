vector_grid_26:
  z_plus_top:
    - coordinate: [-1, +1, +1]
      view_name: "back-left-top"
    - coordinate: [0, +1, +1]
      view_name: "back-top"
    - coordinate: [+1, +1, +1]
      view_name: "back-right-top"

    - coordinate: [-1, 0, +1]
      view_name: "left-top"
    - coordinate: [0, 0, +1]
      view_name: "top"
    - coordinate: [+1, 0, +1]
      view_name: "right-top"

    - coordinate: [-1, -1, +1]
      view_name: "front-left-top"
    - coordinate: [0, -1, +1]
      view_name: "front-top"
    - coordinate: [+1, -1, +1]
      view_name: "front-right-top"

  z_zero_middle:
    - coordinate: [-1, +1, 0]
      view_name: "back-left"
    - coordinate: [0, +1, 0]
      view_name: "back"
    - coordinate: [+1, +1, 0]
      view_name: "back-right"

    - coordinate: [-1, 0, 0]
      view_name: "left"
    - coordinate: [0, 0, 0]
      view_name: "origin_empty"
    - coordinate: [+1, 0, 0]
      view_name: "right"

    - coordinate: [-1, -1, 0]
      view_name: "front-left"
    - coordinate: [0, -1, 0]
      view_name: "front"
    - coordinate: [+1, -1, 0]
      view_name: "front-right"

  z_minus_bottom:
    - coordinate: [-1, +1, -1]
      view_name: "back-left-bottom"
    - coordinate: [0, +1, -1]
      view_name: "back-bottom"
    - coordinate: [+1, +1, -1]
      view_name: "back-right-bottom"

    - coordinate: [-1, 0, -1]
      view_name: "left-bottom"
    - coordinate: [0, 0, -1]
      view_name: "bottom"
    - coordinate: [+1, 0, -1]
      view_name: "right-bottom"

    - coordinate: [-1, -1, -1]
      view_name: "front-left-bottom"
    - coordinate: [0, -1, -1]
      view_name: "front-bottom"
    - coordinate: [+1, -1, -1]
      view_name: "front-right-bottom"
      